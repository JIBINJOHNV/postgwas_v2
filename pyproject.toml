[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postgwas"
version = "1.0.0"
description = "Configuration-driven workflows for reproducible post-GWAS analysis"
readme = "README.md"
authors = [{name = "Jibin John"}]
requires-python = ">=3.10"
keywords = [
    "bioinformatics",
    "genome-wide association study",
    "human genetics",
    "post-GWAS",
    "statistical genetics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6",
    "rich>=13",
    "rich-argparse>=1.6",
]

[project.optional-dependencies]
analysis = [
    "dask[dataframe]>=2023.5",
    "fastparquet>=2024.2",
    "marshmallow==2.18.1",
    "numpy>=1.23,<3",
    "pandas>=2,<3",
    "polars>=0.20",
    "psutil>=5.9",
    "pyliftover>=0.4.1",
    "pyarrow>=12",
    "pysam>=0.22",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "xgboost>=2",
]
enrichment = [
    "gprofiler-official>=1.0",
    "gseapy>=1",
    "matplotlib>=3.7",
    "networkx>=3",
    "requests>=2.31",
]
single-cell = [
    "anndata==0.8.0",
    "matplotlib>=3.7,<3.8",
    "numba==0.57.1",
    "numpy>=1.23,<1.24",
    "scanpy==1.9.3",
    "scikit-learn>=1.3,<1.4",
    "scikit-misc==0.3.1",
    "scdrs @ git+https://github.com/martinjzhang/scDRS.git@1518b56c73eb23c6ca20999d439aaa31a6b7624b",
    "umap-learn==0.5.5",
]
test = [
    "build>=1",
    "pytest>=8",
]

[project.scripts]
postgwas = "postgwas.__main__:main"

[project.urls]
Documentation = "https://github.com/JIBINJOHNV/postgwas_v2/tree/main/docs/wiki"
Issues = "https://github.com/JIBINJOHNV/postgwas_v2/issues"
Repository = "https://github.com/JIBINJOHNV/postgwas_v2"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
postgwas = [
    "**/*.yaml",
    "**/*.yml",
    "**/*.R",
    "**/*.r",
    "**/*.gmt",
    "**/*.sav",
    "**/*.txt",
]
