name: Validate installation

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/installation.yml"
      - "Dockerfile"
      - "environment.yml"
      - "pyproject.toml"
      - "tools/setup/**"
      - "tools/resource_preparation/prepare_kpops_caldera_resources.sh"
      - "src/postgwas/modules/enrichment/main.py"
      - "src/postgwas/modules/enrichment/providers/dsigdb.py"
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/installation.yml"
      - "Dockerfile"
      - "environment.yml"
      - "pyproject.toml"
      - "tools/setup/**"
      - "tools/resource_preparation/prepare_kpops_caldera_resources.sh"
      - "src/postgwas/modules/enrichment/main.py"
      - "src/postgwas/modules/enrichment/providers/dsigdb.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-syntax:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Validate installer shell syntax
        run: |
          for script in tools/setup/*.sh tools/setup/container/*.sh; do
            bash -n "$script" || exit
          done

  complete-linux-mamba:
    needs: installer-syntax
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Miniforge with Mamba
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: base
          use-mamba: true

      - name: Install and verify the complete PostGWAS environment
        run: >-
          bash tools/setup/install_postgwas.sh
          --all-tools
          --name postgwas-ci
          --jobs 2
