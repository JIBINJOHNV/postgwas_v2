name: Validate and publish Wiki documentation

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "tools/docs/**"
      - "tests/test_wiki_docs.py"
      - ".github/workflows/wiki-docs.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "tools/docs/**"
      - "tests/test_wiki_docs.py"
      - ".github/workflows/wiki-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation test dependencies
        run: python -m pip install -e ".[analysis]" "pytest>=8"

      - name: Validate Wiki sources and generated navigation
        run: python -m pytest -p no:cacheprovider tests/test_wiki_docs.py -q

      - name: Validate documented commands and options
        run: python tools/docs/validate_wiki_cli.py

  publish:
    name: Publish generated Wiki
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Wiki build dependency
        run: python -m pip install "PyYAML>=6"

      - name: Clone initialized Wiki repository
        env:
          WIKI_REPOSITORY_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
        run: |
          if ! git clone "$WIKI_REPOSITORY_URL" wiki-repository; then
            echo "::error::Enable the repository Wiki and save its initial Home page before publishing."
            exit 1
          fi

      - name: Adopt the initial Home page on first publication
        run: |
          if [[ ! -f wiki-repository/.postgwas-wiki-files ]]; then
            if [[ ! -f wiki-repository/Home.md ]]; then
              echo "::error::The Wiki repository has no initial Home.md page."
              exit 1
            fi
            printf '%s\n' Home.md > wiki-repository/.postgwas-wiki-files
          fi

      - name: Build managed Wiki tree
        run: python tools/docs/build_wiki.py --output wiki-repository

      - name: Commit and push changed Wiki pages
        working-directory: wiki-repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki content is already current."
          else
            git commit -m "Publish Wiki from $GITHUB_SHA"
            git push origin HEAD
          fi
