name: Validate user documentation

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "tools/docs/**"
      - ".github/workflows/wiki-docs.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "tools/docs/**"
      - ".github/workflows/wiki-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install documentation validation dependencies
        run: python -m pip install -e ".[analysis]"

      - name: Validate Wiki sources and generated navigation
        run: python tools/docs/build_wiki.py --check

      - name: Validate canonical harmonisation policy documentation
        run: python tools/docs/update_harmonisation_policies.py --check

      - name: Validate documented commands and options
        run: python tools/docs/validate_wiki_cli.py
