name: postgwas
variables:
  # Prevent an unrelated per-user R library from shadowing this environment.
  R_LIBS_USER: /dev/null
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Supported analysis/single-cell line. The current Numba stack requires Python <3.12.
  - python=3.10
  - pip>=25
  - setuptools>=68
  - wheel
  - git
  # Source-build tools used by the pinned bcftools liftover plugin installer.
  - c-compiler
  - make
  - curl
  - tar
  - bzip2

  # PostGWAS core and analysis runtime.
  - pydantic>=2.7,<3
  - pyyaml>=6
  - rich>=13
  - rich-argparse>=1.6
  - numpy=1.23.5
  - pandas=2.0.3
  - scipy=1.10.1
  - scikit-learn=1.3.2
  - fastparquet>=2024.2
  - pyarrow>=12
  - psutil>=5.9
  - pyliftover>=0.4.1
  - pysam>=0.22
  - requests>=2.31
  - xgboost>=2,<3
  - pytorch>=2.1,<3

  # Native command-line tools available through Conda on the target platform.
  - bcftools=1.23.1
  - htslib>=1.21
  - bedtools>=2.31
  - pigz
  - plink
  # These Bioconda packages are unavailable on native Apple Silicon.
  - sel(linux): plink2
  - sel(linux): gcta
  - sel(linux): bgenix

  # R runtime used by SuSiE, plotting, CALDERA, and related adapters.
  - r-base=4.3.*
  - r-argparse
  - r-cowplot
  - r-data.table
  - r-dplyr
  - r-ggplot2
  - r-ggrepel
  - r-glue
  - r-jsonlite
  - r-matrix
  - r-optparse
  - r-patchwork
  - r-processx
  - r-r.utils
  - r-rcolorbrewer
  - r-susier

  # Packages unavailable or intentionally fixed through PyPI.
  - pip:
      - anndata==0.8.0
      - biopython==1.81
      - build>=1
      - dask[dataframe]==2023.5.0
      - gprofiler-official>=1.0
      - gseapy>=1
      - marshmallow==2.18.1
      - matplotlib>=3.7,<3.8
      - networkx>=3
      - numba==0.57.1
      - polars-lts-cpu==0.20.31
      - pytest>=8,<9
      - scanpy==1.9.3
      - scikit-misc==0.3.1
      - scdrs @ git+https://github.com/martinjzhang/scDRS.git@1518b56c73eb23c6ca20999d439aaa31a6b7624b
      - umap-learn==0.5.5
