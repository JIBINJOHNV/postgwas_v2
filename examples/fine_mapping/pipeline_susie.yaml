# Pipeline SuSiE example. Reference paths remain explicit CLI inputs.
config_version: 1

run:
  output_directory: results/pipeline_susie
  dataset_id: STUDY
  overwrite: false
  resume: true

execution:
  threads: 4
  memory_gb: 32

pipeline:
  modules: [ld_annotation, formatting, ld_clumping, fine_mapping]

modules:
  ld_annotation:
    enabled: true
    genome_build: GRCh37
    populations: [EUR]
  formatting:
    enabled: true
  ld_clumping:
    enabled: true
    population: EUR
  fine_mapping:
    enabled: true
    engine: susie
    genome_build: GRCh37
