# Pipeline SuSiE example using standard LD-reference clumping.
config_version: 1

run:
  output_directory: results/pipeline_susie
  dataset_id: STUDY
  overwrite: false
  resume: true

execution:
  threads: 4
  memory_gb: 32

pipeline:
  modules: [ld_clumping, formatting, fine_mapping]

modules:
  formatting:
    enabled: true
  ld_clumping:
    enabled: true
    methods: [standard]
    population: EUR
  fine_mapping:
    enabled: true
    engine: susie
    genome_build: GRCh37
