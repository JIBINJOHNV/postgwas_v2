enabled: false
inputs:
  vcf: null
  dataset_id: null
output_directory: null
methods: [region, standard]
genome_build: GRCh37
population: EUR
lead_pvalue: 5.0e-8
candidate_pvalue: 0.05
clump_r2: 0.6
lead_r2: 0.1
window_kb: 250
merge_distance_bp: 250000
missing_index_action: error
remove_mhc: true
mhc_regions:
  GRCh37:
    chromosome: "6"
    start: 28477797
    end: 33448354
  GRCh38:
    chromosome: "6"
    start: 28510120
    end: 33480577
summary_pvalue_thresholds:
  n_5e_8: 5.0e-8
  n_5e_5: 5.0e-5
  n_0_05: 0.05
reference:
  directory: null
  manifest_filename: ld_reference.yaml
  file_pattern: "{population}_chr{chromosome}.ld.gz"
  index_suffix: .tbi
  format_version: 1
  orientation: symmetric_first_endpoint
  columns:
    - chromosome_a
    - position_a
    - variant_a
    - chromosome_b
    - position_b
    - variant_b
    - r2
vcf_fields:
  chromosome: "%CHROM"
  position: "%POS"
  reference_allele: "%REF"
  alternate_allele: "%ALT"
  variant_id: "%ID"
  effect: "[%ES]"
  standard_error: "[%SE]"
  allele_frequency: "[%AF]"
  log_pvalue: "[%LP]"
  ld_block: "%INFO/{population}_LDblock"
table:
  delimiter: "\t"
  null_values: [".", "NA", ""]
  infer_schema_length: 20000
  io_buffer_bytes: 1048576
  biallelic_include_expression: "N_ALT=1"
compute:
  minimum_worker_memory_gb: 1.0
  input_memory_multiplier: 1.1
output_layout:
  region_working_table: ".working/{dataset_id}_region_query.tsv"
  region_raw_table: "{dataset_id}_vcf.tsv.gz"
  region_pruned_table: "{dataset_id}_LDpruned_{population}.tsv"
  region_significant_table: "{dataset_id}_LDpruned_{population}_sig.tsv"
  region_log: "logs/{dataset_id}_ld_clump_region.log"
  standard_working_table: ".working/{dataset_id}_standard_query.tsv"
  standard_formatted_table: "{dataset_id}_formatted.tsv"
  standard_log: "logs/{dataset_id}_ld_clump_standard.log"
  standard_summary: "{dataset_id}_GenomicRiskLoci_Summary.txt"
  standard_hierarchy: "{dataset_id}_GenomicRiskLoci_Hierarchy.txt"
  standard_independent_clusters: "{dataset_id}_IndSig_Clusters_Boundaries.txt"
  standard_lead_clusters: "{dataset_id}_Lead_Clusters_LD_Only.txt"
  canonical_log: "logs/{dataset_id}_ld_clumping.log"
  resolved_configuration: "run_metadata/{dataset_id}_ld_clumping_resolved.yaml"
