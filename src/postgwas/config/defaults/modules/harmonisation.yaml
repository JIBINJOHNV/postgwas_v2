      - '19'
      - '20'
      - '21'
      - '22'
      - X
      help: |-
        What it does: The chromosome labels that survive the coordinate step; every other non-empty
          label is removed with the separate unsupported_chromosome rejection reason.
        When it applies: chromosome step 02, and the same coordinate step run inside dataset step
          03. It is consulted after chromosome.rename_map has renamed labels, and
          chromosome.drop_mt can remove MT from this list but never adds an unlisted chromosome.
        Values:
          Every member is a label that is kept, labels are compared in upper case, and this list's
          order is used when the validated per-chromosome VCFs are concatenated. Keep that order
          consistent with the reference-contig order. The packaged list is exactly 1-22 and X.
          The validator accepts Y, XY and MT only for an explicit advanced override.
        Example: PLINK 25, XY, PAR1 and PAR2 are first normalized to X and therefore survive this
          list. Y, MT, scaffolds and alternative contigs do not survive it.
        Note: chromosome.allowed uses the same packaged list, so unsupported chromosomes are
          removed once and cannot reach chromosome resource preflight or VCF creation.
      origin: coordinates.py:119; vcf_processing.py:concat_vcfs_by_build
