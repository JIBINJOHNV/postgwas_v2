  build_check_mapping:
    chromosome: CHROM
    position: POS
    effect_allele: REF
    other_allele: ALT
    delimiter: tab

  # Paths are relative to resources.root/--resource-directory. The available
  # fields are build, target_build, source_build, source and chromosome.
  resource_layout:
    default_eaf: "{build}/default_af/tab_files/{build}_{source}_freq_chr{chromosome}.tsv.gz"
    comparison_af: "{build}/external_af/vcf_files/{build}_{source}_freq_chr{chromosome}.vcf.gz"
    dbsnp: "{build}/dbSNP/vcf_files/{build}_{source}_chr{chromosome}.vcf.gz"
    fasta: "{build}/fasta_files/{build}_chr{chromosome}.fa"
    annotation: "{build}/gff_files/{build}_ensembl.gff3.gz"
    chain: "chain_files/{source_build}_to_{target_build}.chain"
    build_check: "GRCh37_38_check_files/{build}_check_file.tsv"

  # dataset_directory is the harmonisation result root below the run output.
  # Every remaining path is relative to that root and is shared by
  # harmonisation, concordance validation, and cleanup.
  output_layout:
    dataset_directory: '{dataset_id}/harmonisation'
    logs_directory: logs
    rejected_directory: rejected
    frequency_qc_directory: eaf_qc
    qc_directory: qc_summary
    concordance_directory: qc_summary/concordance
    adapter_log_directory: logs/adapters/gwas2vcf
    chromosome_table: '{dataset_id}_chr{chromosome}.parquet'
    chromosome_source_snapshot: 'rejected/{dataset_id}_chr{chromosome}_source.parquet'
    chromosome_log: 'logs/{dataset_id}_chr{chromosome}.log'
    chromosome_reject: 'rejected/{dataset_id}_chr{chromosome}_rejected.tsv'
    input_reject: 'rejected/{dataset_id}_input_rejected.tsv'
    duplicates: 'qc_summary/{dataset_id}_duplicates.tsv'
    post_orientation_duplicates: 'qc_summary/{dataset_id}_post_orientation_duplicates_chr{chromosome}.tsv'
    adapter_input: '{dataset_id}_chr{chromosome}_vcf_input.tsv'
    adapter_mapping: '{dataset_id}_chr{chromosome}.dict'
    adapter_summary: '{dataset_id}_chr{chromosome}_summary.tsv'
    adapter_merged_mapping: 'qc_summary/{dataset_id}_gwas2vcf_column_mapping.json'
    adapter_input_archive: 'qc_summary/{dataset_id}_gwas2vcf_input'
    adapter_transcript: 'logs/adapters/gwas2vcf/{dataset_id}_chr{chromosome}.log'
    adapter_output_vcf: '{dataset_id}_chr{chromosome}_{build}.vcf'
    bcftools_transcript: 'logs/{dataset_id}_chr{chromosome}_bcftools_transcript.log'
    chromosome_raw_vcf: '{dataset_id}_chr{chromosome}_{build}.vcf.gz'
    chromosome_normalized_vcf: '{dataset_id}_chr{chromosome}_{build}_NORM.vcf.gz'
    chromosome_id_vcf: '{dataset_id}_chr{chromosome}_{build}_ID.vcf.gz'
    chromosome_frequency_vcf: '{dataset_id}_chr{chromosome}_{build}_EAF.vcf.gz'
    chromosome_annotated_vcf: '{dataset_id}_chr{chromosome}_{build}_CSQ.vcf.gz'
    chromosome_lifted_vcf: '{dataset_id}_chr{chromosome}_{target_build}_CSQ.vcf.gz'
    chromosome_not_lifted_vcf: '{dataset_id}_chr{chromosome}_{target_build}_CSQ_notlifted.vcf.gz'
    sort_temp_directory: 'temp_chr{chromosome}'
    merged_build_vcf: '{dataset_id}_{build}_merged.vcf.gz'
    merged_raw_vcf: '{dataset_id}_gwas2vcf_{build}_merged.vcf.gz'
    merged_not_lifted_vcf: '{dataset_id}_notlifted_{target_build}_merged.vcf.gz'
    dataset_reject: 'rejected/{dataset_id}_rejected_variants.tsv.gz'
    reject_summary: 'qc_summary/{dataset_id}_reject_reasons.tsv'
    run_manifest: '{dataset_id}_run_manifest.json'
    field_completeness: 'qc_summary/{dataset_id}_field_completeness.tsv'
    qc_summary: 'qc_summary/{dataset_id}_chromosomewise_harmonisation_metrics.tsv'
    gwas2vcf_summary: 'qc_summary/{dataset_id}_pre_vcf_column_statistics.tsv'
    population_frequency_qc: 'qc_summary/{dataset_id}_{build}_population_frequency_qc.json'
    population_frequency_temporary: 'qc_summary/.{dataset_id}_{build}_population_frequency_'
    # Plain-text stdout transcript at the dataset harmonisation root.
    screen_report: '{dataset_id}_screen_report.txt'
    # Standalone presentation of the persisted manifest and QC evidence.
    html_report: '{dataset_id}_harmonisation_report.html'
    dataset_log: 'logs/{dataset_id}_dataset.log'
    combined_log: 'logs/{dataset_id}_combined.log'
    concordance_log: 'logs/{dataset_id}_concordance_validation.log'
    concordance_summary: 'qc_summary/concordance/{dataset_id}_concordance_summary.tsv'
    concordance_mismatches: 'qc_summary/concordance/{dataset_id}_concordance_mismatches.tsv.gz'
    concordance_input_only: 'qc_summary/concordance/{dataset_id}_input_only.tsv.gz'
    concordance_vcf_only: 'qc_summary/concordance/{dataset_id}_vcf_only.tsv.gz'
    concordance_vcf_duplicates: 'qc_summary/concordance/{dataset_id}_vcf_duplicate_records.tsv.gz'
    concordance_position_matches: 'qc_summary/concordance/{dataset_id}_same_position_matches.tsv.gz'
    concordance_all_matches: 'qc_summary/concordance/{dataset_id}_all_matches.tsv.gz'
    concordance_temporary: 'qc_summary/concordance/.{dataset_id}_vcf_'
    missing_eaf: 'eaf_qc/{dataset_id}_missing_eaf_chr{chromosome}.tsv'
    out_of_range_eaf: 'eaf_qc/{dataset_id}_outofbound_eaf_chr{chromosome}.tsv'
    external_eaf_partition: 'qc_summary/.external_reference/{dataset_id}_eaf_chr{chromosome}.parquet'
    external_info_partition: 'qc_summary/.external_reference/{dataset_id}_info_chr{chromosome}.parquet'

  gwas2vcf_input:
    required_column_keys: [chr_col, pos_col, snp_id_col, ea_col, oa_col, eaf_col, beta_col, se_col, imp_z_col, pval_col, ncontrol_col]
    optional_column_keys: [ncase_col, imp_info_col]
    # Appended after every mapped scientific column. Audit columns remain in
    # the TSV for provenance but are deliberately absent from the positional
    # JSON mapping, so the bundled GWAS-to-VCF adapter ignores them.
    audit_columns: [strand_action]
    renamed_keys: {snp_id_col: snp_col}
    delimiter: "\t"
    header: true

  # VCF fields and build transitions passed to bcftools. These are explicit so
  # a reference panel with different INFO tags can be configured without code.
  vcf_processing:
    external_frequency_columns: [CHROM, POS, REF, ALT, INFO/AFR, INFO/EAS, INFO/EUR, INFO/SAS]
    missing_id_format: '+%CHROM\_%POS\_%REF\_%ALT'
    genome_build_header: '##genome_build={build}'
    # Scientific provenance is appended during the existing concat/annotate
    # stream. Header names and output fields live here so module code does not
    # become an independent VCF-schema authority.
    provenance:
      missing_value: not_provided
      path_separator: ' | '
      output_fields:
        af: FORMAT/AF
        info: FORMAT/SI
        effect: FORMAT/ES
        se: FORMAT/SE
        z: FORMAT/EZ
        pvalue: FORMAT/LP
        sample_size: FORMAT/NEF
      headers:
        postgwas_version: postgwas_version
        dataset_id: postgwas_dataset_id
        input_file: postgwas_input_file
        resource_directory: postgwas_resource_directory
        output_directory: postgwas_output_directory
        dataset_output_directory: postgwas_dataset_output_directory
        run_manifest: postgwas_run_manifest
        vcf_created_at: postgwas_vcf_created_at
        vcf_status: postgwas_vcf_status
        input_genome_build: postgwas_input_genome_build
        output_genome_build: postgwas_output_genome_build
        liftover: postgwas_liftover
        resolved_resource_files: postgwas_resolved_resource_files
        source_fasta_files: postgwas_source_fasta_files
        target_fasta_files: postgwas_target_fasta_files
        liftover_chain_files: postgwas_liftover_chain_files
        annotation_files: postgwas_annotation_files
        dbsnp_reference_files: postgwas_dbsnp_reference_files
        strand_consensus: postgwas_strand_consensus
        strand_reference_column: postgwas_strand_reference_column
        strand_reference_files: postgwas_strand_reference_files
        af_source: postgwas_af_source
        af_input_column: postgwas_af_input_column
        af_input_type: postgwas_af_input_type
        af_type_decision: postgwas_af_type_decision
        af_reference_template: postgwas_af_reference_template
        af_reference_files: postgwas_af_reference_files
        af_harmonisation: postgwas_af_harmonisation
        af_swapped_formula: postgwas_af_swapped_formula
        af_output_field: postgwas_af_output_field
        info_source: postgwas_info_source
        info_input_column: postgwas_info_input_column
        info_reference_template: postgwas_info_reference_template
        info_reference_files: postgwas_info_reference_files
        info_fixed_value: postgwas_info_fixed_value
        info_matching: postgwas_info_matching
        info_swapped_action: postgwas_info_swapped_action
        info_interpretation: postgwas_info_interpretation
        info_output_field: postgwas_info_output_field
        effect_input_column: postgwas_effect_input_column
        effect_input_type: postgwas_effect_input_type
        effect_type_decision: postgwas_effect_type_decision
        effect_source: postgwas_effect_source
        effect_harmonisation: postgwas_effect_harmonisation
        effect_formula: postgwas_effect_formula
        effect_orientation: postgwas_effect_orientation
        effect_output_field: postgwas_effect_output_field
        effect_output_scale: postgwas_effect_output_scale
        se_input_column: postgwas_se_input_column
        se_source: postgwas_se_source
        se_input_scale: postgwas_se_input_scale
        se_scale_decision: postgwas_se_scale_decision
        se_harmonisation: postgwas_se_harmonisation
        se_formula: postgwas_se_formula
        se_output_field: postgwas_se_output_field
        z_input_column: postgwas_z_input_column
        z_source: postgwas_z_source
        z_harmonisation: postgwas_z_harmonisation
        z_formula: postgwas_z_formula
        z_output_field: postgwas_z_output_field
        pvalue_input_column: postgwas_pvalue_input_column
        pvalue_input_scale: postgwas_pvalue_input_scale
        pvalue_scale_decision: postgwas_pvalue_scale_decision
        pvalue_harmonisation: postgwas_pvalue_harmonisation
        pvalue_harmonisation_formula: postgwas_pvalue_harmonisation_formula
        pvalue_vcf_export: postgwas_pvalue_vcf_export
        pvalue_vcf_formula: postgwas_pvalue_vcf_formula
        pvalue_output_field: postgwas_pvalue_output_field
        trait_type: postgwas_trait_type
        case_count_column: postgwas_case_count_column
        case_count_value: postgwas_case_count_value
        control_count_column: postgwas_control_count_column
        control_count_value: postgwas_control_count_value
        sample_size_source: postgwas_sample_size_source
        sample_size_formula: postgwas_sample_size_formula
        sample_size_output_field: postgwas_sample_size_output_field
        population_af_reference_files: postgwas_population_af_reference_files
        population_af_fields: postgwas_population_af_fields
    target_builds: {GRCh37: GRCh38, GRCh38: GRCh37}
    required_merge_groups: [input_build, target_build, raw_gwas2vcf]
    concordance_fields:
      CHROM: '%CHROM'
      POS: '%POS'
      ID: '%ID'
      REF: '%REF'
      ALT: '%ALT'
      ES: '[%ES]'
      SE: '[%SE]'
      EZ: '[%EZ]'
      AF: '[%AF]'
      LP: '[%LP]'
    table_delimiter: "\t"
    table_null_values: ['', '.']
    table_null_output: ''
    temporary_table_suffix: .tsv
    io_buffer_bytes: 1048576
    liftover_plugin: liftover
    # FORMAT/ES and FORMAT/EZ are signed with respect to ALT. INFO/AF and
    # FORMAT/AF are ALT frequencies. Population INFO fields are derived from
    # external_frequency_columns at runtime and must not be repeated here.
    liftover_tag_roles:
      allele_frequency: [INFO/AF, FORMAT/AF]
      signed_effect: [FORMAT/ES, FORMAT/EZ]

  # Descriptive population-frequency compatibility QC. This reads the
  # unfiltered, concatenated input-build VCF and never changes a population
  # label or filters a variant. INFO/AF is the study ALT frequency written by
  # the bundled GWAS-VCF adapter; the other fields are exact-allele reference
  # annotations. Correlation is supported by mean absolute difference because
  # correlation alone can remain high between distinct populations.
  population_frequency_qc:
    enabled: true
    study_field: '%INFO/AF'
    population_fields:
      AFR: '%INFO/AFR'
      EAS: '%INFO/EAS'
      EUR: '%INFO/EUR'
      SAS: '%INFO/SAS'
    minimum_comparable_variants: 10000
    minimum_correlation: 0.80
    minimum_correlation_gap: 0.01
    # A negative correlation alone is not enough to diagnose inversion. The
    # one-minus interpretation must also closely match a population AF and
    # improve mean absolute error by the configured amount.
    inversion_minimum_absolute_correlation: 0.80
    inversion_maximum_mean_absolute_difference: 0.10
    inversion_minimum_mean_absolute_difference_improvement: 0.10
    require_mae_agreement: true
    warn_on_filename_mismatch: true
    on_error: warn

  runtime:
    metadata_directory: '{dataset_id}/run_metadata'
    top_metadata_directory: run_metadata
    resolved_config_file: resolved_config.yaml
    run_summary_file: harmonisation_run_summary.csv
    run_html_report: harmonisation_run_report.html
    sample_sheet_row_file: sample_sheet_row.json
    command_file: command.txt
    supplied_config_file: supplied_config.yaml

  # A user may supply one EAF or INFO table containing every chromosome, or a
  # {chromosome} path template. Only the former is projected and partitioned
  # here, once per dataset, so spawned chromosome workers never materialise the
  # same whole-genome table independently. Template inputs remain untouched.
  external_reference_staging:
    batch_rows: 100000
    compression: zstd
    compressed_suffixes: [.gz, .bgz, .bz2, .xz, .lzma, .zip]
    atomic_output_suffix: .tmp

  # Optional input-versus-VCF accuracy audit. It is never run unless enabled
  # in configuration or requested with ``postgwas ... --validate``.
  concordance_validation:
    enabled: false
    # Maximum CSV rows held while assigning immutable source-row identifiers
    # before chromosome-partitioned concordance. This avoids the Polars 0.20
    # streaming row-index corruption without loading a full GWAS into memory.
    staging_batch_rows: 100000
    staging_compression: zstd
    allow_strand_complement: true
    # Compare a retained A/T or C/G SNP using its archived per-row strand_action;
    # fall back to run-manifest study consensus only when that audit is unavailable.
    palindromic_action: compare_resolved
    write_all_matches: false
    effect: {absolute: 1.0e-6, relative: 1.0e-5}
    standard_error: {absolute: 1.0e-6, relative: 1.0e-5}
    allele_frequency: {absolute: 1.0e-6, relative: 1.0e-5}
    z_score: {absolute: 1.0e-5, relative: 1.0e-5}
    # GWAS-VCF stores the association p-value as FORMAT/LP = -log10(P).
    # Compare on that scale to match storage and avoid unstable comparisons of
    # extremely small raw probabilities. Specification:
    # https://github.com/MRCIEU/gwas-vcf-specification
    p_value: {absolute: 1.0e-5, relative: 1.0e-5}
    failure:
      maximum_value_mismatch_fraction: 0.0
      maximum_vcf_duplicate_records: 0
      maximum_invalid_vcf_records: 0

  # Run-specific overrides of the registry below are merged here.
  policies: {}

version: 1

# Export presentation only. These paths select existing validated settings;
# they do not introduce analysis defaults or become resolved run parameters.
export_layout:
  introduction:
    - 'Read in order: reference selection, analysis policies, final QC, then advanced definitions.'
    - 'Dataset and chromosome step numbers refer to the processing log; shared policies appear once.'
    - 'The sample sheet supplies dataset paths and column mappings through --sample-sheet.'
  common_introduction:
    - 'PostGWAS harmonisation: common run settings.'
    - 'Set resources.root and run.output_directory; supply the sample sheet with --sample-sheet.'
    - 'Run with: postgwas harmonisation --sample-sheet studies.csv --run-config harmonisation.yaml'
    - 'Omitted settings inherit the installed version defaults. Non-default supplied settings are retained.'
    - 'For a complete module snapshot, export --scope all --style full with this file as --run-config.'
    - 'Archive this file together with the resolved configuration and software version from the run.'
  sections:
    - title: Reference selection and input declarations
      fields: [enabled, default_eaf, comparison_af, reference, fixed_info]
    - title: Dataset preparation and chromosome processing
