  # =================================================================
  # 04  dataset 03 / chromosome 02   position parsing and bounds
  # =================================================================
  position:
    min_value:
      default: 0
      help: |-
        What it does: The smallest base-pair position a variant is allowed to have.
        When it applies: chromosome step 02 and the same coordinate step inside dataset step 03,
          only when a position column is present, and after the position has been turned into a
          whole number. dataset step 04, the content check, also uses it when working out whether
          any variant would pass the basic coordinate and allele checks.
        Values:
          A position below this number is removed and recorded as an invalid position, so a
          larger value rejects more variants. The units are base pairs and the floor is 0. At 0
          nothing real is removed (only a negative position would be), which is exactly what the
          pipeline did before this setting existed. At 1, position 0 is rejected.
        Example: With min_value 1 a variant at position 0 - the marker many tools write for
          "could not be mapped" - is removed and appears in the reject file with reason
          invalid_position and the detail "position below position.min_value (1)". With the
          default 0 that same variant is kept and carried through every later step.
        Note: Setting this to 1 is recommended, but it is a behaviour change that removes
          variants the pipeline keeps today. Positions that are empty or unreadable are rejected
          regardless, by a separate check this setting does not control.
      origin: not enforced
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 0
        number_kind: int
    extraction:
      default: leading_digits
      help: |-
        What it does: How the base-pair position is pulled out of the second half of a combined
          chromosome:position field.
        When it applies: only when the coordinate step splits a combined column, that is when
          chr_pos_col names a column that exists and either chr_col or pos_col is missing. A file
          with genuine chromosome and position columns never consults it. The split normally
          happens once during the read (dataset step 03), otherwise at chromosome step 02.
        Values:
          strip_non_digits - deletes every non-digit anywhere in the field and glues the
            remaining digits together.
          leading_digits - keeps only the run of digits at the very front and discards the rest.
          none - leaves the text alone and lets the later number conversion decide; anything that
            will not convert becomes empty and is rejected as an invalid position.
        Example: '1:123456:A:G' splits into chromosome '1' and the text '123456:A:G'.
          strip_non_digits and leading_digits both give 123456 there, while none keeps the text,
          fails to convert it and rejects the variant as an invalid position. On '1:123456.0'
          strip_non_digits gives 1234560, ten times too large, and on '1:123456-123457' it gives
          123456123457; the lenient number conversion flags neither, so they become plausible
          wrong coordinates. leading_digits gives 123456 for both.
        Note: leading_digits is the safe default because it preserves the first base-pair position
          without joining later numeric components into a different coordinate. strip_non_digits
          remains available only as an explicit compatibility choice.
      origin: coordinates.py:80
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - strip_non_digits
        - leading_digits
        - none

  # =================================================================
  # 05  dataset 03      allele validation
  # =================================================================
  allele:
    pattern:
      default: ^[ACGT]+$
      help: |-
        What it does: Sets the pattern that both the effect and the other allele must match for a
          variant to be kept.
        When it applies: dataset step 03, after the chromosome and position checks and before
          duplicate removal, and only when both ea_col and oa_col name a column that is in the
          file. The same pattern is applied again at dataset step 04 as a sanity check that at
          least some variants survive the basic checks.
        Values: a regular expression. The allele is upper-cased first, so case never matters, and
          the expression is applied as a SEARCH rather than a whole-string match - the ^ and $ in
          the default are what force the entire allele to be A, C, G or T. Both alleles must match;
          a variant failing either is rejected with the reason 'non_standard_allele'.
        Example: under the default ^[ACGT]+$ the alleles 'a', 'AT' and 'ACGTACGT' are kept, so
          indels written out in full are fine, while 'I', 'D', '-', '.', 'R' and 'A/T' are all
          rejected. Dropping the anchors to [ACGT] would let 'ATN' and even 'A/T' through, because
          each merely contains a matching character.
        Note: a variant whose allele is empty is rejected just before this, under its own reason
          'null_allele', so it is never attributed to the pattern. There is no setting that
          translates I/D or '-' coding into bases, so a study that codes indels that way loses
          every indel here - re-code the allele columns before the run rather than loosening this
          pattern.
      origin: summary_statistics_io.py:read_summary_statistics
      recommendation: null
      type: str
      validator:
        allow_none: false
        description: a regular expression
        kind: text

  # =================================================================
  # 06  dataset 03      duplicate variants
  # =================================================================
  duplicates:
    key:
      default:
      - chr
      - pos
      - ea
      - oa
      help: |-
        What it does: Names the fields whose combined value makes two rows the same variant.
        When it applies: dataset step 03, at the duplicate-removal pass after the chromosome, position
          and allele checks, and only when EVERY field listed resolves to its own column in the file.
        Values: field names resolved to the column your config names - chr->chr_col, pos->pos_col,
          snp->snp_id_col, ea->ea_col, oa->oa_col, eaf->eaf_col, beta->beta_or_col, se->se_col,
          zscore->imp_z_col, pval->pval_col, info->imp_info_col, n or ncontrol->ncontrol_col,
          and ncase->ncase_col. Allele text is compared without regard to letter case. Order does
          not matter; adding a field finds fewer duplicates, removing one finds more.
        Example: with the default [chr, pos, ea, oa], 1:1000 A/G and 1:1000 A/T are different variants
          and both continue; two rows both 1:1000 A/G form a group and are assessed using
          duplicates.consistency_fields. Effect and other allele remain ordered: A/G and G/A are
          not combined here because effect orientation is not yet resolved at this input stage.
        Note: every field must resolve to a distinct input column. A missing or ambiguous mapping is
          an actionable configuration error; duplicate checking is never silently skipped.
      origin: summary_statistics_io.py:resolve_duplicate_variants
      recommendation: null
      type: list
      validator:
        allow_empty: false
        item:
          allow_none: false
          kind: enum
          members:
          - chr
          - pos
          - snp
          - ea
          - oa
          - eaf
          - beta
          - se
          - zscore
          - pval
          - info
          - n
          - ncontrol
          - ncase
        kind: list
        unique: true
        upper: false
    consistency_fields:
      default:
      - beta
      - se
      - zscore
      - pval
      - eaf
      help: |-
        What it does: Defines the scientific values that must agree within a duplicate group before
          PostGWAS is allowed to keep one row. For each available field, null values are ignored and
          all remaining values must be exactly equal after normal input parsing.
        When it applies: dataset step 03, only to groups identified by duplicates.key. Fields without
          a configured input column are omitted, but at least one configured field must be available.
        Values: beta, se, zscore, pval, eaf, info, n, ncontrol or ncase, resolved through the sample
          sheet column mapping. beta refers to beta_or_col, so it compares the supplied beta or odds
          ratio before chromosome-level effect conversion.
        Example: duplicate rows with the same beta, SE, p-value and EAF are consistent even if one has
          an empty Z score. If two non-empty beta values differ, every row in that group is conflicting.
        Note: exact equality is deliberately conservative. It avoids inventing a numerical tolerance
          that could make genuinely different association results look equivalent.
      origin: summary_statistics_io.py:resolve_duplicate_variants
      recommendation: null
      type: list
      validator:
        allow_empty: false
        item:
          allow_none: false
          kind: enum
          members:
          - beta
          - se
          - zscore
          - pval
          - eaf
          - info
          - n
          - ncontrol
          - ncase
        kind: list
        unique: true
        upper: false
    quality_fields:
      default:
      - beta
      - se
      - zscore
      - pval
      - eaf
      - ncontrol
      - ncase
      - info
      help: |-
        What it does: Names the analysis fields counted when the 'completeness' ranking criterion
          compares scientifically consistent duplicate rows. The row with more non-empty resolved
          fields ranks first.
        When it applies: dataset step 03, after consistency is confirmed and only when
          duplicates.selection_order contains completeness.
        Values: beta, se, zscore, pval, eaf, info, n, ncontrol or ncase. Fields that have no configured
          input column do not contribute; no value is imputed for ranking.
        Example: two consistent rows tie on their shared beta, p-value and EAF, but only one supplies
          SE and INFO. That row has two more complete quality fields and is selected.
        Note: completeness is assessed only across configured scientific fields, not arbitrary text
          columns, so an unrelated annotation cannot decide which association row survives.
      origin: summary_statistics_io.py:resolve_duplicate_variants
      recommendation: null
      type: list
      validator:
        allow_empty: false
        item:
          allow_none: false
          kind: enum
          members:
          - beta
          - se
          - zscore
          - pval
          - eaf
          - info
          - n
          - ncontrol
          - ncase
        kind: list
        unique: true
        upper: false
    selection_order:
      default:
      - completeness
      - sample_size
      - info
      - input_order
      help: |-
        What it does: Gives the ordered tie-breakers used to retain exactly one row from a
          scientifically consistent duplicate group.
        When it applies: dataset step 03, after duplicates.consistency_fields agree.
        Values:
          completeness - prefer more non-empty duplicates.quality_fields.
          sample_size - prefer larger per-variant effective N; case-control rows use
            4/(1/Ncase + 1/Ncontrol), while a single quantitative-trait N is used directly.
          info - prefer the larger imputation-quality value.
          input_order - prefer the earlier physical input row and make the final choice reproducible.
        Example: the default first prefers the most complete row, then larger N, then higher INFO, and
          finally the earlier input row when every scientific quality measure ties.
        Note: input_order must appear exactly once and last. This guarantees deterministic output even
          when every configurable quality value is tied or unavailable.
      origin: summary_statistics_io.py:resolve_duplicate_variants
      recommendation: null
      type: list
      validator:
        allow_empty: false
        item:
          allow_none: false
          kind: enum
          members:
          - completeness
          - sample_size
          - info
          - input_order
        kind: list
        unique: true
        upper: false
    conflicting_action:
      default: remove_all
      help: |-
        What it does: Controls the dataset outcome when non-empty values in one or more
          duplicates.consistency_fields disagree within a duplicate group.
        When it applies: dataset step 03, after the conflicting rows and their evidence have been
          written to the duplicate and rejected-variant reports.
        Values:
          remove_all - reject every row in the conflicting group as conflicting_duplicate and continue.
          fail_dataset - write the reports, then stop the dataset with an actionable error.
        Example: two 1:1000 A/G rows with beta 0.1 and 0.2 are both rejected under remove_all; under
          fail_dataset they are recorded in the same way and the dataset then stops.
        Note: there is intentionally no option to keep the lowest p-value, first row or last row from
          a conflicting group. Those rules either select on significance or make an arbitrary choice.
      origin: summary_statistics_io.py:read_summary_statistics
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - remove_all
        - fail_dataset

  # =================================================================
  # 07  dataset 05      genome build inference
  # =================================================================
  build:
    mode:
      default: auto
      help: |-
        What it does: Decides whether the input's genome build is worked out from the data or
          simply declared in the config.
        When it applies: dataset step 05 (genome build), always. confidence_ratio,
          min_match_count and min_match_fraction are consulted only when this is 'auto';
          reference deduplication also applies to the one selected reference when a build is
          declared.
        Values:
          auto - match the input against both references in forward, swapped,
            reverse-complement and reverse-complement-swapped orientations, then decide.
          GRCh37 - declare GRCh37 and read only its reference to collect strand evidence.
          GRCh38 - declare GRCh38 and read only its reference to collect strand evidence.
        Example: Under 'auto', an input whose evidence does not clear all three checks is reported
          as "Ambiguous" and the whole dataset aborts with "Genome build inference failed".
          Setting build.mode: GRCh38 fixes the build decision while still comparing alleles with
          the GRCh38 reference for the study-level strand-consensus check.
        Note: The error message in the older code advertises a --genome-build command-line flag
          that does not exist; this setting is it.
      origin: main.py:536
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - auto
        - GRCh37
        - GRCh38
    confidence_ratio:
      default: 0.9
      help: |-
        What it does: Sets how lopsided the two builds' match counts must be before one of them
          is declared the winner.
        When it applies: dataset step 05 (genome build), only when build.mode is 'auto'.
        Values:
          The share of ALL matches that must fall to one build: each build's match count is
          divided by the sum of the two, so the two shares always add up to 1. Raising it
          towards 1.0 demands a near-clean sweep and sends more files back as "Ambiguous";
          0.5, the floor, accepts whichever build is merely ahead.
        Example: 60,000 of 63,000 coordinate-testable variants match GRCh37 and 3,000 match
          GRCh38.
          GRCh37's share is 60,000/63,000 = 0.952, above 0.90, so the build is GRCh37. Had
          GRCh38 matched 10,000, the share would be 0.857 and the answer would be "Ambiguous",
          which aborts the dataset.
        Note: Because the two shares add to 1 whatever the sample size, this test is combined
          with build.min_match_count and build.min_match_fraction.
      origin: genome_build.py:107
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.5
        number_kind: float
    min_match_count:
      default: 100
      help: |-
        What it does: Sets the minimum absolute number of allele-compatible study variants that
          the winning build must have before automatic inference is trusted.
        When it applies: dataset step 05 (genome build), only when build.mode is 'auto'.
        Values: A positive whole number. Raising it requires more independent study rows to
          support the build; lowering it permits small datasets but makes accidental evidence
          more influential.
        Example: A 98-to-2 winning share is not accepted when only 98 variants matched, because
          it does not reach the default minimum of 100. Exactly 100 matches passes this check,
          but the fraction and confidence checks must also pass.
        Note: This counts each study row at most once per build, even when a reference contains
          duplicate or multiallelic rows.
      origin: genome_build.py:infer_genome_build
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 1
        number_kind: int
    min_match_fraction:
      default: 0.8
      help: |-
        What it does: Sets the smallest share of coordinate-testable study variants whose alleles
          must match the winning reference before automatic inference is trusted.
        When it applies: dataset step 05 (genome build), only when build.mode is 'auto'. It is
          combined with build.min_match_count and build.confidence_ratio.
        Values:
          Compared against the better of the two builds' match shares. The denominator counts
          only study rows whose exact chromosome and position occurs in at least one configured
          build reference. Rows absent from both references are untestable and logged separately.
          0.8 requires four out of five testable rows to match; 1.0 requires every testable row.
        Example: If 800 study rows occur in either build reference and 760 have alleles matching
          GRCh37, its fraction is 760/800 = 0.95 and passes the default 0.8. The size of the full
          study file is not used in this fraction.
        Note: This denominator measures the reference panel's actual ability to test the input,
          rather than treating every variant on chromosomes 1-22 as if it were represented.
      origin: genome_build.py:infer_genome_build
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    deduplicate_reference:
      default: true
      help: |-
        What it does: Removes repeated chromosome/position/ref/alt rows from each build
          reference file before the input is matched against it.
        When it applies: dataset step 05 (genome build). Both references are treated the same way
          in auto mode; only the declared build's reference is treated in forced mode.
        Values:
          true - exact duplicate reference rows are removed before joining; the row counts before
            and after are written to the log.
          false - exact duplicates remain in the join input. Match and strand counts still count
            each study row at most once, but the larger join can use extra time and memory.
        Example: If one reference variant is listed three times, the final evidence still counts
          the matching study variant once; true avoids materialising the two redundant join rows.
        Note: Enabled by default because duplicate rows cannot add scientific evidence and only
          increase join size.
      origin: genome_build.py:28-46
      recommendation: 'true'
      type: bool
      validator:
        kind: flag

  # =================================================================
  # 08  dataset 06 / chromosome 04   reference strand orientation
  # =================================================================
  strand:
    enabled:
      default: true
      help: |-
        What it does: Enables study-level strand consensus and reference-based orientation of every
          retained chromosome variant before allele-frequency harmonisation.
        When it applies: dataset step 06 calculates consensus from the selected build's
          non-palindromic matches; chromosome step 04 joins the supplied raw CHROM/POS/REF/ALT/AF
          table once on coordinates and tests all four allele orientations with Polars expressions.
        Values: true performs and records the checks; false skips them and preserves the older
          behaviour. False should be used only for a deliberately pre-harmonised input whose
          provenance already guarantees forward-strand REF/ALT alignment.
        Example: a study T/C row against reference REF=A ALT=G is classified as
          reverse_complement and becomes G/A without changing beta, Z or EAF.
        Note: the reference is not expanded into four copies. The user supplies the ordinary raw
          chromosome table and the implementation performs one coordinate join.
      origin: strand.py:harmonise_strand_orientation
      recommendation: null
      type: bool
      validator:
        kind: flag
    consensus_threshold:
      default: 0.99
      help: |-
        What it does: Sets the minimum dominant forward- or reverse-strand fraction required for a
          study-wide consensus call.
        When it applies: dataset step 06, among uniquely classified non-palindromic variants for
          the selected genome build. Palindromic variants never contribute to this calculation.
        Values: a fraction from 0.5 to 1.0. Below the threshold the study is labelled mixed; this
          does not override unambiguous non-palindromic per-variant matches, but prevents consensus
          alone from resolving palindromic variants.
        Example: 99,200 forward and 800 reverse matches give 0.992 and pass the default 0.99.
        Scientific basis: GWAS Catalog uses a greater-than-99% full-data consensus after its
          screening stage before inferring palindromic orientation.
      origin: strand.py:resolve_strand_consensus
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.5
        number_kind: float
    min_informative_variants:
      default: 1000
      help: |-
        What it does: Requires this many uniquely forward- or reverse-matched non-palindromic
          variants before a study-wide strand consensus is trusted.
        When it applies: dataset step 06. A smaller evidence set is labelled unresolved; ordinary
          non-palindromic variants can still be oriented individually, while palindromic variants
          are rejected because population frequency is not permitted to replace missing strand
          evidence.
        Values: a non-negative whole number. Zero removes the absolute evidence floor.
        Example: 800 perfectly forward matches remain unresolved at the default 1000 rather than
          allowing a small or specialised input to determine every palindromic variant.
      origin: strand.py:resolve_strand_consensus
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        minimum: 0
        number_kind: int
    unmatched_action:
      default: reject
      help: |-
        What it does: Controls variants for which no REF/ALT ordering at the coordinate matches the
          supplied chromosome reference under forward, swap, reverse-complement or both operations.
        When it applies: chromosome step 04 after the single coordinate join.
        Values: reject writes the original row with reason reference_unmatched and continues; fail
          stops that chromosome with an actionable error.
        Example: study A/G at a reference G/T site matches none of the four representations and is
          rejected by default.
      origin: strand.py:harmonise_strand_orientation
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [reject, fail]
    ambiguous_action:
      default: reject
      help: |-
        What it does: Controls variants for which reference alleles and study-wide strand consensus
          do not leave exactly one scientifically supported orientation.
        When it applies: chromosome step 04. Palindromic variants require a strong study-wide
          consensus from non-palindromic variants; non-palindromic variants are ambiguous when a
          multiallelic or conflicting reference leaves more than one exact orientation.
        Values: reject records palindromic_ambiguous or reference_ambiguous and continues; fail
          stops that chromosome.
        Example: an A/T variant is retained under a strong forward consensus even when EAF is near
          0.5, then checked against reference AF as QC. Under mixed or unresolved consensus it is
          rejected because its allele letters cannot identify the strand.
      origin: strand.py:harmonise_strand_orientation
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [reject, fail]
    af_tolerance:
      default: 0.20
      help: |-
        What it does: Sets the largest absolute difference allowed between the final study EAF and
          the aligned population-reference ALT frequency before the row is called AF-discordant.
        When it applies: chromosome step 04 after the internal or external EAF source has been
          selected and allele swaps have already been applied. Missing study or reference values
          are not called discordant.
        Values: frequency units from 0 to 1. Population ancestry, sampling and study design can
          produce real differences, so the default is deliberately broad and pairs with a warning.
        Example: study EAF 0.31 against reference AF 0.30 differs by 0.01 and passes; 0.75 against
          0.30 differs by 0.45 and is discordant at the default 0.20.
      origin: allele_frequency.py:harmonise_allele_frequency
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    af_discordance_action:
      default: warn
      help: |-
        What it does: Controls final non-palindromic EAF values farther from the aligned population
          reference than strand.af_tolerance.
        When it applies: chromosome step 04 after allele orientation and frequency harmonisation.
        Values: warn keeps the row and records the discordance; reject writes it with reason
          af_discordant; fail stops the chromosome. Warn is the default because population AF is
          supporting QC evidence rather than proof of strand for an individual study.
        Example: a study from a population different from the configured panel may produce many
          warnings; select the correct population column rather than weakening allele matching.
      origin: allele_frequency.py:harmonise_allele_frequency
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [warn, reject, fail]
    palindromic_af_discordance_action:
      default: reject
      help: |-
        What it does: Controls a palindromic variant whose final effect-aligned study frequency
          differs from the already-oriented population-reference ALT frequency by more than
          strand.af_tolerance.
        When it applies: chromosome step 04 only after a strong study-wide non-palindromic strand
          consensus has selected the palindromic orientation. Reference AF is a QC check here; it
          is never used to choose the strand.
        Values: reject records af_discordant and removes the row; warn retains it with a warning;
          fail stops the chromosome. Reject is conservative because A/T and C/G allele letters
          cannot independently confirm the selected strand.
        Example: a consensus-oriented A/T variant with study EAF 0.85 and aligned reference AF
          0.10 differs by 0.75 and is rejected at the default tolerance 0.20.
      origin: allele_frequency.py:harmonise_allele_frequency
      recommendation: reject
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [warn, reject, fail]

  # =================================================================
  # 09  dataset 07      beta or odds ratio - decided ONCE for the study
  # =================================================================
  effect:
    or_detection_max_non_positive_fraction:
      default: 0.005
      help: |-
        What it does: Sets the largest combined share of zero and negative values allowed in an
          automatically identified odds-ratio column.
        When it applies: dataset step 07 (study-wide properties), only when effect.type is
          'auto'. Also at chromosome step 03 when effect.verify_per_chromosome is on, where it
          can only produce a warning.
        Values:
          A fraction from 0 to 1, calculated over usable finite numeric values. The default 0.005
          means at most 0.5% may be zero or negative. A column is accepted as OR only when this
          limit and the configured median range both pass. Non-positive rows are still invalid ORs
          and are handled individually by effect.or_non_positive before logarithmic conversion.
        Example: one zero among 200 usable values is 0.5% and may be tolerated as contamination if
          the median is near 1; two zeros are 1% and conflict with an OR-like median.
        Note: zero and negative counts are combined, not allowed separately. Missing and non-finite
          cells are excluded from the denominator and handled by their own validation rules.
      origin: effect_type.py:detect_effect_type
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    or_detection_require_median_range:
      default: [0.80, 1.25]
      help: |-
        What it does: Defines the required median interval for automatic odds-ratio classification.
        When it applies: dataset step 07 while effect.type is 'auto', together with
          effect.or_detection_max_non_positive_fraction.
        Values: A low and high bound. The column median must fall inside it before automatic OR
          classification is allowed.
        Example: at [0.80, 1.25] a positive column with median 0.02 is ambiguous rather than
          log-transformed; an odds-ratio column with median 1.02 passes if its non-positive fraction
          also passes.
        Note: an odds-ratio column normally has a median near 1, while a beta column normally has a
          median near 0. A positive column outside this interval is ambiguous and must be declared.
      origin: effect_type.py:detect_effect_type
      recommendation: null
      type: list
      validator:
        allow_none: false
        kind: numeric_pair
        maximum: 100.0
        minimum: 0.0
    type:
      default: auto
      help: |-
        What it does: States whether the effect column holds beta (log-odds) values or odds
          ratios.
        When it applies: dataset step 07 (study-wide properties) decides it once for the whole
          study and chromosome step 03 applies that answer. An explicit sample-sheet declaration
          is still checked by the detector; another explicit policy value skips detection.
        Values:
          auto - work it out from the combined share of zero and negative values and the required
            median check in effect.or_detection_require_median_range; ambiguous or conflicting
            evidence stops and requests an explicit declaration.
          beta - take the column as it stands; nothing is transformed.
          odds_ratio - replace every value with its natural logarithm and carry the result
            forward in a column called 'beta'.
        Example: A column named 'OR' with values around 1. With effect.type: odds_ratio, 1.05 is
          carried forward as 0.048790 and 0.95 as -0.051293. With effect.type: beta the same
          file exports 1.05 as the effect size, which makes every Z score, standard error and
          p-value downstream wrong.
        Note: State this in the config whenever you know it - it is far safer than any
          detection, which is a fallback for files you do not know. Log-transforming a beta
          column by mistake cannot be undone further down the pipeline. Whenever auto supplies
          the applied answer, PostGWAS prints and records a prominent warning containing the
          inferred type, median, non-positive fraction and explicit-declaration recommendation.
      origin: effect_type.py:68
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - auto
        - beta
        - odds_ratio
    cast_strict:
      default: true
      help: |-
        What it does: Decides whether an effect-size cell that will not convert to a number
          stops the chromosome or is blanked out.
        When it applies: chromosome step 03 (effect type), first thing in the step, on every
          chromosome and whichever effect type was decided.
        Values:
          true - the conversion is strict, so one unreadable cell ends that chromosome's run
            with a conversion error.
          false - unreadable cells become empty, are counted, and are reported as the QC action
            "effect size is a number"; the chromosome carries on.
        Example: A file that writes missing effects as 'NA' fails on the first chromosome under
          true. Under false the log records "12,481 values in 'BETA' are not numbers", those
          variants keep an empty effect size, and the effect-statistics check at step 10 is what
          removes them.
        Note: Recommended: false. A single 'NA' currently aborts the whole chromosome, and
          every comparable step in the pipeline uses false.
      origin: effect_type.py:51
      recommendation: 'false'
      type: bool
      validator:
        kind: flag
    verify_per_chromosome:
      default: false
      help: |-
        What it does: Re-runs effect-type detection inside every chromosome as a cross-check on
          the study-wide answer.
        When it applies: chromosome step 03 (effect type), only when a study-wide decision was
          handed down, which is what the pipeline always does. The flag is also recorded in the
          decision record written at dataset step 07.
        Values:
          true - detection runs again on each chromosome's own rows: agreement is noted,
            disagreement is a warning, and the local verdict is stored in the QC record as
            effect_type_chromosome_check. The study-wide answer is applied either way.
          false - no re-check and no extra pass over the effect column.
        Example: The study-wide answer is 'odds_ratio' but chromosome 6's own rows are 12%
          negative, so the local detector says 'beta'. With true the log reads "Re-checking on
          this chromosome alone suggests 'beta', but the study-level decision 'odds_ratio' is
          authoritative"; the column is still log-transformed. With false nothing is said.
        Note: This can only produce warnings, never change an outcome. A chromosome whose own
          values cannot be classified at all is warned about rather than failing the run.
      origin: new
      recommendation: null
      type: bool
      validator:
        kind: flag
    or_non_positive:
      default: reject
      help: |-
        What it does: Says what to do with an odds ratio of zero or below, which has no
          logarithm.
        When it applies: chromosome step 03 (effect type), only when the effect type is
          odds_ratio, whether that came from the config or from detection. Never consulted for a
          beta column.
        Values:
          reject - remove the rows and write them to the reject file under the reason
            'effect_non_positive_or'. If no reject file is being collected, the step warns and
            blanks the value instead.
          null - blank out the effect size for those variants and keep the rows.
          keep - take the logarithm anyway; this is unsafe and retained only as an explicit policy.
          fail - stop the chromosome with an error quoting the counts.
        Example: A column holding 1.03, 0.0 and -0.5. Under 'null' the first becomes beta
          0.029559 while the other two get an empty beta but stay in the file, logged as "1
          exactly zero, 1 negative". Under 'reject' those two rows leave the dataset; under
          'fail' the chromosome stops.
        Note: Zeros and negatives are counted separately in the log and the QC record, so a
          file with negative "odds ratios" - usually a mislabelled beta column - is visible
          rather than hidden inside one total.
      origin: effect_type.py:145
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - reject
        - 'null'
        - keep
        - fail
    se_scale:
      default: auto
      help: |-
        What it does: Determines or declares which scale an odds-ratio study's standard error is
          on, and therefore whether SE must be divided by OR before allele orientation.
        When it applies: dataset step 07, only when effect type is odds_ratio and a standard-error
          column is supplied. The selected study-wide answer is applied at chromosome step 03.
        Values:
          auto - compare the two candidate identities log(OR)/SE and log(OR)/(SE/OR) with the
            study's supplied Z scores, or with its two-sided p-values when no sufficiently
            informative Z comparison exists. Ambiguous or insufficient evidence stops before
            chromosome processing instead of guessing.
          log_odds - the standard error already matches the log-odds effect size and is left
            exactly as it arrived. The dataset-level comparison still checks this explicit
            declaration when enough evidence exists.
          as_given - the standard error is on the raw odds-ratio scale, so chromosome step 03
            divides it by the original OR using the first-order delta method before changing
            allele orientation. The explicit declaration is cross-checked when possible.
        Example: A variant with OR 2.00 and SE 0.30. Under 'log_odds' the exported effect is
          ln(2) = 0.693147 and the SE stays 0.30. Under 'as_given' the SE becomes
          0.30 / 2.00 = 0.15 alongside the same effect size.
        Note: Most logistic-regression GWAS files report the SE of log(OR), even when the effect
          column is exponentiated to OR. Auto exists because a raw OR-scale SE is also possible
          and applying the wrong interpretation changes Z, confidence intervals and p-values.
          Raw p=0 is excluded because it is censored/underflowed rather than an exact probability.
          The p-value fallback assumes a two-sided Wald p-value; studies reporting score-test,
          likelihood-ratio or one-sided p-values should provide Z or set se_scale explicitly.
      origin: effect_type.py:detect_or_standard_error_scale
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - auto
        - log_odds
        - as_given
    se_scale_min_variants:
      default: 100
      help: |-
        What it does: Sets how many variants must distinguish the log-odds and raw-OR SE
          interpretations before automatic SE-scale detection may make a study-wide decision.
        When it applies: dataset step 07 for an odds-ratio study with effect.se_scale=auto. A
          variant is informative only when OR and SE are positive and finite, Z or p is usable,
          and the two candidate interpretations differ by more than the configured validation
          tolerance.
        Values: A positive whole-variant count. Larger values require broader evidence and are
          safer for rounded or heterogeneous files; smaller values permit small studies or
          selected-variant files to be classified from less evidence.
        Example: with the default 100, 99 otherwise usable variants cannot decide the scale and
          the dataset stops before splitting. An explicit log_odds or as_given declaration may
          continue, while the log records that it could not be independently validated.
      origin: effect_type.py:detect_or_standard_error_scale
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 1
        number_kind: int
    se_scale_min_agreement_fraction:
      default: 0.95
      help: |-
        What it does: Requires the selected SE-scale interpretation to agree with the supplied Z
          or p-value for this share of informative variants.
        When it applies: dataset step 07 after the minimum informative-variant count is reached.
        Values: A fraction from 0 to 1. The default 0.95 allows ordinary rounding differences but
          refuses a scale that explains fewer than 95 percent of the discriminating variants.
        Example: 960 agreements among 1,000 informative variants gives 0.96 and passes this rule;
          900 gives 0.90 and remains ambiguous or inconsistent.
      origin: effect_type.py:detect_or_standard_error_scale
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    se_scale_min_agreement_margin:
      default: 0.1
      help: |-
        What it does: Requires the selected interpretation's agreement fraction to exceed the
          alternative interpretation by at least this amount.
        When it applies: dataset step 07 together with effect.se_scale_min_agreement_fraction.
        Values: A fraction from 0 to 1. It prevents both interpretations from being accepted when
          rounded effects near OR=1 make them observationally similar.
        Example: log-odds agreement 0.97 and raw-OR agreement 0.20 has margin 0.77 and passes;
          0.97 versus 0.92 has margin 0.05 and remains ambiguous at the default 0.10.
      origin: effect_type.py:detect_or_standard_error_scale
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float

  # =================================================================
  # 09  dataset 07      p-value scale - decided ONCE for the study
  # =================================================================
  pvalue:
    mlogp_detect_threshold:
      default: 1.005
      help: |-
        What it does: Sets the value above which a number cannot be a plain p-value, and so
          counts as evidence that the column is on a log scale.
        When it applies: dataset step 07 (study-wide properties), only when pvalue.type is
          'auto'. Also at chromosome step 08 when pvalue.verify_per_chromosome is on, where it
          can only produce a warning.
        Values:
          The threshold itself, in the units of the column. Its floor is 1.0, because no plain
          p-value exceeds 1; 1.005 leaves a little room for rounding. Raising it, say to 2.0,
          ignores weak evidence and needs stronger hits before a log column is recognised;
          lowering it towards 1.0 lets values only just above 1 count as evidence.
        Example: With 1.005 a -log10 p of 1.30 (p = 0.05) counts towards the log-scale
          evidence, while a plain p-value recorded as exactly 1.0 for an untested variant does
          not. The count of values above the threshold is then divided by the usable values and
          compared with pvalue.mlogp_detect_proportion.
      origin: p_values.py:44
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1000.0
        minimum: 1.0
        number_kind: float
    mlogp_detect_proportion:
      default: 0.001
      help: |-
        What it does: Sets how large a share of the column must exceed the log-scale threshold
          before the column is declared to be on a log scale rather than plain p-values.
        When it applies: dataset step 07 (study-wide properties), only when pvalue.type is
          'auto'. Also at chromosome step 08 when pvalue.verify_per_chromosome is on, where it
          can only produce a warning.
        Values:
          The share of the usable (non-empty, finite) values that must exceed
          pvalue.mlogp_detect_threshold. Larger demands more evidence, so a log column is more
          likely to be misread as raw p-values; smaller lets a handful of corrupt cells in a raw
          column flip the whole column to a log scale.
        Example: In 1,000,000 raw p-values roughly 100,000 sit below 0.1, so the same file on
          the -log10 scale has 10% of its values above 1.005 - far above the 0.1% required, and
          it is called a log scale. A genuine raw column with 40 corrupt cells reading 2.5 has a
          share of 0.004%, below 0.1%, so it stays raw and those 40 cells go to the range check.
        Note: The share, not the largest value, is deliberately the test. The older detector
          called any column whose maximum exceeded 2 a log column, which turned one corrupt cell
          into 10**(-p) applied to the entire file.
      origin: p_values.py:22,199
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    type:
      default: auto
      help: |-
        What it does: States the scale of the p-value column: plain p-values, -log10 p or
          natural-log -ln p.
        When it applies: dataset step 07 (study-wide properties) decides it once for the whole
          study and chromosome step 08 applies that answer. An explicit sample-sheet declaration
          is still checked by the detector; another explicit policy value skips detection.
        Values:
          auto - work it out: the share of values above pvalue.mlogp_detect_threshold separates
            plain p-values from a log scale, then the median separates the two log scales.
          raw - the column holds plain p-values; only the range checks are applied.
          neglog10 - the column holds -log10 p; the p-value is rebuilt as 10 to the power of
            minus the value.
          negln - the column holds -ln p; it is divided by ln(10) = 2.302585 first and then
            treated as -log10 p.
        Example: A column whose median is about 0.30 is -log10 p, and 7.3 in it means p = 5e-8.
          The same variant on the -ln scale is stored as 16.81 in a column whose median is about
          0.69. Reading that -ln column as -log10 p would report p = 1.5e-17 instead of 5e-8.
        Note: Stating the scale in the config is strongly preferred. Under 'auto' the medians
          are the discriminator - about 0.5 for raw, 0.30 for -log10 p, 0.69 for -ln p - and a
          median that sits between the two log scales, or outside both, is refused rather than
          guessed at, which stops the run and asks you to set this.
      origin: p_values.py:19-60
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - auto
        - raw
        - neglog10
        - negln
    clip_low:
      default: 1.0e-300
      help: |-
        What it does: Sets the smallest plain p-value the pipeline keeps; anything smaller,
          including exactly zero, is raised to this floor under pvalue.out_of_range = clip while
          its original status is retained in row-level provenance.
        When it applies: chromosome step 07 (p-value scale) for a raw p-value column; also at
          step 07 for a log column whose reconstructed p-value underflows to zero, and at step
          08 as the approximation value only when pvalue.zero_missing_se = approximate.
        Values:
          The floor itself, in p-value units. It must be above 0 and below pvalue.clip_high.
          Smaller keeps more of the difference between very strong hits; larger flattens them
          together and, at step 08, caps how large a Z score can be derived.
        Example: A file that writes its strongest hits as p = 0 has them raised to 1e-300,
          but step 08 does not automatically treat that floor as exact evidence. If SE and a
          usable Z are absent, the default pvalue.zero_missing_se = fail stops clearly;
          'approximate' explicitly derives |beta| / 37.07 and records that decision.
        Note: Double precision cannot hold a p-value below about 5e-324, so 1e-300 is already
          close to the smallest floor that means anything.
      origin: p_values.py:71,281
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: true
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    zero_missing_se:
      default: fail
      help: |-
        What it does: Controls the scientifically unresolved case where the raw study file
          reports p = 0 and a standard error is still unavailable after attempting exact
          recovery from a supplied Z score.
        When it applies: chromosome step 08, only to rows whose original raw p-value was
          exactly zero and which have neither a supplied SE nor an SE recovered from a finite,
          non-zero Z score. It does not apply when SE was supplied, when BETA / Z produced SE,
          or when the study supplied -log10 p or -ln p rather than a literal zero.
        Values:
          fail - stop the chromosome with an actionable error; no matching variant is silently
            removed. This is the default because zero is a censored or underflow value, not an
            exact probability, so its exact Z and SE cannot be reconstructed.
          approximate - replace the unknown probability by pvalue.clip_low for SE derivation,
            retain the variant, count it, and mark it internally as an explicit approximation.
            The marker is reported in QC and removed from the exported table with other internal
            provenance columns.
          reject - remove the affected variant and write it to the rejected-variant output with
            reason zero_p_missing_se.
        CLI override: --zero-p-se-action fail|approximate|reject.
        Example: with beta = 0.10, p = 0 and no SE or usable Z, 'approximate' at a
          pvalue.clip_low of 1e-300 derives SE from a two-sided |Z| of about 37.07. That
          SE is only a bound-based approximation; the true p-value may be much smaller.
        Scientific basis: the GWAS Catalog summary-statistics format requires precision metadata
          when any p-value equals zero. Prefer supplying SE, usable Z, -log10 p, or the original
          precision metadata over approximation.
      origin: standard_error.py:derive_standard_error_from_effect_and_p_value
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - fail
        - approximate
        - reject
    clip_high:
      default: 1.0
      help: |-
        What it does: Sets the largest plain p-value the pipeline keeps. The scientifically valid
          default is 1.0; only values above 1 are handed to pvalue.out_of_range.
        When it applies: chromosome step 07 (p-value scale), only when the column is on the raw
          p-value scale. A column read as -log10 p or -ln p never reaches this test - its
          ceiling on the p-value is pvalue.mlogp_min instead.
        Values: The ceiling is in p-value units and must be above pvalue.clip_low and no greater
          than 1. Lower values are permitted only as an explicit user policy.
        Example: p = 1 is retained unchanged and converts to -log10(p) = 0. With the default
          clip action, p = 1.02 is corrected to 1 and recorded as changed.
        Note: p = 1 is a valid null-result probability. It must not be treated as rounding error,
          warned about, or changed merely to avoid a zero Z score. If SE must be derived and the
          effect is non-zero, that separate mathematical limitation is handled at step 08.
      origin: p_values.py:281
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    mlogp_min:
      default: 0.0
      help: |-
        What it does: Sets the smallest -log10 p kept; anything below it is raised to this
          value, which is really a ceiling on the p-value itself.
        When it applies: chromosome step 07 (p-value scale), only when the column is on a log
          scale (-log10 p or -ln p). A raw p-value column is governed by pvalue.clip_high
          instead.
        Values:
          The floor, in -log10 p units; it cannot go below 0. 0.0 corresponds to p = 1. Raising
          it above 0 quietly pushes weak associations to a fixed p-value - 0.1 means no p-value
          above 0.794 survives.
        Example: A log column carrying -0.2 for a variant, from a sign error or a column
          written the wrong way round, is raised to 0, so its p-value becomes exactly 1. The
          variant is counted in the "-log10 p floor" QC line and flagged. If SE must be derived,
          p = 1 implies Z = 0 and therefore no finite SE for a non-zero beta, so the standard-error
          validity gate removes it rather than fabricating a finite value.
        Note: A log column that arrives with a negative sign is clipped to 0 here, which
          silently means p = 1 - it is what the clipping produced, not what the study
          reported.
      origin: p_values.py:122
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: null
        minimum: 0.0
        number_kind: float
    mlogp_max:
      default: 300.0
      help: |-
        What it does: Sets the largest -log10 p kept; anything above it is flattened to this
          value before the plain p-value is rebuilt from it.
        When it applies: chromosome step 08 (p-value scale), only when the column is on a log
          scale - either -log10 p, or -ln p, which is divided by ln(10) first. It never applies
          to a raw p-value column.
        Values:
          The cap, in -log10 p units, and it must be larger than pvalue.mlogp_min. Higher keeps
          more of the difference between very strong hits; 'disabled' turns the cap off
          altogether. Every capped variant is counted and reported together with the largest
          value seen.
        Example: With the cap at 300, variants with -log10 p of 320, 500 and 1200 all come out
          as p = 1e-300 and can no longer be told apart. With the cap off they keep their own
          values, except that anything beyond about 324 underflows to zero in double precision
          and is set to pvalue.clip_low, which is 1e-300 anyway.
        Note: Recommended: null, which turns the cap off. Real top hits do exceed 300, and
          capping loses the ordering among exactly the variants you care most about.
      origin: p_values.py:123,200
      recommendation: 'null'
      type: float
      validator:
        allow_none: true
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: null
        minimum: 0.0
        number_kind: float
    tolerance_above_one:
      default: 1.05
      help: |-
        What it does: Sets how far above 1 a plain p-value may stray and still be forgiven as rounding
          error rather than treated as corrupt.
        When it applies: chromosome step 08 (p-value scale), only when the column is on the raw scale.
        Values:
          The largest value still forgiven, in p-value units; the floor is 1.0, which forgives nothing
          above 1. Raising it, say to 2.0, rescues more values; anything above it is unsalvageable.
        Example: at 1.05 with the default 'clip', p = 1.02 is pulled back to 1 and flagged,
          while p = 1.20 is removed under the reject reason 'pval_out_of_range', detail
          "outside 0 to 1.05".
        Note: forgiven values are pulled back to pvalue.clip_high (1.0). A
          negative p-value fails the same gate as 1.20: removed under 'clip', 'reject' and 'fail',
          blanked and kept under 'null'.
      origin: p_values.py:230,261
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 100.0
        minimum: 1.0
        number_kind: float
    out_of_range:
      default: clip
      help: |-
        What it does: Decides what happens to a p-value outside the range the pipeline keeps.
        When it applies: chromosome step 07 for a raw p-value column, and chromosome step 08 when the
          standard error is derived from it; a log-scale column uses pvalue.mlogp_min/_max instead.
        Values:
          clip - forced back to pvalue.clip_low or pvalue.clip_high and flagged for the
            effect-statistics check; values above pvalue.tolerance_above_one are still removed.
          null - the p-value is blanked and the variant kept, impossible values included.
          reject - the variant is removed under the reject reason 'pval_out_of_range'.
          fail - the chromosome stops with an error listing the counts.
        Example: under 'clip', p = 0 becomes 1e-300 while p = 1.02 becomes 1 and is flagged.
          If SE is unavailable, the original zero is then governed by pvalue.zero_missing_se;
          clipping it no longer silently authorises SE reconstruction.
        Note: p = 1 itself is already valid and is left unchanged.
      origin: p_values.py:281
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - clip
        - 'null'
        - reject
        - fail
    verify_per_chromosome:
      default: false
      help: |-
        What it does: Re-runs p-value scale detection inside every chromosome as a cross-check
          on the study-wide answer.
        When it applies: chromosome step 08 (p-value scale), only when a study-wide decision was
          handed down, which is what the pipeline always does. The flag is also recorded in the
          decision record written at dataset step 07.
        Values:
          true - detection runs again on each chromosome's own rows: agreement is noted,
            disagreement is a warning, and the local verdict is stored in the QC record as
            pvalue_scale_chromosome_check. The study-wide answer is applied either way.
          false - no re-check and no extra pass over the p-value column.
        Example: The study-wide answer is 'neglog10', but chromosome 22 holds only strong hits,
          so its own median is 12 and the local detector refuses to decide. With true the log
          reads "Re-checking the p-value scale on this chromosome alone was inconclusive, which
          changes nothing" and the run continues. With false nothing is said.
        Note: This can only produce warnings, never change an outcome.
      origin: new
      recommendation: null
      type: bool
      validator:
        kind: flag
    se_tail:
      default: 2
      help: |-
        What it does: Chooses whether the p-value is read as one-sided or two-sided when a
          standard error is worked back out of it.
        When it applies: chromosome step 09 (standard error from effect size and p-value), and
          only when the study supplies no standard-error column; if one is present the step
          derives nothing.
        Values:
          2 - two-sided: the Z score is the normal tail quantile of p/2. Correct for GWAS, where
            the p-value covers effects in either direction.
          1 - one-sided: the Z score is the quantile of p itself, which is smaller, so the
            standard error comes out larger.
        Example: p = 5e-8 with a beta of 0.05. With 2 the Z score is 5.4513 and the standard
          error 0.009172; with 1 the Z score is 5.3267 and the standard error 0.009387, about
          2% larger.
        Note: Two-sided is correct for GWAS; change this only for a file you know reports
          one-sided p-values.
      origin: standard_error.py:13
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: 2
        minimum: 1
        number_kind: int

  # =================================================================
  # Shared chromosome 04 / 11 policy for user-provided EAF and INFO files
  # =================================================================
  external_reference:
    exact_duplicate_action:
      default: keep_one
      help: |-
        What it does: Decides how repeated allele-specific reference rows are handled when the
          normalized chromosome, position, both alleles and selected annotation value are
          identical. The same setting governs the chromosome strand/AF reference and user-provided
          EAF and INFO files.
        When it applies: chromosome step 04 for strand and EAF references and chromosome step 11
          for external INFO, before allele matching.
        Values:
          keep_one - retain the first identical row and remove the redundant copies.
          discard_all - remove every reference row at that duplicated allele key.
          fail - stop the chromosome and report an example duplicated key.
        Example: duplicate EUR frequencies [0.25, 0.25] under keep_one supply one 0.25 value.
        Note: Equality is assessed after coordinate/allele normalization and numeric conversion
          of the selected EAF or INFO column. Other unused reference columns do not affect it.
      origin: shared/allele_join.py:deduplicate_reference_values
      recommendation: keep_one
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [keep_one, discard_all, fail]
    non_identical_duplicate_action:
      default: discard_all
      help: |-
        What it does: Decides how repeated reference allele keys are handled when their selected AF,
          EAF or INFO values differ. The same setting governs strand, external EAF and external INFO
          references.
        When it applies: chromosome step 04 for strand and EAF references and chromosome step 11
          for external INFO, before any annotation value is attached to a study variant.
        Values:
          discard_all - remove every reference row for the ambiguous allele key; the affected
            study row is unmatched and follows the existing EAF or INFO missing-value policy.
          fail - stop the chromosome and report the key and distinct values for repair.
        Example: [0.25, 0.45] and [missing, 0.25] are both non-identical duplicates. The default
          discards both rows instead of guessing that one value is scientifically preferable.
        Note: keep-one is deliberately unavailable here because row order cannot establish which
          different scientific annotation is correct. Counts are written to the chromosome log.
      origin: shared/allele_join.py:deduplicate_reference_values
      recommendation: discard_all
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [discard_all, fail]

  # =================================================================
  # 10  chromosome 04   effect allele frequency
  # =================================================================
  eaf:
    clip_tolerance:
      default: 1.05
      help: |-
        What it does: Sets the largest frequency above 1 that is still treated as rounding
          error rather than a corrupt value.
        When it applies: chromosome step 04, every time a frequency column is described or
          cleaned - both the study's own column and a column merged from an external panel.
        Values: A larger value forgives bigger overshoots above 1 (at 1.20 a value of 1.18 is
          rounding error); a smaller one calls them corrupt and hands them to eaf.out_of_range.
          The floor is 1.00, which forgives nothing above 1. There is no matching grace below
          zero: any negative frequency is out of range whatever this is set to.
        Example: At the default 1.05 a frequency of 1.02 is not out of range, and the squeeze
          into 0 to 1 that always follows turns it into exactly 1.0 - which eaf.degenerate then
          removes by default. A frequency of 37.4 is above 1.05, so eaf.out_of_range decides it.
        Note: with eaf.out_of_range left at 'clip', every value above 1 ends at 1.0 whatever
          this is set to, so the tolerance then changes only the counts behind
          eaf.invalid_fraction_cutoff and the reported 'valid range' flag. It changes actual
          values only under 'null', 'reject' or 'fail'.
      origin: allele_frequency.py:70,136
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 100.0
        minimum: 1.0
        number_kind: float
    out_of_range:
      default: clip
      help: |-
        What it does: Decides what happens to a frequency below 0 or above eaf.clip_tolerance.
        When it applies: chromosome step 04, each time a frequency column is checked - the study's
          own column and a column merged from an external panel.
        Values:
          clip - the value is forced back into 0 to 1 and the variant is kept. This is what the
            pipeline did before the setting existed.
          null - the frequency is blanked and the variant is kept.
          reject - the variant is removed and written to the rejected-variants file with the reason
            eaf_out_of_range.
          fail - the step raises an error and the chromosome fails, but only if at least one such
            value actually exists.
        Example: with eaf.clip_tolerance at 1.05, frequencies of -0.03 and 37.4 are both out of
          range. Under 'clip' they become 0.0 and 1.0; under 'null' both become empty; under
          'reject' both variants are removed; under 'fail' the chromosome stops. A frequency of
          1.02 is not out of range under any of the four and is squeezed to 1.0 regardless.
        Note: every surviving frequency is squeezed into 0 to 1 whichever option is chosen, so
          'clip' and 'null' differ only for values beyond the tolerance. Clipping is also what
          creates frequencies of exactly 0 and 1, which eaf.degenerate removes by default - so
          'clip' plus the shipped eaf.degenerate loses the variant anyway, under a different reason.
      origin: allele_frequency.py:143
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - clip
        - 'null'
        - reject
        - fail
    external_min_match_fraction:
      default: 0.8
      help: |-
        What it does: Sets the smallest share of a chromosome's variants that must receive a
          usable effect-allele frequency from the external file before the merge counts as a
          success. Matching only chromosome, position and alleles is not enough when the matched
          frequency is empty or invalid.
        When it applies: chromosome step 04, only when the frequency is taken from an external
          file named by the dataset's external_eaf_file setting, which happens when the study has
          no usable frequency column of its own. The comparison-AF panel is never used to fill
          missing study frequencies.
        Values: Larger demands a more complete panel and stops the chromosome sooner; smaller
          accepts a deliberately limited panel. The numerator counts matched frequencies that are
          present, finite and between 0 and 1; the denominator is every study variant on that
          chromosome. Exactly the configured fraction passes.
        Example: chromosome 1 has 1,000 study variants. Allele keys match for 900, but 150 matched
          frequencies are empty, so only 750 usable frequencies were supplied: 75%. The default
          0.80 stops and reports both the 90% key match and 75% usable-frequency match. If 800
          frequencies are usable, exactly 80% passes.
        Note: The default 0.80 is intended for genome-wide panels such as 1000 Genomes and detects
          wrong builds, incompatible allele coding, incorrect frequency columns and incomplete
          files. A deliberately restricted custom panel may explicitly lower this value.
      origin: allele_frequency.py:merge_external_allele_frequencies
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    palindromic_handling:
      default: ignore
      help: |-
        What it does: Optionally applies an additional conservative exclusion to matched
          palindromic variants (A/T, C/G) when EAF comes from an external file.
        When it applies: chromosome step 04 after study-wide consensus has already fixed strand;
          never for the study's own frequency column.
        Values:
          ignore - nothing is done and the eaf_palindromic_flag column is not created.
          null - blanks the frequency of every matched palindromic variant.
          reject - removes every matched palindromic variant and records rejection provenance.
        Example: under reject, a consensus-oriented A/T row is still removed when its EAF source is
          external; under ignore it proceeds to the standard post-orientation reference-AF QC.
        Note: Frequency-based strand resolution is intentionally unavailable. Population AF never
          chooses strand or changes strand_action, BETA, Z, or EAF orientation.
      origin: allele_frequency.py:merge_external_allele_frequencies
      recommendation: ignore
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - ignore
        - 'null'
        - reject
    match_orientations:
      default:
      - direct
      - swap
      help: |-
        What it does: Chooses which allele orderings are tried when looking a variant up in an
          external frequency file.
        When it applies: chromosome step 04, only when the frequency is taken from an external
          file rather than from the study's own column.
        Values:
          direct - the study's effect allele is matched to the panel's ALT and the other allele to
            the panel's REF; the panel frequency is used as it stands.
          swap - the study's effect allele is matched to the panel's REF instead, and the panel
            frequency is replaced by one minus itself.
          complement - accepted by the validator but not implemented; asking for it stops the step
            with an error pointing at dataset-level strand detection instead.
          complement_swap - likewise accepted and not implemented, and stops the step the same way.
          Order does not matter: 'direct' is always tried first and 'swap' only on what direct left
          unmatched. Naming just one of them turns the other pass off; the list may not be empty.
        Example: a study row chr1:12345 with EA=A, OA=G against a panel row REF=G, ALT=A carrying
          EAF 0.30 matches on the direct pass and takes 0.30. A study row with EA=G, OA=A does not
          match directly; the swap pass matches it and gives 1 - 0.30 = 0.70.
        Note: complement passes are deliberately left out: strand is a property of the whole study
          rather than of individual variants, and for palindromic variants a complement pass
          produces two equally valid matches with no principled way to choose between them.
      origin: allele_frequency.py:390-420
      recommendation: null
      type: list
      validator:
        allow_empty: false
        item:
          allow_none: false
          kind: enum
          members:
          - direct
          - swap
          - complement
          - complement_swap
        kind: list
        unique: true
        upper: false
    maf_decision_cutoff:
      default: 0.95
      help: |-
        What it does: Sets the share of frequency values at or below 0.5 above which a column is
          suspected of holding minor allele frequencies rather than effect allele frequencies.
        When it applies: Only when the study supplies its own frequency column. Dataset step 07
          uses it to make the study-wide screening decision on the whole file before the split.
          Chromosome step 04 reports the same statistic while validating the selected column; a
          direct library caller without a study-wide decision is not allowed to guess. The share
          is measured among non-empty values only.
        Values: Larger makes the pipeline slower to suspect a minor allele frequency; smaller
          suspects one sooner. A real effect allele frequency column has roughly half its values at
          or below 0.5; a real minor allele frequency column has all of them.
        Example: 6,400,000 variants carrying a frequency with 6,300,000 of them at or below 0.5 is
          a share of 0.984. That is above the default 0.95, so step 07 records the column as
          MAF-like and step 04 checks it against the configured default EAF table.
      origin: allele_frequency.py:105,474
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    maf_reference_min_overlap:
      default: 1000
      help: |-
        What it does: Sets the fewest non-palindromic variants shared with the default EAF table
          before a MAF-like study column can be classified from reference-frequency distances.
        When it applies: chromosome step 04 only after the whole-study distribution flags the
          supplied frequency column as MAF-like. Direct and allele-swapped matches both count.
        Values: Larger requires stronger chromosome-level evidence; smaller permits a decision
          from fewer variants. Below this count the result is inconclusive and processing stops;
          PostGWAS never guesses that an unconfirmed MAF-like column is effect-aligned EAF.
        Scientific basis: frequency is usable only when it is aligned to the listed effect allele;
          the comparison therefore tests input AF against both aligned reference EAF and reference
          MAF after allele matching. The default is deliberately conservative for GWAS-scale data.
      origin: allele_frequency.py:confirm_eaf_with_reference
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 1
        number_kind: int
    reference_minor_fraction_cutoff:
      default: 0.95
      help: |-
        What it does: Detects a reference comparison that cannot reliably distinguish EAF from MAF
          because almost every matched reference effect allele is itself minor (reference EAF at or
          below 0.5). Such a panel makes aligned EAF and folded MAF nearly identical.
        When it applies: chromosome step 04, after a study column was flagged MAF-like and at least
          eaf.maf_reference_min_overlap non-palindromic reference matches are available.
        Values: If the share is greater than this cutoff, the result is inconclusive and the
          chromosome stops. Larger values permit more reference sets to reach the error comparison;
          smaller values are more conservative. This is deliberately separate from
          eaf.maf_decision_cutoff, which screens the study column rather than the reference panel.
        Example: if 980 of 1,000 aligned reference frequencies are at or below 0.5, the share is
          0.98. That exceeds the default 0.95, so PostGWAS reports inconclusive instead of treating
          equal EAF and MAF errors as proof of EAF.
      origin: allele_frequency.py:confirm_eaf_with_reference
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    maf_reference_error_margin:
      default: 0.02
      help: |-
        What it does: Sets the minimum separation required between mean absolute error as aligned
          EAF and mean absolute error as folded MAF before either interpretation is accepted.
        When it applies: chromosome step 04, only for a MAF-like study column after the overlap and
          reference-informativeness checks pass.
        Values: Units are allele-frequency points on the 0 to 1 scale. EAF is confirmed only when
          its mean error plus this margin is lower than the MAF error; MAF is confirmed by the
          reverse inequality. A tie or smaller difference is inconclusive and stops processing.
          Larger values demand stronger evidence; 0 allows any strict difference to decide.
        Example: mean errors 0.01 as EAF and 0.20 as MAF confirm EAF at the default 0.02 margin.
          Errors 0.10 and 0.11 differ by only 0.01, so PostGWAS stops rather than letting noise decide.
      origin: allele_frequency.py:confirm_eaf_with_reference
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    invalid_fraction_cutoff:
      default: 0.05
      help: |-
        What it does: Sets how large a share of out-of-range frequencies is tolerated before warning.
        When it applies: chromosome step 04, on the study's own frequency column and on one merged
          from an external panel. Out of range means below 0 or above eaf.clip_tolerance.
        Values: Larger tolerates more nonsense in silence, smaller warns sooner. It is a share of every
          row on the chromosome, empty values included in the denominator.
        Example: 30,000 of 500,000 variants above 1.05 is 6%, above the default 0.05, so a warning
          names the column and the count; on the study's own column the QC field
          internal_af_valid_range is also set to false, while on the panel path that verdict is
          discarded and no QC field is written. At 0.10 the same file passes in silence.
        Note: a warning and that QC field are all it produces - the column is used either way and is
          never diverted to the reference panel on the strength of this number; eaf.out_of_range has
          already decided what happens to the out-of-range values.
      origin: allele_frequency.py:106
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    missing_fraction_cutoff:
      default: 0.05
      help: |-
        What it does: Sets how large a share of empty frequency values is tolerated before a
          warning is printed.
        When it applies: chromosome step 04, each time a frequency column is checked - the study's
          own column, and a column merged from an external panel, where every unmatched variant is
          left empty.
        Values: Larger tolerates more gaps in silence; smaller warns sooner. It is a share of every
          row on the chromosome, taken from the count of empty values in the column.
        Example: 500,000 variants of which 40,000 have no frequency after the panel merge is 8%,
          above the default 0.05, so a warning names the column, the count and the share. At 0.10
          the same file is silent.
        Note: this warning used to be unreachable, because missingness was measured as a change in
          row count and blanking a value never changes the row count. It is now the honest count of
          empty values and does fire. It is still only a warning: nothing is removed, and no other
          setting reads this number.
      origin: allele_frequency.py:107
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    degenerate:
      default: reject
      help: |-
        What it does: Decides what happens to a variant whose effect allele frequency is exactly 0
          or exactly 1, where the standard-error formula divides by zero.
        When it applies: chromosome step 04 after any clipping, and again at step 06 for the rows
          that feed the beta-and-SE-from-Z calculation.
        Values:
          reject - remove the variant and record it as eaf_degenerate.
          null - blank the frequency and keep the variant; step 04 also blanks the derived zmaf.
          keep - export the frequency as 0 or 1 unchanged.
          fail - stop the chromosome if any such variant exists.
        Example: a frequency of 96.1 clipped to 1.0 makes 2*p*(1-p)*(Neff+z^2) exactly zero, so
          BETA and SE come out infinite. Under keep, step 10 removes them as se_non_finite instead,
          so the variant is lost either way - reject just names the real cause.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - reject
        - 'null'
        - keep
        - fail
  # =================================================================
  # 11  dataset 04 / chromosome 05   missing sample size and effective N
  # =================================================================
  sample_size:
    trait_type:
      default: auto
      help: |-
        What it does: Declares the study design and guards which sample-count inputs and effective
          sample-size calculation are scientifically valid for that design.
        When it applies: During sample-sheet validation, before the summary-statistics file is
          analysed, and again at chromosome step 05 to protect direct library callers.
        Values:
          auto - the configured counts determine the calculation: case plus control counts use the
            case/control Neff formula, while a lone control count follows sample_size.controls_only.
          binary - both a case count and a control count are required and Neff is calculated as
            4 / (1/Ncase + 1/Ncontrol).
          quantitative - any case-count field stops the run. The normal sample sheet requires the
            control-count field, which represents total sample size; with the shipped controls-only
            policy, Neff is set to that total count without applying the case/control formula.
        Example: a quantitative study with control_count = 50,000 gets Neff = 50,000. Adding a case
          count stops validation instead of calculating case/control Neff. A binary study with
          Ncase = 12,000 and Ncontrol = 50,000 gets Neff = 38,710 after rounding.
        Scientific basis: the harmonic effective-size formula is specific to case/control studies.
          Applying it to quantitative-trait counts would misrepresent the analysed sample size.
        Note: for quantitative traits, the control-count field name is retained by the current sample
          sheet interface but its value is interpreted as total N, not as the number of controls.
      origin: sample_sheet.py:HarmonisationSampleSheetRow.validate_alternatives; sample_size.py:_harmonise
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - auto
        - binary
        - quantitative
    min_value:
      default: 1
      help: |-
        What it does: Sets the smallest case count, control count or effective sample size that is
          allowed to survive.
        When it applies: Three places. The configuration check at dataset step 01 tests the fixed
          ncase / ncontrol / n / total_n numbers written in the config; chromosome step 05 tests the
          per-variant case and control count columns and then Neff; chromosome step 06 tests Neff again
          before BETA and SE are derived from a Z score.
        Values: A whole number of individuals. Raising it removes more variants: a present case or
          control count below the floor is rejected as 'sample_size_invalid', and a calculated Neff
          below it is rejected as 'neff_invalid'. Missing values are governed separately by
          sample_size.missing_action and sample_size.max_missing_fraction.
        Example: with a per-variant control-count column holding 0 for 812 variants, the shipped
          min_value 1 rejects those 812 as 'sample_size_invalid' before VCF creation.
        Note: A study or effective sample size of zero cannot represent an analysed variant, so both
          the default and the smallest configurable value are 1.
      origin: sample_size.py:harmonise_sample_sizes
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 1
        number_kind: int
    controls_only:
      default: use_ncontrol_as_total
      help: |-
        What it does: Says what a control count means when it is the only sample-size count the study
          provides.
        When it applies: chromosome step 05, and only when a control count (a column or one fixed
          number) is configured and no case count is. When both are configured the case/control formula
          wins and this setting is never consulted.
        Values:
          use_ncontrol_as_total - the lone control count is read as the total sample size and copied
            straight into Neff, which is the correct reading for a quantitative trait.
          fail - the run stops with an error naming this setting.
        Example: a quantitative-trait file with ncontrol = 450,000 and no case count gives every
          variant Neff = 450,000, and a DECIDE line records that the lone count was read as the total.
          The shipped default is what the pipeline already assumed and needs no change.
      origin: sample_size.py:115
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - use_ncontrol_as_total
        - fail
    cases_only:
      default: fail
      help: |-
        What it does: Says what a case count means when it is the only sample-size count the study
          provides.
        When it applies: chromosome step 05, and only when a case count is configured and no control
          count is. When both are configured this setting is never consulted.
        Values:
          fail - the run stops with an error naming this setting.
        Example: ncase = 10,000 with no control count stops because the effective size would be 20,000
          for a balanced study and would approach 40,000 as the number of controls grows.
        Note: A lone case count cannot determine effective sample size, so fail is the only accepted
          value. Provide both case and control counts for a case/control GWAS.
      origin: sample_size.py:120
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - fail
    missing_action:
      default: remove
      help: |-
        What it does: Controls what happens to variants whose configured per-variant case,
          control or total sample-size value is missing.
        When it applies: Dataset step 04 first measures missingness over the complete study.
          If the allowed fraction is not exceeded, chromosome step 05 applies this action before
          Neff is calculated. Fixed sample sizes from the sample sheet cannot be missing per row.
        Values:
          remove - reject every affected variant and record it as sample_size_invalid.
          median - fill each affected source column with its own dataset-wide median.
          mean - fill each affected source column with its own dataset-wide mean.
          fail - stop when even one variant has a missing sample size.
        Example: If NCONTROL is missing for 50 of 10,000 variants and the action is median, those
          50 values receive the median of the 9,950 usable NCONTROL values. For a case/control
          study, NCASE and NCONTROL are handled separately and Neff is calculated afterwards.
        Note: remove is the scientifically conservative default. MungeSumstats also drops rows
          with missing N by default and describes sample-size imputation as a last resort. Median
          is more resistant than mean to unusually large study counts. Any imputation is explicit,
          counted and logged; the original input is never overwritten.
        Source: https://www.bioconductor.org/packages/release/bioc/vignettes/MungeSumstats/inst/doc/MungeSumstats.html
      origin: sample_size.py:prepare_missing_sample_sizes
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - remove
        - median
        - mean
        - fail
    max_missing_fraction:
      default: 0.01
      help: |-
        What it does: Sets the largest fraction of variants allowed to have a missing configured
          case, control or total sample size. A row is counted once even when both case and control
          counts are missing.
        When it applies: Dataset step 04, after the complete input has been read and before genome
          build inference or chromosome splitting. The comparison is strictly greater-than, so a
          missing fraction exactly equal to this value is allowed.
        Values: A fraction from 0 to 1. The shipped value 0.01 permits the configured missing action
          only when at most 1% of variants are affected. Above the limit, the dataset stops with an
          error reporting the missing count, observed percentage and configured maximum.
        Example: At 0.01, 100 missing values among 10,000 variants are allowed; 101 stop the run.
        Note: This is an operational safety ceiling, not evidence that imputation below 1% is free
          of bias. Use remove unless preserving those variants is scientifically justified.
      origin: sample_size.py:prepare_missing_sample_sizes
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float

  # =================================================================
  # 12  chromosome 10   the SE / BETA / Z gates
  # =================================================================
  validation:
    declaration_mismatch_action:
      default: warn
      help: |-
        What it does: Controls what happens when automatic inspection disagrees with an explicit
          effect type, p-value type, or delimiter declared in the sample sheet.
        When it applies: Dataset step 02 for delimiter and dataset step 07 for effect and p-value
          types. Detection still runs as an independent cross-check; the declared value remains
          authoritative when processing continues.
        Values:
          warn - print a bright-red terminal warning, record it in the canonical log and continue
            using the sample-sheet declaration.
          fail - print and record the same warning, then stop the dataset before chromosome work.
        Example: effect_type is beta but the detector reports odds_ratio. With warn, beta is used;
          with fail, the dataset stops so the declaration can be checked.
      origin: input_validation.py and study_properties.py
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [warn, fail]
    se_division_floor:
      default: 1.0e-12
      help: |-
        What it does: Sets the smallest positive standard error that can be used as the
          denominator when calculating Z = BETA / SE.
        When it applies: chromosome step 09, only when Z is calculated from effect size and
          standard error. Values at or below the floor are treated as invalid standard errors
          under validation.se_invalid rather than producing an unstable or infinite Z score.
        Values: Any finite number greater than zero, on the same scale as the standard error.
      origin: z_score.py:derive_z_score_from_effect_and_standard_error
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: true
        integer: false
        kind: num
        maximum: null
        minimum: 0.0
        number_kind: float
    se_invalid:
      default: reject
      help: |-
        What it does: Decides what happens to a standard error that is missing, infinite, or not
          greater than zero.
        When it applies: chromosome step 10 whenever a standard-error column is present, and the same
          setting is read at chromosome step 09 when the Z score is computed as BETA / SE. If no
          standard-error column is present at step 10 the check is skipped and a warning says every
          variant passed this part of the gate untested. In the normal pipeline, step 10 reuses the
          step-09 result only when the exact DataFrame, column mapping and policy still match.
        Values:
          reject - the variants are removed and written to the reject file under 'se_null',
            'se_non_finite' or 'se_non_positive', according to which of the three rules caught them.
          keep - they are counted and reported but left in the data; at step 09 their Z score then
            comes out empty.
          fail - the chromosome stops as soon as one variant matches.
        Example: with eaf.out_of_range set to 'clip', a frequency forced to exactly 0 makes the
          variance denominator 2*p*(1-p)*(Neff + z^2) exactly zero, so the standard error comes out
          infinite and the variant is recorded under 'se_non_finite'. Finiteness is tested before the
          'greater than zero' rule, because infinity passes a greater-than-zero test.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - reject
        - keep
        - fail
    se_from_clipped_pval:
      default: reject
      help: |-
        What it does: Removes a variant whose standard error was computed from a p-value that had
          been clipped without an explicit scientifically named approximation policy, because
          that standard error is arithmetic, not evidence.
        When it applies: chromosome step 10, on rows carrying the SE-from-clipped-p-value marker
          set at step 08. A literal p=0 accepted through pvalue.zero_missing_se = approximate has
          its own marker and is not rejected here because the user explicitly selected it.
        Values:
          reject - remove the variant and record it as se_from_clipped_pval.
          keep - export it unchanged; nothing else will catch it.
          fail - stop the chromosome if any such variant exists.
        Example: p clipped to 0.999999999 gives norm.ppf(0.4999999995) = -1.25e-09, so beta 0.01
          yields SE about 7,978,846 - positive and finite, so the SE gates above pass it.
        Note: pvalue.out_of_range = clip and log-scale floor/cap handling can set the upstream
          clipping markers. Step 08 marks only rows whose SE was actually derived from those
          clipped values, so a valid supplied or Z-derived SE is not rejected by this rule.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - reject
        - keep
        - fail
    beta_invalid:
      default: reject
      help: |-
        What it does: Decides what happens to an effect size that is missing, infinite, or not a
          number.
        When it applies: chromosome step 10 whenever an effect-size column is present, and the same
          setting is read at chromosome step 09 before Z = BETA / SE is computed. If no effect-size
          column is present at step 10 the check is skipped and a warning says every variant passed
          this part of the gate untested. In the normal pipeline, step 10 reuses the step-09 result
          only when the exact DataFrame, column mapping and policy still match.
        Values:
          reject - the variants are removed and recorded under reason 'beta_invalid'.
          keep - they are counted and reported but left in the data.
          fail - the chromosome stops as soon as one variant matches.
        Example: with effect.or_non_positive set to 'keep', an odds ratio of 0 becomes log(0), which is
          minus infinity; under 'reject' that variant leaves at step 09 or 10 under 'beta_invalid'. A
          BETA column read as text with 41 cells holding '.' produces 41 empty values and the same
          outcome.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - reject
        - keep
        - fail
    beta_zero:
      default: keep
      help: |-
        What it does: Decides what happens to an effect size of exactly zero.
        When it applies: chromosome step 10, and chromosome step 09 when the Z score is computed from
          BETA and SE. It is tested after the missing-or-infinite rule, so only genuine zeros reach it.
        Values:
          keep - the variants stay; with a valid standard error an effect size of 0 is a legitimate
            null result giving a Z score of 0.
          reject - the variants are removed and recorded under reason 'beta_zero'.
          fail - the chromosome stops if any effect size is exactly zero.
        Example: a file that reports BETA to four decimal places writes a true effect of 0.00004 as
          0.0000. Under 'keep' it remains a valid null estimate; under 'reject' it is discarded.
        Note: 'keep' is the scientific default. Use 'reject' only when the study documentation says
          zero is a missing-value sentinel rather than an estimated null effect.
      origin: z_score.py:11
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - keep
        - reject
        - fail
    z_invalid:
      default: reject
      help: |-
        What it does: Decides what happens to a Z score that is missing, infinite, or not a number.
        When it applies: Three points. chromosome step 06, where BETA and SE are derived from a
          study-supplied Z score; chromosome step 09, after Z = BETA / SE has been computed; and
          chromosome step 10 whenever a Z-score column is present. If no Z column is present at step 10
          the check is skipped and a warning says every variant passed this part of the gate untested.
          In the normal pipeline, step 10 reuses the step-09 result only when the exact DataFrame,
          column mapping and policy still match.
        Values:
          reject - the variants are removed and recorded under reason 'z_invalid'.
          keep - they are counted and reported but left in place; at step 06 their BETA and SE are then
            left empty.
          fail - the chromosome stops as soon as one variant matches.
        Example: a study supplying only a Z score, with 1,203 blank Z cells, loses those 1,203 at step
          06 under 'z_invalid' before any BETA can be derived for them. Under 'keep' they carry on with
          an empty BETA and SE and are removed instead by the final completeness check at step 13.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - reject
        - keep
        - fail
    beta_se_z_concordance:
      default: warn
      help: |-
        What it does: Compares a supplied Z score with BETA divided by SE, using the standard Wald
          statistic identity Z = BETA / SE.
        When it applies: chromosome step 10, after unusable BETA, SE and Z values have been handled.
          It needs all three columns. Agreement means |Z - BETA/SE| is no greater than
          beta_se_z_absolute_tolerance + beta_se_z_relative_tolerance * |BETA/SE|.
        Values:
          off - do not compare the statistics.
          warn - count and report discordant variants but retain them.
          reject - remove discordant variants and record reason 'beta_se_z_discordant'.
          fail - stop the chromosome when any discordant variant is found.
        Example: BETA = 0.2 and SE = 0.1 imply Z = 2.0. A supplied Z of 5.0 is discordant under the
          default tolerances; a supplied Z of 2.01 is retained as compatible with rounding.
        Note: warn is the scientific default because published summary statistics are often rounded.
          A warning should be investigated before changing the action to reject or fail.
      origin: effect_validation.py:_beta_se_z_concordance
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: ['off', warn, reject, fail]
    beta_se_z_absolute_tolerance:
      default: 0.01
      help: |-
        What it does: Sets the fixed rounding allowance for the BETA/SE versus Z comparison.
        When it applies: chromosome step 10 when validation.beta_se_z_concordance is enabled.
        Values: A non-negative Z-score difference. It is combined with the relative tolerance rather
          than used alone, so comparisons remain useful near Z = 0 and for large absolute Z scores.
        Example: with absolute tolerance 0.01 and relative tolerance 0.01, an expected Z of 2.0 may
          differ by at most 0.03.
      origin: effect_validation.py:_beta_se_z_concordance
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: null
        minimum: 0.0
        number_kind: float
    beta_se_z_relative_tolerance:
      default: 0.01
      help: |-
        What it does: Sets the proportional rounding allowance for the BETA/SE versus Z comparison.
        When it applies: chromosome step 10 when validation.beta_se_z_concordance is enabled.
        Values: A non-negative fraction of |BETA/SE|. The default 0.01 means one percent, in addition
          to the configured absolute tolerance.
        Example: for expected Z = 10, the default relative contribution is 0.1 and the total allowed
          difference is 0.11 after adding the default absolute tolerance.
      origin: effect_validation.py:_beta_se_z_concordance
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: null
        minimum: 0.0
        number_kind: float
    z_pval_concordance:
      default: warn
      help: |-
        What it does: Compares the p-value implied by each variant's Z score with the p-value the study
          actually reports, and acts when the two disagree.
        When it applies: chromosome step 10, after the SE, BETA and Z rules. It needs both a Z-score
          column and a p-value column. Missing columns are logged as an untested check; missing numpy
          or scipy stops the chromosome because an enabled scientific check must not silently skip.
          How much disagreement is allowed is set by validation.z_pval_tolerance_log10.
        Values:
          off - the comparison is not made at all; nothing is computed.
          warn - discordant variants are counted and reported, and nothing is removed.
          reject - discordant variants are removed and recorded under reason 'z_pval_discordant'.
          fail - the chromosome stops if a single variant is discordant.
        Example: a variant with Z = 1.96 implies a two-sided p of 0.05. If the file reports 1e-8 for
          it, the two disagree by 6.7 orders of magnitude, far beyond the default tolerance of 1.0, so
          the variant is flagged.
        Note: warn is the scientific default because this one check catches a fabricated standard
          error, a clipped p-value and a misread effect type without silently removing data. The
          comparison assumes the reported p-value is two-sided.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - 'off'
        - warn
        - reject
        - fail
    z_pval_tolerance_log10:
      default: 1.0
      help: |-
        What it does: Sets how far the p-value implied by the Z score may differ from the reported
          p-value before a variant counts as discordant.
        When it applies: chromosome step 10, and only when validation.z_pval_concordance is set to
          something other than 'off'.
        Values: Orders of magnitude on the -log10 p scale. 1.0 tolerates a factor of ten between the
          two p-values; larger values tolerate more and flag fewer variants, smaller values are
          stricter, and 0 flags any difference at all. The ceiling is 100, which in practice switches
          the check off.
        Example: Z = 5.0 implies a two-sided p of 5.7e-07, which is 6.24 on the -log10 scale. A
          reported p of 1e-07 (7.00) is 0.76 away and passes at 1.0; a reported p of 1e-09 (9.00) is
          2.76 away and is flagged.
        Note: a p-value column that is one-sided rather than two-sided disagrees by exactly
          log10(2) = 0.30 for every single variant, which the default 1.0 hides. Do not tighten below
          0.3 unless you know the column is two-sided.
      origin: new
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 100.0
        minimum: 0.0
        number_kind: float
    warn_reject_fraction:
      default: 0.2
      help: |-
        What it does: Sets the share of a chromosome's variants that the effect-statistics gate may
          remove before it prints a prominent warning.
        When it applies: chromosome step 10, once, at the end of the step. The share counted is what
          step 10 alone removed out of what entered step 10 - variants removed by earlier steps do not
          count towards it.
        Values: A share of the variants entering the step. Lowering it warns more often; 0 warns
          whenever a single variant is removed. 1.0 can never be exceeded, so it never warns.
        Example: 900,000 variants enter step 10 and 200,000 are removed, which is 22.22% and above the
          default 0.2, so a warning naming validation.warn_reject_fraction is printed and the run
          continues. Had 150,000 been removed (16.67%) nothing would be printed.
        Note: this must not be set above validation.max_reject_fraction. The policy loader refuses that
          combination, because the run would fail before the warning could ever be printed.
      origin: new
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    max_reject_fraction:
      default: 1.0
      help: |-
        What it does: Sets the share of a chromosome's variants that the effect-statistics gate may
          remove before the chromosome is failed outright.
        When it applies: chromosome step 10, once, at the end of the step and tested before the warning
          threshold. As with the warning, the share is what step 10 alone removed out of what entered
          step 10 - removals by earlier steps do not count towards it.
        Values: A share of the variants entering the step. Lowering it fails sooner; 0 fails as soon as
          one variant is removed. At the shipped 1.0 the test can never fire, because the share removed
          can never be more than all of them.
        Example: at 0.95, with 1,000,000 variants entering step 10 and 960,000 removed, the chromosome
          stops with an error pointing you at the study-level effect-type and p-value-type DECIDE
          lines. At the shipped 1.0 the same chromosome carries on with 40,000 variants.
        Note: Recommended: 0.95, because losing everything is always a bug rather than a result.
      origin: new
      recommendation: '0.95'
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    on_ambiguous_column_mapping:
      default: fail
      help: |-
        What it does: Decides what happens when two configuration keys point at the same column of the
          input file.
        When it applies: Twice. At dataset step 02 the header check reports it, and 'fail' makes that
          report an error that stops the run there. At dataset step 03, when the file is actually read,
          'fail' raises again and names both configuration keys.
        Values:
          fail - reported as an error, so the run stops at the header check, and the read refuses too.
          warn - reported as a warning, the column is read once, and the run continues.
        Example: a config with beta_or_col: Z and imp_z_col: Z both naming the column 'Z'. Before this
          setting existed the run died with a polars "duplicate output name 'Z'" error that named the
          column and not the two configuration keys; now the message names beta_or_col and imp_z_col.
      origin: summary_statistics_io.py:read_summary_statistics
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - fail
        - warn
    fuzzy_match_cutoff:
      default: 0.6
      help: |-
        What it does: Sets how similar a column name in the file must be to a name in the configuration
          before it is offered as a 'did you mean' suggestion.
        When it applies: Only once a configured column name has already been found to be absent - at
          dataset step 01 for a column named inside an external frequency or imputation-quality file,
          and at dataset step 02 for the main header check. It changes the wording of the error message
          only; no variant and no run outcome depends on it. A name that differs only in capitalisation
          or surrounding spaces is matched by a separate rule and never reaches this cutoff.
        Values: A similarity score between 0 and 1. Lower values suggest a name even when it is barely
          alike; 1 suggests only an exact match, which by definition cannot exist here, so the message
          falls back to listing the columns the file does have.
        Example: the config says 'EAF' and the file has 'EAF_A1', a similarity of 0.67. At the default
          0.6 the message reads "Closest match in file: 'EAF_A1'"; at 0.7 it reads "No similar column
          name." instead.
        Note: the comparison is case-sensitive, so 'BETA' against a file column 'beta_1' scores 0 and
          no suggestion appears at any cutoff. Lowering this setting will not help there.
      origin: new
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    on_duplicate_header:
      default: fail
      help: |-
        What it does: Decides what happens when the header line carries the same column name twice.
        When it applies: dataset step 02, the header check, before a single line of data is read.
        Values:
          fail - the repeated name is reported as an error and the run stops at the header check.
          warn - it is reported as a warning and the run continues, silently using the first of the
            two columns.
        Example: a file whose header contains 'P' twice is read by polars as 'P' and 'P_duplicated_0',
          so a config with pval_col: P quietly gets whichever 'P' came first. At 'fail' the run stops
          and names the column; at 'warn' it goes ahead with the first one.
        Note: the step-03 read notices this too - summary_statistics_io.py matches the
          '_duplicated_<n>' suffix polars actually writes, names every renamed column, and applies this
          same setting. There is no separate hidden duplicate-count threshold.
      origin: summary_statistics_io.py:load_summary_statistics_table
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - fail
        - warn

  # =================================================================
  # 13  chromosome 11   imputation quality
  # =================================================================
  info:
    out_of_range:
      default: clip
      help: |-
        What it does: Decides what happens to an imputation quality score outside the allowed window.
        When it applies: chromosome step 11, for a score below info.clip_min or above
          info.clip_tolerance - not info.clip_max; that overshoot is rescaled as rounding error first.
        Values:
          clip - forced back between info.clip_min and info.clip_max; logged as a warning with count.
          null - the score is blanked and the variant kept; info.on_missing (default 'keep') decides.
          reject - the variant is removed with the reject reason 'info_out_of_range'.
          fail - the chromosome stops with an error giving the count and the window.
        Example: with the shipped 0.0-1.0 and tolerance 1.05, a score of 37.4 - the usual sign of an
          INFO column that holds something else, such as a sample size - becomes 1.0 under 'clip'.
        Note: mirrors eaf.out_of_range. 'clip' hides the mistake it corrects - a column of 37.4s
          becomes 1.0s that pass every later filter. On an unfamiliar study prefer 'reject' or 'fail'.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - clip
        - 'null'
        - reject
        - fail
    clip_min:
      default: 0.0
      help: |-
        What it does: Sets the lowest imputation quality score the pipeline treats as legitimate.
        When it applies: chromosome step 11 (imputation quality), on every run, whether the score
          came from the study's own column or from a reference file.
        Values: A higher floor sends more low scores into the out-of-range branch; a lower one
          lets negative or near-zero scores through. Same units as the score, so 0.0 is the
          natural floor. It must be below info.clip_max, or the run is rejected before any
          chromosome starts.
        Example: with clip_min 0.0, a score of -0.02 - a rounding artefact that turns up in older
          r2 files - is below the floor. At the 'clip' default of info.out_of_range it becomes
          0.0; with 'reject' the variant leaves the data and is written to the rejected-variants
          file with the reason 'info_out_of_range'.
        Note: there is deliberately no equivalent of the frequency step's "degenerate" check here.
          A score of exactly 0 is meaningless but not fatal, so it is kept and only removed later
          by filter.info_cutoff (0.7 by default) in the post-merge filter.
      origin: new
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    clip_max:
      default: 1.0
      help: |-
        What it does: Sets the highest imputation quality score the pipeline treats as legitimate.
        When it applies: chromosome step 11 (imputation quality), on every run, whether the score
          came from the study's own column or from a reference file.
        Values: A larger ceiling lets higher scores through untouched; a smaller one pushes more
          variants into the out-of-range branch. Same units as the score itself, so 1.0 is the
          usual theoretical maximum for an r2 or INFO score. It must sit above info.clip_min, or
          the run is rejected before any chromosome starts.
        Example: with clip_max 1.0 a score of 0.98 passes untouched, and a score of 1.4 is out of
          range, so info.out_of_range decides - at its 'clip' default the score becomes exactly
          1.0. 'clip' also uses this value as the upper end it clips to.
        Note: this ceiling is NOT the boundary for "out of range". A score between the ceiling and
          info.clip_tolerance (1.05 by default) is quietly rescaled down to the ceiling as
          rounding error first, so only scores above 1.05 ever reach info.out_of_range.
      origin: new
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 100.0
        minimum: 0.0
        number_kind: float
    clip_tolerance:
      default: 1.05
      help: |-
        What it does: Sets how far above the ceiling a score may sit and still be treated as
          rounding error rather than a bad value.
        When it applies: chromosome step 11 (imputation quality), on every run. This value, not
          info.clip_max, is the real upper boundary for "out of range".
        Values: A larger tolerance silently rescales more high scores down to info.clip_max; a
          smaller one hands them to info.out_of_range instead. Same units as the score. A value
          at or below info.clip_max switches the rescale off entirely, because the effective
          limit is whichever of the two is larger.
        Example: with clip_max 1.0 and clip_tolerance 1.05, a score of 1.02 is set to 1.0 and
          counted in the log as "imputation quality rounding error", with no warning. A score of
          1.4 is above the tolerance, so info.out_of_range decides - 'clip' also lands it on 1.0,
          but it is counted separately and logged as a warning.
        Note: set this to 1.0 if you would rather see scores above the ceiling reported than
          quietly flattened; that makes every such score out of range and visible.
      origin: new
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 100.0
        minimum: 1.0
        number_kind: float
    low_quality_threshold:
      default: 0.3
      help: |-
        What it does: Sets the score at or below which a variant is counted and reported as poorly
          imputed.
        When it applies: chromosome step 11, on every run. It is a reporting threshold only - no
          variant is changed, blanked or removed because of it.
        Values: A higher threshold puts more variants in the "poor imputation" tally and fewer in
          the "good" one; a lower threshold does the reverse. Same units as the score.
        Example: with 0.3, a variant scoring 0.25 is added to the poorly-imputed count in the step
          log and the QC summary, but keeps its score and stays in the data. It disappears only
          later, if filter.info_cutoff (0.7 by default) drops it in the post-merge filter.
        Note: this is not the removal cutoff, and the two shipped values disagree - 0.3 here
          against filter.info_cutoff 0.7 - so the count reported at step 11 is far smaller than
          the number of variants actually thrown away later. Set it to 0.7 if you want the
          harmonisation report to predict what the filter will do.
      origin: new
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    on_missing:
      default: keep
      help: |-
        What it does: Decides what happens to a variant that still has no imputation quality score
          after the range handling has run.
        When it applies: chromosome step 11, after info.out_of_range has been applied - so a score
          that info.out_of_range blanked out with 'null' is counted as missing here as well.
        Values:
          keep - the variant stays with an empty score; the log records the count and says the
            removal happens later at filter.info_missing, which is 'remove' by default.
          reject - the variant is removed now and written to the rejected-variants file with the
            reason 'info_missing'.
          fail - the chromosome stops with an error giving the number of variants affected.
        Example: a study with no INFO column, matched against a reference that covers 96% of its
          variants, leaves 4% with an empty score. Under 'keep' all of them go through to the VCF
          and are dropped later by filter.info_missing; under 'reject' they leave here and appear
          by name in the rejected-variants file, so you can see which ones went.
        Note: imputation quality is deliberately left out of the final completeness gate at step
          14, so 'keep' really does carry an empty score through the rest of harmonisation - it
          is not caught anywhere before the post-merge filter.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - keep
        - reject
        - fail
    source:
      default: auto
      help: |-
        What it does: Chooses where each variant's imputation quality score comes from.
        When it applies: chromosome step 11, at the very start, before any score is read.
        Values:
          auto - use the study's own imputation quality column when it has one, otherwise use the
            external file, otherwise use an explicitly supplied --fixed-info value.
          study - insist on the study's own column; the chromosome stops with an error if the
            study has none.
          reference - ignore any study column and take every score from the reference file.
          external - accepted, but behaves exactly like 'reference'; the code does not tell the
            two apart.
        Example: a study whose imp_info_col is 'INFO' runs under 'auto' without opening a
          reference at all. The same study under 'reference' matches against
          <info_file>_chr7.tsv.gz - falling back to the single whole-genome file, then to the
          pipeline's own default - on CHROM, POS, ALT and REF, then retries the variants that did
          not match with REF and ALT the other way round, and keeps the first score found.
        Note: under 'reference' or 'external', if the study frame already has a column with the
          same name as the reference's score column, that column is overwritten. The step warns
          when this happens, but the study's own values are gone. The normal CLI resolves the
          sample-sheet precedence before chromosome work, and that explicit dataset-level result
          has final priority; this policy remains available to direct engine callers that have not
          supplied a resolved info_source.
      origin: imputation_quality.py
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - auto
        - study
        - reference
        - external

  # =================================================================
  # 14  chromosome 13   final completeness gate
  # =================================================================
  final_check:
    require:
      default:
      - chr
      - pos
      - eaf
      - beta
      - se
      - zscore
      - pval
      help: |-
        What it does: Lists the fields that must hold a usable value in every exported variant.
        When it applies: chromosome step 13, the last gate before the file is written. Each field is
          resolved to a real column name through the configuration. If a required column is absent
          entirely, the chromosome fails immediately because every variant lacks that field;
          final_check.on_missing applies only when the column exists.
        Values: Field names from the pipeline's vocabulary - the coordinates (chr, pos), the variant
          identifier and alleles (snp, ea, oa), and the statistics (eaf, beta, se, zscore, pval, info,
          n). Order matters: the fields are checked one at a time in the order given, and a variant
          missing three of them is rejected under the first, which is what keeps every variant
          appearing exactly once in the reject file. Every selectable field has its own registered
          rejection reason, including snp, ea, oa, info and n.
        Example: with the shipped list, a variant that has neither an EAF nor an SE is rejected under
          'final_missing_eaf' only, because eaf comes before se; swap the two entries and the same
          variant is rejected under 'final_missing_se' instead.
        Note: imputation quality is left out on purpose - it is governed by info.on_missing at
          chromosome step 11 and by the filter stage later, not by this gate.
      origin: new
      recommendation: null
      type: list
      validator:
        allow_empty: true
        item:
          allow_none: false
          kind: enum
          members:
          - chr
          - pos
          - snp
          - ea
          - oa
          - eaf
          - beta
          - se
          - zscore
          - pval
          - info
          - n
        kind: list
        unique: true
        upper: false
    treat_as_missing:
      default:
      - 'null'
      - nan
      - inf
      help: |-
        What it does: Lists what counts as a missing value at the final gate, beyond an empty cell.
        When it applies: chromosome step 13, applied to every field named in final_check.require.
        Values:
          null - an empty cell.
          nan - a not-a-number float, and the text spellings nan, -nan and +nan.
          inf - an infinite float, and the text spellings inf, -inf, +inf, infinity, -infinity and
            +infinity.
          The order of this list does not matter. The order of final_check.require DOES: fields are
          tested one at a time in that order, so a variant missing several is attributed to the first.
        Example: a variant whose SE came out infinite from a degenerate frequency is removed as
          final_missing_se, exactly as one with an empty SE cell would be.
        Note: text spellings are only matched for numeric fields; 'inf' is a plausible allele.
      origin: new
      recommendation: null
      type: list
      validator:
        allow_empty: false
        item:
          allow_none: false
          kind: enum
          members:
          - 'null'
          - nan
          - inf
        kind: list
        unique: true
        upper: false
    on_missing:
      default: reject
      help: |-
        What it does: Decides what happens to a variant that is missing one of the required fields at
          export time.
        When it applies: chromosome step 13, for missing values inside each existing column listed in
          final_check.require. An entirely absent required column always fails immediately because it
          is a dataset-level schema error rather than an isolated missing value.
        Values:
          reject - the variant is removed and recorded under the reason for that field, for example
            'final_missing_se' or 'final_missing_pval'.
          keep - the missing values are counted and reported, and the variant is exported anyway.
          fail - the chromosome stops at the end of the step with a tally of how many variants were
            missing each field.
        Example: with the shipped list of required fields, a variant that reaches step 13 with an empty
          EAF is written to the reject file under 'final_missing_eaf' and never reaches the VCF; under
          'keep' it is exported with an empty EAF.
        Note: 'keep' lets a variant into the exported file with an empty or infinite value in a field
          that every downstream tool expects, and step 13 is the last gate, so nothing after it will
          catch that.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - reject
        - keep
        - fail

  # =================================================================
  # 15  chromosome 16-17 and the merge   VCF conversion and liftover
  # =================================================================
  vcf:
    liftover_swap:
      default: exclude
      help: |-
        What it does: Decides what happens to a variant that lifted over to the other genome build
          correctly but came back with its reference and alternate alleles the other way round.
        When it applies: chromosome step 17 (annotate and lift over), inside the liftover stage.
          The bcftools liftover plugin marks these variants with a SWAP tag, and this setting
          decides how that tag is handled.
        Values:
          exclude - an extra filtering stage drops every variant the plugin marked as swapped,
            even though it lifted over successfully.
          update_tags - the plugin is asked to rewrite the swapped variant's allele frequency and
            effect size (--af-tags AF --es-tags ES), so the variant is kept and its numbers now
            describe the new alternate allele.
          keep - the variant is kept exactly as the plugin emitted it, with no tag rewriting, so
            its frequency and effect size still describe the old allele order.
        Example: a variant that was A/G on GRCh37 but whose GRCh38 reference base is G comes back
          as G/A. Under 'exclude' it vanishes from the GRCh38 VCF. Under 'update_tags' it stays,
          with an AF of 0.3 rewritten to describe the other allele and the effect changing
          direction. Under 'keep' it stays with AF still 0.3, which is now the wrong allele.
        Note: Recommended: update_tags. 'exclude' is the historical behaviour and throws away
          perfectly good variants; 'keep' silently produces wrong frequencies and effect
          directions. Variants dropped by 'exclude' are not counted as liftover failures - they
          show up only as a fall between the CSQ and LIFTED counts in the chromosome log.
      origin: vcf_processing.py:275
      recommendation: update_tags
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - exclude
        - update_tags
        - keep
    liftover_update_tag_args:
      default: --af-tags AF --es-tags ES
      help: |-
        What it does: Supplies bcftools liftover arguments used when vcf.liftover_swap is update_tags.
        When it applies: chromosome step 17 only.
        Change this only when the VCF allele-frequency or effect-size tag names differ.
      origin: vcf_processing.py historical liftover command
      recommendation: null
      type: str
      validator:
        allow_empty: false
        allow_none: false
        kind: text
        upper: false
    liftover_warn_fraction:
      default: 0.1
      help: |-
        What it does: Sets the share of failed liftovers above which the step logs a notice.
        When it applies: chromosome step 17 (annotate and lift over), after the liftover, and only
          when bcftools could count both the variants entering the liftover and the ones in the
          not-lifted file. It is consulted only if the rate is not already above
          vcf.liftover_critical_fraction, which produces its own louder message instead.
        Values: A larger share means the notice appears only after heavier loss; a smaller one
          makes it appear sooner. Expressed as a share of the variants entering the liftover, so
          0.1 is 10%. Set it to 0 to be told whenever a single variant fails.
        Example: 1,000,000 variants enter the liftover and 120,000 land in the not-lifted file.
          That is 12% - above 0.10 but below 0.30 - so the log gets "Notice: >10% variants failed
          liftover" and the run continues.
        Note: this notice and the critical warning are mutually exclusive; a rate above
          vcf.liftover_critical_fraction produces only the louder message. Setting this above 0.3
          therefore means you never see a notice at all.
      origin: vcf_processing.py:310
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    liftover_critical_fraction:
      default: 0.3
      help: |-
        What it does: Sets the share of failed liftovers at which the log message changes from a
          mild notice to a loud warning.
        When it applies: chromosome step 17 (annotate and lift over), after the liftover, and only
          when bcftools could count both the variants entering the liftover and the ones in the
          not-lifted file. If either count is unreadable, the whole failure-rate check is skipped
          and the step says so.
        Values: A larger share means the loud wording appears only after heavier loss; a smaller
          one raises it sooner. Expressed as a share of the variants entering the liftover, so 0.3
          is 30%. Setting it at or below vcf.liftover_warn_fraction makes the milder notice
          unreachable.
        Example: 1,000,000 variants enter the liftover on chromosome 2 and 350,000 land in the
          not-lifted file. That is 35%, above 0.30, so the log gets "WARNING: >30% variants failed
          liftover". At 150,000 (15%) you would get the milder ">10%" notice instead.
        Note: 'critical' only changes the wording - both messages are recorded at the same warning
          level and neither stops anything. Use vcf.liftover_fail_fraction if you want a share of
          failures to actually halt the chromosome.
      origin: vcf_processing.py:308
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    liftover_fail_fraction:
      default: 0.5
      help: |-
        What it does: Sets the share of failed liftovers above which the chromosome is abandoned
          instead of carrying on with whatever survived.
        When it applies: chromosome step 17 (annotate and lift over), just after the two warning
          thresholds, and only when bcftools could count both the variants entering the liftover
          and the ones in the not-lifted file.
        Values: A smaller share stops the chromosome sooner; a larger one tolerates more loss.
          Expressed as a share of the variants entering the liftover. The default 0.50 permits
          up to and including 50% reported failure; a larger fraction stops the chromosome.
        Example: with 0.50, a chromosome where 600,000 of 1,000,000 variants fail to lift over
          (60%) stops with a liftover-failure error and produces no lifted VCF for that
          chromosome; at 400,000 (40%) it carries on and only logs the critical warning.
        Note: A required target-build VCF with zero surviving variants always fails independently
          of this threshold. Variants discarded by vcf.liftover_swap = 'exclude' are not counted
          in the reported failure fraction, so the separate zero-survivor safeguard is required.
      origin: vcf_processing.py:annotate_and_liftover_vcf
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    variant_drop_warn_fraction:
      default: 0.2
      help: |-
        What it does: Sets how large a fall in variant count between two consecutive bcftools
          stages is worth a warning.
        When it applies: chromosome step 17 (annotate and lift over), after each stage of the
          bcftools pipeline - normalisation, ID annotation, reference-frequency annotation,
          consequence annotation and the liftover itself. A stage whose variant count could not be
          read is skipped, with a note saying the check did not run.
        Values: A larger share means only heavier losses are flagged; a smaller one flags more.
          Expressed as a share of the previous stage's count, so 0.2 is 20%. Set it to 0 to be
          warned about any fall at all.
        Example: 1,000,000 variants before normalisation and 700,000 after is a 30% fall, above
          0.2, so the chromosome log gets "WARNING: >20% variant drop at NORM" and the NORM entry
          in the QC record is marked as a warning. A fall to 850,000 (15%) is recorded but not
          flagged.
        Note: each stage is compared only with the one immediately before it, never with the
          starting count, so five consecutive 15% falls - which leave you with 44% of the variants
          you started with - never trigger a single warning. The cumulative loss is printed in the
          log as "Δorig", but nothing checks it.
      origin: vcf_processing.py:104
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    min_valid_size_bytes:
      default: 100
      help: |-
        What it does: Sets the file size below which a per-chromosome VCF is treated as empty and
          left out of the merge.
        When it applies: post-merge step 01 (concatenate the per-chromosome VCFs), as each
          candidate file is checked. The size test runs before the missing-index test, so a
          too-small file is never even indexed.
        Values: A larger threshold excludes more suspiciously small files from the merge; 0 lets
          every existing file through on size and leaves only the missing-file and
          cannot-be-indexed checks. Measured in bytes on the compressed .vcf.gz.
        Example: a 48-byte chromosome 21 VCF left behind by a crashed run is marked as an invalid
          required input. With the default vcf.on_merge_failure: fail, that output group is not
          merged and the dataset stops before QC.
        Note: 100 bytes is small enough that a truncated file from an earlier attempt is usually
          larger than it and reaches the merge anyway, which is why the outputs are cleaned before
          a retry rather than being relied on to be caught here.
      origin: vcf_processing.py:374
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 0
        number_kind: int
    sort_memory_mb_per_thread:
      default: 512
      help: |-
        What it does: Sets how much memory the sort at the end of the liftover may use, per thread.
        When it applies: chromosome step 17 (annotate and lift over), on the final bcftools sort of
          the lifted VCF. It is multiplied by execution.threads_per_chromosome (5 by default) and
          handed to bcftools sort as -m; whatever does not fit spills into a temp_chr<N> directory
          beside the outputs, which is removed whether the step succeeds or fails.
        Values: A larger allowance keeps more of the chromosome in memory and writes fewer spill
          files, so the sort is faster but needs more RAM; a smaller one spills more to disk. In
          megabytes per thread, floor 1.
        Example: with the default 5 threads per chromosome, 512 produces "bcftools sort -m 2560M"
          for each chromosome. If 4 chromosomes are being processed at once, that is roughly 10 GB
          of RAM in total, not 512 MB.
        Note: the figure is per thread AND per chromosome, so the real ceiling is this value times
          the threads per chromosome times the number of chromosomes running in parallel. Work out
          that product before raising it on a shared machine.
      origin: vcf_processing.py:279
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 1
        number_kind: int
    concat_max_workers:
      default: 3
      help: |-
        What it does: Sets how many of the per-chromosome VCF concatenations run at the same time.
        When it applies: post-merge step 01 (concatenate the per-chromosome VCFs), once per dataset.
          At most four concatenations exist: the GRCh37 build, the GRCh38 build, the raw gwas2vcf
          output, and the variants that failed liftover.
        Values: A larger number runs more concatenations at once and gives each fewer bcftools
          threads, because the per-job thread count is the run's CPU allowance divided by this value
          (itself capped at that CPU count); smaller runs them in sequence with all threads. Floor 1.
        Example: with 12 threads and 3, three bcftools concat processes run together with 4 threads
          each. At 1 they run one at a time with 12 threads; at 6 still only four run at once (there
          are only four jobs) but each is invoked with --threads 2, because 12 // 6 = 2.
        Note: this used to be fixed at 3 however many CPUs the run was given. It is now capped by that
          request, so a 2-core run gets 2 workers with 1 thread each.
      origin: vcf_processing.py:334
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 1
        number_kind: int
    concat_max_attempts:
      default: 2
      help: |-
        What it does: Sets the maximum number of attempts for each bcftools concat operation and
          its merged-output validation.
        When it applies: post-merge step 01, after at least one valid chromosome VCF is available
          for an output group. Each retry removes the failed merged VCF and index before starting.
        Values: Total attempts including the first. 1 disables retry; 2 makes one retry. Missing or
          invalid per-chromosome inputs are not retried here because repeating concat cannot
          regenerate them.
        Example: if GRCh38 concat writes no index on attempt 1, its partial output is removed and
          attempt 2 reruns concat. If attempt 2 validates, the group is complete; otherwise
          vcf.on_merge_failure decides whether the run fails or continues as PARTIAL.
        Note: this retries only the repairable concat and merged-file validation operation. A
          missing chromosome VCF must be regenerated by rerunning that chromosome.
      origin: vcf_processing.py:concat_vcfs_by_build
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: 10
        minimum: 1
        number_kind: int
    on_merge_failure:
      default: fail
      help: |-
        What it does: Decides whether an incomplete or invalid required genome-wide VCF output stops
          the run or is recorded as a partial result.
        When it applies: post-merge step 01. The required input-build, target-build and raw gwas2vcf
          groups are checked against every chromosome that completed harmonisation before merging.
          Missing or invalid chromosome inputs, concat failures, missing or undersized merged files,
          missing indexes, and merged VCFs whose indexed record count cannot be read are failures.
        Values:
          continue - the failure is logged as a warning, the per-chromosome files belonging to
            that concatenation are kept so it can be retried, and the run goes on to the
            post-merge QC steps with whichever merged VCFs did succeed. Any incomplete required
            output makes the dataset and manifest status PARTIAL, never OK.
          fail - the same message is logged at error level and the run stops with a merge error
            naming which outputs failed.
        Example: the GRCh38 concatenation remains incomplete after its configured attempts while
          GRCh37 succeeds. Under 'continue' you get a warning, the per-chromosome GRCh38 CSQ files
          stay on disk, the run finishes as PARTIAL, and the manifest records GRCh38 under
          required_merge_failures.
          Under 'fail' the run stops there, with the same files kept.
        Note: fail is the scientific default. Either way, the per-chromosome intermediates (_ORIGINAL, _NORM,
          _ID and _EAF) are deleted before this decision is taken, so a retry restarts from the
          CSQ files, not from the original conversion.
      origin: vcf_processing.py:concat_vcfs_by_build
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - continue
        - fail

  # =================================================================
  # 16  post-merge 03   sequential QC assessment (no filtered VCF is written)
  # =================================================================
  filter:
    af_diff_cutoff:
      default: 0.2
      help: |-
        What it does: Sets the largest accepted absolute difference between the study allele
          frequency (INFO/AF) and the configured reference-panel frequency (INFO/<panel>).
        When it applies: post-merge step 03, to the temporary analysis table extracted once from the
          raw merged VCF. It changes QC assessment counts only; the VCF is never filtered or changed.
        Values:
          An absolute difference in allele-frequency units. Larger is more forgiving, smaller
          stricter; 0 keeps only exact agreement, 1 removes nothing on these grounds.
        Example: the panel column is whichever default_comparison_af_column names, e.g. EUR. At 0.2,
          study 0.35 against EUR 0.60 differs by 0.25 and fails this QC level; 0.35 against 0.50 passes.
        Note: a variant the panel has no frequency for is decided by filter.af_missing (default
          'remove'), not here. The filter reads INFO/AF and the QC count FORMAT/AF; same number.
      origin: main.py:967
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    af_missing:
      default: remove
      help: |-
        What it does: Decides whether a variant with a missing required frequency passes or fails QC.
        When it applies: post-merge step 03, governing both the minor-allele
          window (filter.maf_cutoff), which needs the study's own frequency, and the panel-concordance
          test (filter.af_diff_cutoff), which needs both; only while one of the two is active.
        Values:
          remove - a variant with no study frequency, or one absent from the panel, fails the virtual
            QC level; counted separately as 'missing FORMAT/AF (MAF filter)' and 'missing
            INFO/<panel> (external AF concordance filter)'.
          keep - a missing frequency does not fail the applicable QC level.
        Example: a variant the study reports but EUR lacks has no INFO/EUR - under remove it goes and is
          counted on the 'missing INFO/EUR' line; under keep it is still judged by filter.maf_cutoff.
        Note: the setting never removes a VCF record; it changes membership of the reported virtual
          QC-passed subset.
      origin: implicit
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - remove
        - keep
    maf_cutoff:
      default: 0.01
      help: |-
        What it does: Sets the accepted minor-allele-frequency range for the QC assessment.
        When it applies: post-merge step 03 as a two-sided window on the study's own frequency
          FORMAT/AF: a variant passes when between the cutoff and one minus the cutoff.
        Values:
          A frequency between 0 and 0.5. Larger drops more low-frequency variants, smaller keeps them.
          0.01 keeps 0.01 to 0.99; 0.05 keeps 0.05 to 0.95.
        Example: at 0.01 a variant at AF 0.004 is removed and one at 0.02 is kept; one at 0.997 is
          fails too, because that is the same 0.3% minor allele seen from the other side.
        Note: the test cannot be switched off from policy - the value may not be null - so even 0
          leaves it in place, and under filter.af_missing = 'remove' that still fails every variant
          with no frequency at all. Set filter.af_missing to 'keep' if that is not what you want.
      origin: main.py:966
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 0.5
        minimum: 0.0
        number_kind: float
    info_cutoff:
      default: 0.7
      help: |-
        What it does: Sets the lowest imputation quality score accepted by the QC assessment.
        When it applies: post-merge step 03, read from FORMAT/SI - the score the study supplied or
          that was filled in from the reference file. It is the lower end of a window whose upper end
          is filter.info_max.
        Values:
          A score on the usual 0-1 imputation-quality scale. Larger is stricter and leaves fewer,
          better-imputed variants; smaller keeps more poorly imputed ones. 0 removes nothing at the
          bottom, but filter.info_max still rejects impossibly large scores.
        Example: at 0.7 with info_max 1.05, SI 0.68 fails, 0.71 passes and 1.10 fails.
        Note: filter.info_cutoff must not be greater than filter.info_max; an invalid interval stops
          with an actionable configuration error.
      origin: main.py:968
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    info_max:
      default: 1.05
      help: |-
        What it does: Sets the highest imputation quality score accepted by the QC assessment.
        When it applies: post-merge step 03 together with filter.info_cutoff; the two form one window
          on FORMAT/SI in the temporary analysis table.
        Values:
          A score on the same 0-1 scale; anything above 1 is already out of range. Larger tolerates
          more overshoot, smaller is stricter. 1.05 covers usual rounding overshoot; validator max 100.
        Example: at 1.05, SI 1.02 is kept as a rounding artefact while SI 2.4 or 37.4 - the signature
          of a column that is not really an imputation score - fails.
      origin: main.py:969
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 100.0
        minimum: 0.0
        number_kind: float
    info_missing:
      default: remove
      help: |-
        What it does: Decides whether a missing imputation quality score passes or fails QC.
        When it applies: post-merge step 03 at the imputation-quality level.
        Values:
          remove - the test becomes 'SI inside the window AND SI is not missing'; the failure is counted
            as 'missing FORMAT/SI (imputation quality filter)'.
          keep - the test gains 'OR SI is missing', so a scoreless variant passes it.
        Example: a study with no INFO column, harmonised against a reference covering 8,900,000 of
          its 9,500,000 variants, loses the other 600,000 under remove.
        Note: this controls only virtual QC membership. The raw merged VCF remains unchanged.
      origin: main.py:970
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - remove
        - keep
    include_indels:
      default: false
      help: |-
        What it does: Decides whether indels and other non-SNP variants can enter the virtual
          QC-passed subset.
        When it applies: post-merge step 03 on the extracted analysis table.
        Values:
          true - every variant type is carried through and judged on frequency and quality like SNPs.
          false - only A/C/G/T single-nucleotide substitutions pass this level.
        Example: of 9,400,000 SNPs and 600,000 indels in the merged VCF, false leaves about 9,400,000
          rows for the remaining filters; true sends the indels through FORMAT/AF and FORMAT/SI too.
        Note: variant type is assessed from REF and ALT. No VCF is written at this level.
      origin: main.py:972
      recommendation: null
      type: bool
      validator:
        kind: flag
    lp_cutoff:
      default: null
      help: |-
        What it does: Optionally adds a significance level using -log10(p).
        When it applies: post-merge step 03, compared against FORMAT/LP in the extracted table.
        Values:
          null switches the filter off and every variant passes regardless of p-value, which is what a
          harmonisation run normally wants. Larger keeps only stronger associations: 7.30103 is
          genome-wide significance (p <= 5e-8), 5 is p <= 1e-5, 2 is p <= 0.01.
        Example: at 7.30103 a variant with LP 9.1 (p = 8e-10) is kept and one with LP 3.0 (p = 0.001)
          fails this QC level.
        Note: this is NOT a raw p-value - 5e-8 here means LP >= 0.00000005, i.e. p <= 0.9999999, which
          excludes almost nothing. Use 7.30103 for p <= 5e-8. Missing values are controlled separately
          by filter.lp_missing.
      origin: main.py:965
      recommendation: null
      type: float
      validator:
        allow_none: true
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: null
        minimum: 0.0
        number_kind: float
    lp_missing:
      default: remove
      help: |-
        What it does: Decides whether a missing FORMAT/LP value fails the optional significance level.
        When it applies: only when filter.lp_cutoff is not null. It affects the virtual QC-passed
          count and does not alter or create a VCF.
        Values:
          remove - missing LP fails the significance level.
          keep - missing LP passes this level; non-missing LP must still meet filter.lp_cutoff.
      origin: implicit
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - remove
        - keep
    exclude_palindromic:
      default: true
      help: |-
        What it does: Flags strand-ambiguous variants (A/T and C/G) whose allele frequency sits
          near one half, where the strand cannot be resolved from the frequency.
        When it applies: post-merge step 03 after earlier QC levels. The band edges are
          filter.palindromic_af_lower and filter.palindromic_af_upper.
        Values:
          true - a variant fails when REF/ALT is exactly A/T, T/A, C/G or G/C and its FORMAT/AF
            lies inside the band.
          false - no variant fails for being palindromic, whatever its frequency.
        Example: with the default band 0.4-0.6, an A/T variant at AF 0.47 is removed and one at 0.12
          is kept; an A/G variant is never touched by this rule.
        Note: a palindromic variant with no FORMAT/AF cannot satisfy this rule, so filter.af_missing
          decides it at the earlier allele-frequency level.
      origin: main.py:974
      recommendation: null
      type: bool
      validator:
        kind: flag
    palindromic_af_lower:
      default: 0.4
      help: |-
        What it does: Sets the lower edge of the frequency band inside which a palindromic variant is
          treated as strand-ambiguous.
        When it applies: post-merge step 03, and only when
          filter.exclude_palindromic is true. It pairs with filter.palindromic_af_upper to form one
          band on the study frequency FORMAT/AF.
        Values:
          A study allele frequency, at most 0.5. Smaller widens the band downwards and removes more
          A/T and C/G variants; larger narrows it and keeps more. At 0.5 with the upper edge also at
          0.5, only variants at exactly 0.5 fail.
        Example: with the band 0.4-0.6, an A/T variant at frequency 0.38 is kept and one at 0.41 is
          removed. Move this edge down to 0.3 and the 0.38 variant is removed as well.
      origin: main.py:975
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 0.5
        minimum: 0.0
        number_kind: float
    palindromic_af_upper:
      default: 0.6
      help: |-
        What it does: Sets the upper edge of the frequency band inside which a palindromic variant is
          treated as strand-ambiguous.
        When it applies: post-merge step 03, and only when
          filter.exclude_palindromic is true. It pairs with filter.palindromic_af_lower to form one
          band on the study frequency FORMAT/AF.
        Values:
          A study allele frequency, at least 0.5. Larger widens the band upwards and removes more A/T
          and C/G variants; smaller narrows it and keeps more.
        Example: with the band 0.4-0.6, a C/G variant at frequency 0.62 is kept and one at 0.59 is
          removed. Move this edge up to 0.7 and the 0.62 variant is removed as well.
      origin: main.py:976
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.5
        number_kind: float
    remove_mhc:
      default: true
      help: |-
        What it does: Excludes the major histocompatibility complex from the virtual QC-passed subset
          because its long-range linkage disequilibrium can distort many downstream assessments.
        When it applies: post-merge step 03 after preceding levels. The region comes from
          filter.mhc_chrom, filter.mhc_start and filter.mhc_end.
        Values:
          true - variants inside the inclusive region fail this QC level.
          false - the MHC level is not applied.
        Example: with the defaults, chr6:31,300,000 fails this level. The raw VCF record is retained.
      origin: main.py:977
      recommendation: null
      type: bool
      validator:
        kind: flag
    mhc_chrom:
      default: '6'
      help: |-
        What it does: Names the chromosome carrying the major histocompatibility complex, so the MHC
          assessment knows which contig to evaluate.
        When it applies: post-merge step 03, and only when filter.remove_mhc
          is true.
        Values:
          '6' or 'chr6'. Comparison is case-insensitive and accepts either presence or absence of the
          'chr' prefix in the raw VCF.
      origin: main.py:977
      recommendation: null
      type: str
      validator:
        allow_none: false
        kind: text
    mhc_end:
      default: 34000000
      help: |-
        What it does: Sets the last base position of the MHC assessment interval.
        When it applies: post-merge step 03, and only when filter.remove_mhc is true.
        Values:
          A base position on the chromosome named by filter.mhc_chrom. Larger extends the excised
          window and excludes more variants; smaller stops the assessment interval earlier. The
          position named is included.
        Example: at 34,000,000 with mhc_start 25,000,000, chr6:33,999,900 fails and
          chr6:34,000,001 passes.
        Note: 25,000,000-34,000,000 is the generous GRCh37 extended-MHC window, not adjusted for
          genome build, while qc.target_build decides which raw VCF is assessed.
      origin: main.py:979
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 0
        number_kind: int
    mhc_start:
      default: 25000000
      help: |-
        What it does: Sets the first base position of the MHC region that gets cut out.
        When it applies: post-merge step 03, and only when filter.remove_mhc is true. The value is a
          1-based inclusive position in the raw VCF coordinate system.
        Values:
          A base position on the chromosome named by filter.mhc_chrom. Smaller starts the cut earlier
          and excludes more variants; larger starts it later and excludes fewer.
        Example: at 25,000,000, chr6:25,000,000 fails and chr6:24,999,999 passes.
      origin: main.py:978
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 0
        number_kind: int
  # =================================================================
  # 17  post-merge 03   raw and virtual QC-passed summaries
  # =================================================================
  qc:
    target_build:
      default: GRCh37
      help: |-
        What it does: Chooses which genome build's raw merged VCF is assessed.
        When it applies: post-merge step 03. The VCF is extracted once to a temporary table used for
          the raw summary, sequential QC levels and final virtual QC-passed summary. No filtered VCF
          is created. The resolved build is recorded in the manifest and report names.
        Values:
          GRCh37 - always assess <sample>_GRCh37_merged.vcf.gz, whether supplied or lifted over.
          GRCh38 - always assess <sample>_GRCh38_merged.vcf.gz, on the same terms.
          input - assess whichever build the study supplied, as decided by the build-detection step.
        Example: for a GRCh38 study lifted over to GRCh37, 'GRCh37' makes the counts and the Ts/Tv ratio
          describe the lifted file, hiding liftover losses; 'input' the file the study handed you.
        Note: recommended input, the build the study actually supplied. The build you name must have a
          merged VCF; if liftover produced none, QC stops with an explicit error rather than falling back.
      origin: main.py:892,901
      recommendation: input
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - GRCh37
        - GRCh38
        - input
    sample_size_outlier_standard_deviations:
      default: 5.0
      help: |-
        What it does: Reports variants whose effective sample size is strictly greater than the stage mean
          plus this many sample standard deviations. It is descriptive QC only and does not remove
          a variant or change the raw merged VCF.
        When it applies: post-merge step 03, independently for the raw merged-VCF records and for the
          final virtual QC-passed subset. Each stage uses its own usable FORMAT/NEF values, mean and
          sample standard deviation; missing, non-numeric, non-finite and non-positive values are
          reported but excluded from the distribution calculation.
        Values: A positive number of standard deviations. Larger flags only more extreme upper-tail
          sample sizes; smaller flags more records. The packaged value 5 matches MungeSumstats N_std.
        Example: with mean Neff 100,000 and sample SD 2,000, the default threshold is 110,000 and a
          value of 112,000 is reported as an outlier. It remains in the VCF because this is not a
          filtering policy.
        Note: A variant-level Neff can legitimately vary after cohort or imputation missingness. This
          check highlights an unusually large upper tail that may indicate a mixed analysis or an
          incorrectly mapped sample-size field; it does not prove that a value is scientifically wrong.
      origin: qc_summary/assessment.py
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: true
        integer: false
        kind: num
        maximum: null
        minimum: 0.0
        number_kind: float
  # =================================================================
  # 18  throughout      threads, retries, memory
  # =================================================================
  execution:
    threads_per_chromosome:
      default: 5
      help: |-
        What it does: How many threads one chromosome worker gives to the bcftools commands it runs.
        When it applies: chromosome step 17 of 17, "Annotate and lift over", inside every worker; the
          same number is multiplied by vcf.sort_memory_mb_per_thread (512 MB) to size that step's
          bcftools sort.
        Values: Threads per worker, floor 1. Larger makes one chromosome's liftover and annotation
          faster but multiplies both the cores and the sort memory in use; smaller leaves cores for the
          other chromosomes. It is NOT reduced by --threads: --threads only sets how many chromosomes
          run at once, so cores in use are roughly workers x this number.
        Example: --threads 8 over 22 chromosomes with this at 5 gives 8 chromosomes at a time, 5
          threads each - about 40 busy cores - and each bcftools sort gets 5 x 512 = 2,560 MB.
        Note: 5 was hardcoded before this setting existed, so the default reproduces the old
          five-times-what-you-asked-for behaviour. To cap it, set execution.total_cpu_budget, which
          shrinks this number until workers x threads fits the budget. The post-merge filter and QC
          steps are handed --threads directly and ignore this setting entirely.
      origin: main.py:625
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 1
        number_kind: int
    total_cpu_budget:
      default: null
      help: |-
        What it does: Caps the total number of cores the chromosome fan-out may occupy at one time.
        When it applies: Once per dataset, after dataset step 08 splits the file by chromosome and
          before round 1 starts. Left unset (the shipped default) nothing is capped.
        Values: Cores. The worker count is capped at the budget first, then the threads per chromosome
          become the budget divided by the workers, never below 1 - the requested worker count is kept
          for as long as possible, because a worker that cannot start does no work at all. Unset means
          workers x execution.threads_per_chromosome runs uncapped.
        Example: --threads 8, 22 chromosomes, execution.threads_per_chromosome 5. Unset, that is 8
          workers x 5 threads = 40 cores. Set to 16, it becomes 8 workers x 2 threads = 16, and the
          dataset log gains a DECIDE line headed "How much CPU to use".
        Note: unset is the wrong choice on a shared machine or inside a scheduler allocation, where the
          run will quietly use about five times the cores you asked for. Set it to the number of cores
          the job was actually granted.
      origin: new
      recommendation: null
      type: int
      validator:
        allow_none: true
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 1
        number_kind: int
    max_retry_rounds:
      default: 2
      help: |-
        What it does: How many extra passes over the still-failed chromosomes may follow the first
          pass.
        When it applies: in the chromosome retry loop, checked at the end of every round that left
          at least one chromosome failed. Never consulted when round 1 succeeds outright.
        Values:
          Extra rounds. 0 means a failed chromosome is never retried; each unit adds one more round,
          so a chromosome is attempted at most this number plus one times. Ceiling 100.
        Example: at the default 2, chromosomes 6 and 9 fail in round 1; round 2 recovers 9 but not 6,
          so round 3 runs chromosome 6 alone, it fails again, and the loop stops and names it.
        Note: a run can stop before this limit. With the shipped execution.retry_requires_progress =
          true, a round that recovers NOTHING ends the loop - had round 2 above recovered neither 6
          nor 9, round 3 would never have run.
      origin: new
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: 100
        minimum: 0
        number_kind: int
    clean_before_retry:
      default: true
      help: |-
        What it does: Deletes a chromosome's partial output files before that chromosome is tried again.
        When it applies: At the start of every retry round (round 2 onward), for each chromosome about to
          be run again. Never in round 1.
        Values:
          true - that chromosome's partial VCFs and indexes, adapter input/mapping/summary files,
            rejected-variants file and bcftools sort temp directory are removed first, and the count
            removed is announced. The validated chromosome input table and immutable source snapshot
            are retained because the retry reads them again.
          false - they are left on disk and a WARNING says the old partial files may reach the merge.
        Example: chromosome 7 dies in round 1 having written a truncated GWAS_chr7_GRCh38_CSQ.vcf.gz of
          4 KB. With true that file is gone before round 2 starts. With false, and round 2 failing
          earlier at step 12, the 4 KB file survives and the merge accepts it, because a VCF is only
          treated as empty below vcf.min_valid_size_bytes, which is 100 bytes.
        Note: validated chromosome input tables, immutable source snapshots and logs are never deleted
          by retry cleanup. Logs are opened in append mode so every attempt is preserved.
      origin: new
      recommendation: null
      type: bool
      validator:
        kind: flag
    retry_requires_progress:
      default: true
      help: |-
        What it does: Stops the retry loop as soon as a whole retry round recovers no chromosome.
        When it applies: in the chromosome retry loop, at the end of every round from round 2 onward
          (round 1 is the first pass, so it is exempt), and after the execution.max_retry_rounds
          check. It can change the outcome only when max_retry_rounds is 2 or more.
        Values:
          true - the loop stops the moment a retry round ends having recovered nothing.
          false - rounds keep going until execution.max_retry_rounds is used up, repeating a failure
            that has already been shown not to clear.
        Example: with max_retry_rounds at 2, chromosomes 3 and 9 fail in round 1 and both fail again
          in round 2. With true the run stops at the end of round 2 and reports the two failures;
          with false round 3 reruns the same two against the same missing reference file.
      origin: new
      recommendation: null
      type: bool
      validator:
        kind: flag
    fail_dataset_on_chr_error:
      default: true
      help: |-
        What it does: Decides whether a dataset with an unfinished chromosome is failed outright or is
          merged from whatever did complete.
        When it applies: Once per dataset, after the retry rounds have finished, and only when at least
          one chromosome is still failed.
        Values:
          true - the dataset stops with an error; the merge, the variant filter and the QC summary never
            run for it.
          false - a WARNING is printed and the post-merge steps continue with the chromosomes that did
            complete; the run manifest records the status as PARTIAL, or FAILED if none completed.
        Example: 21 of 22 chromosomes complete and chromosome 6 does not. With true nothing is merged,
          and the command-line runner re-runs the whole dataset once before reporting it as failed. With
          false you get a merged genome-wide VCF containing no chromosome 6 at all, and a manifest that
          says PARTIAL.
        Note: false produces a file that is silently missing a whole chromosome. Use it only when you
          intend to work with an incomplete genome and will check the manifest status before analysis.
      origin: new
      recommendation: null
      type: bool
      validator:
        kind: flag
  # =================================================================
  # 19  throughout      logging and screen output
  # =================================================================
  logging:
    append_across_retries:
      default: true
      help: |-
        What it does: Keeps every attempt at a chromosome in one log file instead of starting the file
          over on a retry.
        When it applies: At the start of a chromosome worker whose attempt number is 2 or higher. Never
          on the first attempt, and never for the dataset log.
        Values:
          true - logs/{sample}_chr{N}.log is opened in append mode, so attempt 2 continues underneath
            attempt 1 and the failed attempt stays readable.
          false - the file is deleted at the start of the retry, leaving only the last attempt.
        Example: chromosome 7 fails at step 12 in round 1 and succeeds in round 2. With true,
          GWAS_chr7.log holds both attempts, each opening with "Chromosome 7 of GWAS, attempt N". With
          false, the traceback explaining the round 1 failure is gone.
        Note: the command-line runner also retries a whole failed dataset once, and that restarts the
          attempt counter at 1, so those attempts append to the existing log whatever this is set to.
      origin: new
      recommendation: null
      type: bool
      validator:
        kind: flag
    screen_order:
      default: completion
      help: |-
        What it does: Chooses whether a chromosome's block is printed the moment that chromosome
          finishes, or held back and printed in chromosome order when the round ends.
        When it applies: In the parent process, in every round of the chromosome fan-out, retry rounds
          included.
        Values:
          completion - each block is printed as its worker returns, so the quickest chromosome appears
            first and you can watch a long run make progress.
          sorted - blocks are collected and printed together once the round ends, ordered 1, 2, ... 22,
            X, Y, XY, MT.
        Example: with 22 chromosomes and completion, chromosome 21 usually prints before chromosome 1
          because it is much smaller. With sorted, nothing appears until the last worker of the round
          returns, and then all 22 blocks print in order.
        Note: sorted means a long round is completely silent while it runs. The held-back blocks are
          still printed if the round is torn down early, because they are flushed from a finally.
          Neither setting can interleave two chromosomes - only the parent's single-threaded loop
          prints.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - completion
        - sorted
    level:
      default: INFO
      help: |-
        What it does: Sets the lowest severity of record that is written to the log files on disk.
        When it applies: Whenever a logger is built - the dataset logger and every chromosome worker. It
          does not change what appears on screen; logging.screen_level does that.
        Values:
          DEBUG - everything, plus the one debug record the pipeline writes: a group-by-group dump of
            every resolved setting into the dataset log.
          INFO - step start and finish lines, "Settings in use" blocks, DECIDE lines, QC counts,
            warnings and failures. This is what the shipped default keeps.
          WARNING - only warnings and failures; every step, settings and QC line is dropped.
          ERROR - only failures: the FAILED lines, the "What went wrong / What to do" pair and the
            traceback beneath them.
        Example: at INFO, logs/GWAS_chr7.log carries "QC check - eaf out of range" with the variant
          count before and after, and the rows-read / rejected / exported reconciliation table. At
          WARNING neither is written, so the only surviving record of what was removed is the
          rejected-variants file.
        Note: when a worker is killed outright - an out-of-memory kill, say - it returns nothing and the
          parent prints the tail of this log file instead. Raising this above INFO leaves that tail
          nearly empty and makes such a death very hard to diagnose.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - DEBUG
        - INFO
        - WARNING
        - ERROR
    screen_level:
      default: WARNING
      help: |-
        What it does: Sets the lowest severity of record a chromosome worker keeps in the block the
          parent prints on screen.
        When it applies: Inside each chromosome worker. Workers never print; each buffers its own text
          and the parent prints one block when that chromosome finishes. Dataset-level announcements -
          the round headers, the "N at a time, M threads each" line, the closing counts - are written
          straight to standard output and are not filtered by this.
        Values:
          DEBUG - everything the worker recorded.
          INFO - step start and finish, settings blocks, DECIDE lines, QC counts, warnings, failures.
          WARNING - only warnings and failures, so the block shrinks to the important problems. This is
            the shipped default; complete INFO records remain in the log files.
          ERROR - only failures.
        Example: at WARNING, chromosome 7's block no longer shows "01/17 Load the chromosome file" or
          the per-step QC counts, but the framed header and the rows-read / rejected / exported footer
          with its reject-by-reason table still appear - the parent builds those from the summary the
          worker returns, not from the buffered text.
        Note: nothing forces this to sit at or above logging.level. Setting this to DEBUG while
          logging.level is ERROR shows lines on screen that the log file never receives, and the log
          file is the only permanent record of the run.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - DEBUG
        - INFO
        - WARNING
        - ERROR

  # =================================================================
  # 20  throughout      the rejected-variant file
  # =================================================================
  rejects:
    enabled:
      default: true
      help: |-
        What it does: Turns on the rejected-variants file, which records every removed variant with all
          of its original parsed study values and the reason it was removed. A stable source-row ID
          retrieves those values from an immutable pre-harmonisation snapshot rather than from the
          transformed working row.
        When it applies: Twice per dataset and then again at the end. dataset step 03 (reading the
          summary statistics) opens the input-level collector, chromosome step 01 opens one per
          chromosome, and after the retry rounds the parent combines them.
        Values:
          true - rejected/{sample}_input_rejected.tsv.gz and rejected/{sample}_chr{N}_rejected.tsv.gz
            are written (header-only when nothing was rejected, so an absent file means the step never
            ran), combined into {sample}_rejected_variants.tsv.gz, and summarised as a reason-by-
            chromosome table in qc_summary/{sample}_reject_reasons.tsv.
          false - a WARNING is logged, removals are still counted in the log, nothing is written, and
            the dataset reconciliation is reported as unavailable.
        Example: 12,043 variants dropped at chromosome step 03 appear as rows carrying reject_step
          "03", reject_reason "eaf_out_of_range" and every column the study supplied. With this off the
          log still says 12,043 were removed, but you cannot see which variants they were.
        Note: the reconciliation assertion - rows read minus rejected must equal rows exported, run
          after chromosome step 13 and failing the chromosome if it does not balance - exists only when
          a collector exists. Turning this off removes the one check that catches a variant vanishing
          from both the kept and the rejected side. Leave it on. When enabled, every rejection file is
          required provenance: a write failure, an unreadable file, or a missing file from an otherwise
          successful input or chromosome stage fails dataset finalisation rather than producing an
          incomplete successful result. Compressed chromosome source snapshots are internal
          intermediates and are removed only after successful finalisation.
      origin: new
      recommendation: null
      type: bool
      validator:
        kind: flag
    compress:
      default: true
      help: |-
        What it does: Whether the per-chromosome and input-level rejected-variants files are gzipped.
        When it applies: When each collector is created (dataset step 03 and chromosome step 01), and
          again at the end of the dataset when the parent looks those files up by name in order to
          combine them. Only consulted when rejects.enabled is true.
        Values:
          true - ".gz" is appended to the name unless it is already there, and the file is gzipped.
          false - a plain tab-separated file is written.
        Example: with true, chromosome 7's removals land in rejected/GWAS_chr7_rejected.tsv.gz; with
          false, in rejected/GWAS_chr7_rejected.tsv.
        Note: the combined dataset file, {sample}_rejected_variants.tsv.gz, is gzipped whatever this is
          set to - this controls only the per-chromosome and input-level parts. Each reject file holds
          one full input row per removed variant, so on a large study the uncompressed form runs to
          several gigabytes; keep it on unless you need to open the files with tools that cannot read
          gzip.
      origin: new
      recommendation: null
      type: bool
      validator:
        kind: flag
