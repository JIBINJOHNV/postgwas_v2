        - ALL_META_AF
        - ALLELE_FREQ
        - ALLELE_FREQUENCY
        - ALLELE_FRQ
        - EST_FRQ
        - F_U
        - FCON
        - FREQ
        - FREQUENCY
        - FRQ
        - HRC_FRQ_A1
        - INC_AF
      reference_frequency_column:
        - EAF_HRC
        - FREQ_EUROPEAN_1000GENOMES
        - FREQ_HAPMAP
      beta_effect_column:
        - ALL_INV_VAR_META_BETA
        - ALT_EFFSIZE
        - B
        - BETA
        - BETA_SLEEPDURATION
        - EFFECT_BETA
        - INV_VAR_META_BETA
        - LOG_ODDS
        - LOGOR
        - MTAG_BETA
        - STDBETA
        - EFFECTSIZE_BETA
      odds_ratio_effect_column:
        - OR
        - ODDS_RATIO
        - ODDS_RAT
        - ODDSRATIO
        - EFFECTSIZE_OR
      ambiguous_effect_column:
        - EFFECT
        - EFFECT_SIZE
        - EFFECT_WEIGHT
        - EFFECTS
        - ES
        - EST
      standard_error_column:
        - SE
        - ALL_INV_VAR_META_SEBETA
        - INV_VAR_META_SEBETA
        - MTAG_SE
        - SE_DGC
        - SE_SLEEPDURATION
        - SEBETA
        - STANDARD_ERROR
        - STANDARDERROR
        - STDERR
        - STDERR_BETA
        - STDERRLOGOR
      z_score_column:
