# ---------------------------------------------------------------------------
# What a dataset must supply, written in the CONFIG COLUMN NAMES you actually
# use in the config CSV - not in abstract terms.
#
# Each group lists `any_of`: a set of alternatives, and a dataset satisfies the
# group when EVERY key in ANY ONE alternative is set (i.e. not blank and not NA).
# Names beginning with '@' are not config columns; they are satisfied by the
# defaults YAML instead, and are explained in the group's `why`.
#
# Stage 1 checks that these keys are SET in the config.  Stage 2 then checks
# that the columns they name are actually PRESENT in the sumstat file header.
# ---------------------------------------------------------------------------
required_inputs:

  sumstat_file:
    label: the input summary statistics file
    required: true
    any_of:
      - [sumstat_file]

  gwas_outputname:
    label: the output name for this dataset
    required: true
    any_of:
      - [gwas_outputname]

  coordinates:
    label: chromosome and position
    required: true
    any_of:
      - [chr_col, pos_col]
      - [chr_pos_col]
    why: >
      Two separate columns, or one combined column that the pipeline splits at
      chromosome step 02.

  alleles:
    label: effect and other allele
    required: true
    any_of:
      - [ea_col, oa_col]
    why: >
      Both are needed to orient the effect and to match the reference panel.

  eaf:
    label: effect allele frequency
    required: true
    any_of:
      - [eaf_col]
      - [eaffile, eafcolumn]
    why: >
      The study's own column, or an external file together with the name of the
      column inside it. Giving eaffile without eafcolumn is not enough.

  effect:
    label: effect estimate
    required: true
    any_of:
      - [beta_or_col]
      - [imp_z_col]
    why: >
      beta_or_col may hold a beta OR an odds ratio - the pipeline works out which
      at dataset step 07 and takes the natural log of an odds ratio. A Z score in
      imp_z_col is equally acceptable. se_col is NOT required: the standard error
      is derived from the effect estimate and the p-value at chromosome step 09,
      or from the Z score at step 06.

  pvalue:
    label: p-value
    required: true
    any_of:
      - [pval_col]

  sample_size:
    label: sample size
    required: true
    any_of:
      - [ncontrol_col]
      - [ncontrol]
    why: >
      A per-variant control-count column, or one fixed number for the study. For a
      quantitative trait this is the total N - see sample_size.controls_only.
      ncase_col / ncase are optional and turn the study into a case/control design.

  info:
    label: imputation quality
    required: true
    any_of:
      - [imp_info_col]
      - [infofile, infocolumn]
      - [fixed_info, fixed_info_column]
    why: >
      The study's own column, or an external file together with the name of the
      column inside it. Giving infofile without infocolumn is not enough. A
      user may instead explicitly assign one constant with --fixed-info; it is
      recorded as user-assigned rather than measured per variant.

  resource_folder:
    label: the resource folder
    required: true
    any_of:
      - [resource_folder]
    why: >
      Holds the FASTA, dbSNP, chain and reference-panel files.

  output_folder:
    label: the output folder
    required: true
    any_of:
      - [output_folder]

# ---------------------------------------------------------------------------
# Every field the pipeline knows about, and what happens to it.
#
# columns.mandatory lists only the fields that CANNOT be recovered from
# anything else.  The rest are absent from it on purpose - each one has a step
# that fills or derives it, named below.  Reading this table answers "why is
# eaf/se/info/snp/n not in columns.mandatory?".
#
#   at_read    required by columns.mandatory at dataset step 03
#   at_export  required by final_check.require at chromosome step 13
#   recovered  the step that supplies it when the input file does not
# ---------------------------------------------------------------------------
field_lifecycle:
  chr:
    at_read: true
    at_export: true
    recovered: null
    note: Cannot be recovered from anything else.
  pos:
    at_read: true
    at_export: true
    recovered: null
    note: Cannot be recovered from anything else.
  ea:
    at_read: true
    at_export: false
    recovered: null
    note: >-
      A null allele is rejected at read as null_allele, so it cannot reach
      step 13.
  oa:
    at_read: true
    at_export: false
    recovered: null
    note: >-
      A null allele is rejected at read as null_allele, so it cannot reach
      step 13.
  pval:
    at_read: true
    at_export: true
    recovered: null
    note: Cannot be recovered from anything else.
  beta:
    at_read: alternative
    at_export: true
    recovered: chromosome step 06
    note: >-
      Derived from the Z score with the frequency and sample size; one of beta
      or zscore must be present at read.
  zscore:
    at_read: alternative
    at_export: true
    recovered: chromosome step 09
    note: >-
      Derived from beta and SE; one of beta or zscore must be present at read.
  se:
    at_read: false
    at_export: true
    recovered: chromosome step 08 or 06
    note: >-
      When no SE column is selected, SE is derived from the effect estimate and
      the p-value or from the Z score; nulls in a selected study SE column are
      not row-wise filled and instead reach the configured validation gates.
  eaf:
    at_read: false
    at_export: true
    recovered: chromosome step 04
    note: >-
      Supplied by the selected study column or, when that column is absent, by
      the user-provided external file; an external file does not row-wise
      backfill nulls in a selected study column.
  info:
    at_read: false
    at_export: false
    recovered: chromosome step 11
    note: >-
      Supplied by the study, matched from its external file, or explicitly
      assigned by --fixed-info. Its standard-INFO or MaCH Rsq type is resolved
      once at dataset step 08 and shared by all chromosome workers; a value
      still missing afterwards is governed by info.on_missing.
  snp:
    at_read: false
    at_export: false
    recovered: chromosome step 12
    note: >-
      Constructed as chr:pos:ea:oa when the study supplies no identifier.
  n:
    at_read: false
    at_export: false
    recovered: chromosome step 05
    note: >-
      The effective N is computed there, from the config scalars when there is
      no per-variant column.

# ---------------------------------------------------------------------------
# Presentation order: the order the pipeline actually reaches each group.
# 'stage' says where it applies - which is also why the groups are in this
# sequence rather than alphabetical.  Drives this file and every template.
# ---------------------------------------------------------------------------
group_order:
  - group: input
    order: 1
    stage: dataset 03 / 08 read the study and write typed chromosome work files
    keys:
      - strip_double_hash_lines
      - delimiter
      - delimiter_candidates
      - delimiter_sample_rows
      - delimiter_min_columns
      - delimiter_max_columns
      - null_values
      - schema_inference_rows
