        '23': X
        '24': Y
        '25': X
        '26': MT
        XY: X
        PAR1: X
        PAR2: X
        M: MT
      help: |-
        What it does: Renames non-standard chromosome labels to standard ones.
        When it applies: Every study, genome-build, strand, external EAF, external INFO,
          concordance-reference and extracted-VCF chromosome key, after prefix, integral-suffix
          and leading-zero normalization. Study labels are then checked against
          chromosome.allowed_after_split.
        Values:
          Each entry is one old label -> one new label; order does not matter, and a label with no
          entry is left alone. Both sides are matched in upper case, and the new name must be one
          of 1-22, X, Y, XY or MT. Write it as {23: X, 24: Y} or as the text "23->X,24->Y".
