        What it does: Removes leading zeroes from chromosome labels made entirely of digits.
        When it applies: Every study, genome-build, strand, external EAF, external INFO,
          concordance-reference and extracted-VCF chromosome key before matching.
        Values:
          true - '01', '001' and '1' all become '1'; the label '0' remains '0'.
          false - numeric labels retain their zero padding on both sides of every comparison.
