        - TESTEDALLELE
      other_allele_column:
        - A2
        - AL2
        - ALLELE0
        - ALLELE2
        - OA
        - NEA
        - NON_EFFECT_ALLELE
        - NONEA
        - NONEFFECT_ALLELE
        - NONEFFECTALLELE
        - OTHER_ALLELE
        - OTHERALLELE
        - REF
        - REFALLELE
        - REFERENCE
        - REFERENCE_ALLELE
        - REFERENCEALLELE
      effect_allele_frequency_column:
        - EAF
        - A1FREQ
        - AF_EFF
        - EFF_AF
        - EFFECT_AF
        - EFFECT_ALLELE_FREQ
        - EFFECT_ALLELE_FREQUENCY
        - EFFECT_ALLELE_FRQ
        - EFFECTALLELEFREQ
        - FREQ_EFFECT
        - FREQ_EFFECT_ALLELE
        - FREQ_TESTED_ALLELE
        - FREQ_TESTED_ALLELE_IN_HRS
        - FRQ_EFFECT_ALLELE
        - FRQ_TESTED_ALLELE
        - TESTED_AF
      maf_frequency_column:
        - MAF
        - MINOR_AF
        - FRQMAX
      ambiguous_frequency_column:
        - AF
