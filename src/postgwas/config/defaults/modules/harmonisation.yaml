        - BASE_GRCH37
        - BASE_GRCH38
        - BASE_PAIR_LOCATION
        - BASE_PAIR_POSITION
        - BASEGRCH37
        - BASEGRCH38
        - BP
        - BP_HG19
        - BP_HG38
        - BPHG19
        - BPHG38
        - BPOS
        - GEN_POS
        - GENOMEPOS
        - GENPOS
        - POS
        - POS_B37
        - POS_B38
        - POS_GRCH37
