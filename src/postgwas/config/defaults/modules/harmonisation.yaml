    strip_chr_prefix:
      default: true
      help: |-
        What it does: Whether a leading 'chr' is taken off the chromosome label before anything is
          compared.
        When it applies: Every study, genome-build, strand, external EAF, external INFO,
          concordance-reference and extracted-VCF chromosome key before matching.
        Values:
          true - 'chr7', 'Chr7' and 'CHR7' all become '7' before renaming and filtering.
          false - the prefix is retained identically on both study and reference inputs.
          Either way the label is upper-cased and a trailing '.0' is removed, so '7.0' becomes 7.
        Example: With true, study 'chr01' and reference '1' can both canonicalize to '1'.
        Note: The same shared expression consumes this policy for every comparison; no reference
          reader applies an independent prefix rule.
      origin: shared/variant_columns.py:canonical_chromosome_expression
