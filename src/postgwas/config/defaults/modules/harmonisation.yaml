  # =================================================================
  # dataset 03 / reference readers   position parsing and bounds
  # =================================================================
  position:
    min_value:
      default: 1
      help: |-
        What it does: The smallest base-pair position a variant is allowed to have.
        When it applies: chromosome step 02 and the same coordinate step inside dataset step 03,
          only when a position column is present, and after the position has been turned into a
          whole number. dataset step 04, the content check, also uses it when working out whether
          any variant would pass the basic coordinate and allele checks.
        Values:
          A position below this number is removed and recorded as an invalid position, so a
          larger value rejects more variants. The units are base pairs and the smallest permitted
          floor is 1 because PostGWAS handles ordinary 1-based GWAS variant coordinates. Position
          0 is reserved for telomere records by VCF and is not accepted by the GWAS-to-VCF adapter.
        Example: With the default min_value 1, a variant at position 0 - the marker many tools write for
          "could not be mapped" - is removed and appears in the reject file with reason
          invalid_position and the detail "position below position.min_value (1)".
        Note: Empty, unreadable, non-finite, non-integral, and out-of-range positions are rejected
          by the shared coordinate parser before this configured lower bound is applied.
        Source: https://samtools.github.io/hts-specs/VCFv4.5.pdf
      origin: coordinates.py:_harmonise; shared/variant_columns.py:canonical_position_expression
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 1
        number_kind: int
    extraction:
      default: leading_digits
      help: |-
        What it does: How the base-pair position is pulled out of the second half of a combined
          chromosome:position field.
        When it applies: only when the coordinate step splits a combined column, that is when
          chr_pos_col names a column that exists and either chr_col or pos_col is missing. A file
          with genuine chromosome and position columns never consults it. The split normally
          happens once during the read (dataset step 03), otherwise at chromosome step 02.
        Values:
          strip_non_digits - deletes every non-digit anywhere in the field and glues the
            remaining digits together.
          leading_digits - keeps the complete leading numeric token and discards the rest; the
            token must then resolve to a finite integer-valued coordinate.
          none - leaves the text alone and lets the later number conversion decide; anything that
            will not convert becomes empty and is rejected as an invalid position.
        Example: '1:123456:A:G' splits into chromosome '1' and the text '123456:A:G'.
          strip_non_digits and leading_digits both give 123456 there, while none keeps the text,
          fails to convert it and rejects the variant as an invalid position. On '1:123456.0'
          strip_non_digits gives 1234560, ten times too large, and on '1:123456-123457' it gives
          123456123457; they become plausible wrong coordinates. leading_digits gives 123456 for
          both, preserves '1e5' as 100000, and causes a fractional token such as '123456.7' to be
          rejected rather than truncated.
        Note: leading_digits is the safe default because it preserves the first complete numeric
          token without joining later numeric components into a different coordinate.
          strip_non_digits remains available only as an explicit compatibility choice.
      origin: shared/variant_columns.py:position_text_expression
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - strip_non_digits
        - leading_digits
        - none

  # =================================================================
  # 05  dataset 03      allele validation
  # =================================================================
  allele:
    pattern:
      default: ^[ACGT]+$
      help: |-
        What it does: Sets the pattern that both the effect and the other allele must match for a
          variant to be kept.
        When it applies: dataset step 03, after the chromosome and position checks and before
          duplicate removal, and only when both ea_col and oa_col name a column that is in the
          file. The same pattern is applied again at dataset step 04 as a sanity check that at
          least some variants survive the basic checks.
        Values: a regular expression. The allele is upper-cased first, so case never matters, and
          the expression is applied as a SEARCH rather than a whole-string match - the ^ and $ in
          the default are what force the entire allele to be A, C, G or T. Both alleles must match;
          a variant failing either is rejected with the reason 'non_standard_allele'.
        Example: under the default ^[ACGT]+$ the alleles 'a', 'AT' and 'ACGTACGT' are kept, so
          indels written out in full are fine, while 'I', 'D', '-', '.', 'R' and 'A/T' are all
          rejected. Dropping the anchors to [ACGT] would let 'ATN' and even 'A/T' through, because
          each merely contains a matching character.
        Note: a variant whose allele is empty is rejected just before this, under its own reason
          'null_allele', so it is never attributed to the pattern. There is no setting that
          translates I/D or '-' coding into bases, so a study that codes indels that way loses
          every indel here - re-code the allele columns before the run rather than loosening this
          pattern.
      origin: summary_statistics_io.py:read_summary_statistics
      recommendation: null
      type: str
      validator:
        allow_none: false
        description: a regular expression
        kind: text

  # =================================================================
  # dataset 03 / chromosome 04   input and reference-aligned duplicate checks
  # =================================================================
  duplicates:
    key:
      default:
      - chr
      - pos
      - ea
      - oa
      help: |-
        What it does: Names the fields whose combined value makes two rows the same variant.
          When pos, ea and oa are present, PostGWAS removes shared trailing and then leading VCF
          padding in private key columns, adjusts only the private key position for removed leading
          bases, and uses the resulting normalized unordered allele pair. Original study values are
          never rewritten by duplicate detection.
        When it applies: first at dataset step 03 after chromosome, position and allele checks, then
          again after reference orientation and final effect-frequency alignment within chromosome
          step 04. Every listed field must resolve to its own column in both passes.
        Values: field names resolved to the column your config names - chr->chr_col, pos->pos_col,
          snp->snp_id_col, ea->ea_col, oa->oa_col, eaf->eaf_col, beta->beta_or_col, se->se_col,
          zscore->imp_z_col, pval->pval_col, info->imp_info_col, n or ncontrol->ncontrol_col,
          and ncase->ncase_col. Allele text is compared without regard to letter case. When ea and
          oa are both listed, min(EA,OA) and max(EA,OA) form the two allele-key components; adding
          any other field finds fewer duplicates, while removing one finds more.
        Example: with the default [chr, pos, ea, oa], 1:1000 A/G and 1:1000 A/T are different
          variants and both continue. Rows 1:1000 A/G and 1:1000 G/A share the normalized A/G
          pair, are reported as a swapped_orientation duplicate group, and are both removed.
          Likewise 1:1000 ATT/AT and 1:1000 A/AT reduce to the same unordered A/AT pair but use
          opposite effect-allele orders, so both are removed rather than selecting one result.
        Note: every field must resolve to a distinct input column. A missing or ambiguous mapping is
          an actionable configuration error; duplicate checking is never silently skipped. An
          unordered pair is used only when both ea and oa participate in the configured key. Minimal
          padding removal requires pos, ea and oa together. It is the representation-only VCF rule,
          not FASTA-backed left-alignment, and therefore does not merge repeat-shifted indels. The
          second pass catches opposite-strand representations such as A/G and T/C only after the
          reference has proven that they are the same REF/ALT variant; it never canonicalizes an
          unnormalised indel by reverse complement.
      origin: summary_statistics_io.py:resolve_duplicate_variants
      recommendation: null
      type: list
      validator:
        allow_empty: false
        item:
          allow_none: false
          kind: enum
          members:
          - chr
          - pos
          - snp
          - ea
          - oa
          - eaf
          - beta
          - se
          - zscore
          - pval
          - info
          - n
          - ncontrol
          - ncase
        kind: list
        unique: true
        upper: false
    consistency_fields:
      default:
      - beta
      - se
      - zscore
      - pval
      - eaf
      help: |-
        What it does: Defines the scientific values that must agree within a duplicate group before
          PostGWAS is allowed to keep one row. For each available field, null values are ignored and
          all remaining values must pass the consistency rule for the active duplicate pass.
        When it applies: dataset step 03 and the reference-aligned duplicate pass inside chromosome
          step 04, only to groups identified by duplicates.key. Fields without a configured input
          column are omitted, but at least one configured field must be available. At the second
          pass, BETA, Z and a study EAF have already been transformed to reference ALT orientation.
          Swapped-orientation groups found before reference orientation are removed before any row
          can be selected, although their raw disagreements remain listed in the report.
        Values: beta, se, zscore, pval, eaf, info, n, ncontrol or ncase, resolved through the sample
          sheet column mapping. beta refers to beta_or_col, so it compares the supplied beta or odds
          ratio before chromosome-level effect conversion.
        Example: duplicate rows with the same beta, SE, p-value and EAF are consistent even if one has
          an empty Z score. If two non-empty beta values differ, every row in that group is conflicting.
        Note: dataset step 03 uses exact equality. The second pass uses only the separately configured
          post-orientation numerical tolerance so deterministic floating-point roundoff is not called
          a scientific disagreement.
      origin: summary_statistics_io.py:resolve_duplicate_variants
      recommendation: null
      type: list
      validator:
        allow_empty: false
        item:
          allow_none: false
          kind: enum
          members:
          - beta
          - se
          - zscore
          - pval
          - eaf
          - info
          - n
          - ncontrol
          - ncase
        kind: list
        unique: true
        upper: false
    post_orientation_relative_tolerance:
      default: 1.0e-12
      help: |-
        What it does: Prevents harmless floating-point roundoff introduced by step-04 allele
          transformations from turning mathematically equal aligned values into a duplicate conflict.
        When it applies: only to numeric beta, SE, Z, p-value, EAF and INFO comparisons in the
          reference-aligned duplicate pass at chromosome step 04. Dataset step 03 remains exact.
        Values: a relative tolerance from 0 to 1e-9. Zero requires bit-exact equality. Two finite
          values agree when their absolute difference is no greater than this value multiplied by
          the larger absolute value. Nulls remain ignored; non-finite values use exact comparison.
        Example: with 1e-12, EAF 0.3 and the computed value 1-0.7 = 0.30000000000000004 agree,
          while EAF 0.3 and 0.3001 remain conflicting.
        Note: this is a numerical-representation tolerance, not a biological or association-effect
          tolerance. It is intentionally far below the precision reported by summary statistics.
      origin: summary_statistics_io.py:resolve_duplicate_variants
      recommendation: null
      type: float
      validator:
        allow_none: false
        integer: false
        kind: num
        maximum: 1.0e-9
        minimum: 0.0
        number_kind: float
    quality_fields:
      default:
      - beta
      - se
      - zscore
      - pval
      - eaf
      - ncontrol
      - ncase
      - info
      help: |-
        What it does: Names the analysis fields counted when the 'completeness' ranking criterion
          compares scientifically consistent duplicate rows. The row with more non-empty resolved
          fields ranks first.
        When it applies: dataset step 03 or the chromosome step-04 post-orientation pass, after
          consistency is confirmed and only when duplicates.selection_order contains completeness.
        Values: beta, se, zscore, pval, eaf, info, n, ncontrol or ncase. Fields that have no configured
          input column do not contribute; no value is imputed for ranking.
        Example: two consistent rows tie on their shared beta, p-value and EAF, but only one supplies
          SE and INFO. That row has two more complete quality fields and is selected.
        Note: completeness is assessed only across configured scientific fields, not arbitrary text
          columns, so an unrelated annotation cannot decide which association row survives.
      origin: summary_statistics_io.py:resolve_duplicate_variants
      recommendation: null
      type: list
      validator:
        allow_empty: false
        item:
          allow_none: false
          kind: enum
          members:
          - beta
          - se
          - zscore
          - pval
          - eaf
          - info
          - n
          - ncontrol
          - ncase
        kind: list
        unique: true
        upper: false
    selection_order:
      default:
      - completeness
      - sample_size
      - info
      - input_order
      help: |-
        What it does: Gives the ordered tie-breakers used to retain exactly one row from a
          scientifically consistent duplicate group.
        When it applies: dataset step 03 or the chromosome step-04 post-orientation pass, after
          duplicates.consistency_fields agree and every row uses the same effect/other-allele order.
        Values:
          completeness - prefer more non-empty duplicates.quality_fields.
          sample_size - prefer larger per-variant effective N; case-control rows use
            4/(1/Ncase + 1/Ncontrol), while a single quantitative-trait N is used directly.
          info - prefer the larger imputation-quality value.
          input_order - prefer the earlier physical input row and make the final choice reproducible.
        Example: the default first prefers the most complete row, then larger N, then higher INFO, and
          finally the earlier input row when every scientific quality measure ties.
        Note: input_order must appear exactly once and last. This guarantees deterministic output even
          when every configurable quality value is tied or unavailable.
      origin: summary_statistics_io.py:resolve_duplicate_variants
      recommendation: null
      type: list
      validator:
        allow_empty: false
        item:
          allow_none: false
          kind: enum
          members:
          - completeness
          - sample_size
          - info
          - input_order
        kind: list
        unique: true
        upper: false
    conflicting_action:
      default: remove_all
      help: |-
        What it does: Controls the dataset outcome when non-empty values in one or more
          duplicates.consistency_fields disagree within a same-orientation duplicate group, or
          when a normalized allele-pair group contains both effect/other-allele orders.
        When it applies: dataset step 03 or the chromosome step-04 post-orientation pass, after the
          conflicting rows and their evidence have been written to the duplicate and rejected-variant
          reports.
        Values:
          remove_all - reject every row and continue. Same-orientation scientific conflicts use
            conflicting_duplicate; opposite allele orders use swapped_orientation_duplicate.
          fail_dataset - write the reports, then stop the dataset with an actionable error.
        Example: two 1:1000 A/G rows with beta 0.1 and 0.2 are both rejected under remove_all; under
          fail_dataset they are recorded in the same way and the dataset then stops. A/G plus G/A
          rows receive the same configured action but retain their separate swapped-orientation class.
        Note: there is intentionally no option to keep the lowest p-value, first row or last row from
          an unsafe group. At the early pass, effect type, effect direction and frequency semantics
          are not yet resolved, so PostGWAS does not guess how to reconcile swapped-orientation
          values. At the post-orientation pass, disagreement between already ALT-aligned statistics
          remains a true scientific conflict and every row is removed.
      origin: summary_statistics_io.py:read_summary_statistics
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - remove_all
        - fail_dataset

  # =================================================================
  # 07  dataset 05      genome build inference
  # =================================================================
  build:
    mode:
      default: auto
      help: |-
        What it does: Decides whether the input's genome build is worked out from the data or
          simply declared in the config.
        When it applies: dataset step 05 (genome build), always. confidence_ratio,
          min_match_count, min_reference_match_fraction and min_match_fraction are consulted
          only when this is 'auto'; reference deduplication also applies to the one selected
          reference when a build is declared.
        Values:
          auto - match the input against both references in forward, swapped,
            reverse-complement and reverse-complement-swapped orientations, then decide.
          GRCh37 - declare GRCh37 and read only its reference to collect strand evidence.
          GRCh38 - declare GRCh38 and read only its reference to collect strand evidence.
        Example: Under 'auto', an input whose evidence does not clear all four checks is reported
          as "Ambiguous" and the whole dataset aborts with "Genome build inference failed".
          Setting build.mode: GRCh38 fixes the build decision while still comparing alleles with
          the GRCh38 reference for the study-level strand-consensus check.
        Note: The error message in the older code advertises a --genome-build command-line flag
          that does not exist; this setting is it.
      origin: genome_build.py:infer_genome_build
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - auto
        - GRCh37
        - GRCh38
    confidence_ratio:
      default: 0.9
      help: |-
        What it does: Sets how lopsided the two builds' match counts must be before one of them
          is declared the winner.
        When it applies: dataset step 05 (genome build), only when build.mode is 'auto'.
        Values:
          The share of ALL matches that must fall to one build: each build's match count is
          divided by the sum of the two, so the two shares always add up to 1. Raising it
          towards 1.0 demands a near-clean sweep and sends more files back as "Ambiguous";
          0.5, the floor, accepts whichever build is merely ahead.
        Example: 60,000 of 63,000 coordinate-testable variants match GRCh37 and 3,000 match
          GRCh38.
          GRCh37's share is 60,000/63,000 = 0.952, above 0.90, so the build is GRCh37. Had
          GRCh38 matched 10,000, the share would be 0.857 and the answer would be "Ambiguous",
          which aborts the dataset.
        Note: Because the two shares add to 1 whatever the sample size, this test is combined
          with build.min_match_count, build.min_reference_match_fraction and
          build.min_match_fraction.
      origin: genome_build.py:infer_genome_build
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.5
        number_kind: float
    min_match_count:
      default: 100
      help: |-
        What it does: Sets the minimum absolute number of allele-compatible study variants that
          the winning build must have before automatic inference is trusted.
        When it applies: dataset step 05 (genome build), only when build.mode is 'auto'.
        Values: A positive whole number. Raising it requires more independent study rows to
          support the build; lowering it permits small datasets but makes accidental evidence
          more influential.
        Example: A 98-to-2 winning share is not accepted when only 98 variants matched, because
          it does not reach the default minimum of 100. Exactly 100 matches passes this check,
          but the fraction and confidence checks must also pass.
        Note: This counts each study row at most once per build, even when a reference contains
          duplicate or multiallelic rows.
      origin: genome_build.py:infer_genome_build
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 1
        number_kind: int
    min_reference_match_fraction:
      default: 0.1
      help: |-
        What it does: Sets the smallest share of the winning build's representative reference
          markers that must be found with compatible alleles before automatic inference is
          trusted.
        When it applies: dataset step 05 (genome build), only when build.mode is 'auto'. Only
          normalized chromosome labels present in the cleaned study contribute reference
          markers to the denominator.
        Values:
          Unique matched chromosome/position/ref/alt reference records are divided by all unique
          reference records on the study's chromosomes. The default 0.1 requires one tenth of that
          relevant marker panel. Values from 0.0 to 1.0 are accepted so a deliberately sparse or
          targeted study can use a documented lower threshold; 0.0 disables this one coverage
          check while the absolute-count, testable-row and winning-share checks remain active.
        Example: A chromosome-1 study with 964,783 rows can match 32,534 of 35,333 unique GRCh37
          chromosome-1 reference markers (92.08%) while those matches are only 3.37% of all
          input rows. It passes this reference-coverage check because the build-check file is a
          representative marker panel, not an inventory of every possible study variant.
        Note: The input-wide fraction is still logged for audit but is not a pass/fail threshold.
          This denominator follows the marker-sampling approach used by genome-build inference
          tools such as MungeSumstats. The default 0.1 remains a configurable PostGWAS safety
          policy, not a universal biological constant.
      origin: genome_build.py:infer_genome_build
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    min_match_fraction:
      default: 0.8
      help: |-
        What it does: Sets the smallest share of coordinate-testable study variants whose alleles
          must match the winning reference before automatic inference is trusted.
        When it applies: dataset step 05 (genome build), only when build.mode is 'auto'. It is
          combined with build.min_match_count, build.min_reference_match_fraction and
          build.confidence_ratio.
        Values:
          Compared against the better of the two builds' match shares. The denominator counts
          only study rows whose exact chromosome and position occurs in at least one configured
          build reference. Rows absent from both references are untestable and logged separately.
          0.8 requires four out of five testable rows to match; 1.0 requires every testable row.
        Example: If 800 study rows occur in either build reference and 760 have alleles matching
          GRCh37, its fraction is 760/800 = 0.95 and passes the default 0.8. The size of the full
          study file is not used in this fraction.
        Note: This denominator measures allele agreement among rows the reference can test.
          build.min_reference_match_fraction separately requires adequate coverage of the
          representative reference markers on the chromosomes present in the study.
      origin: genome_build.py:infer_genome_build
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    deduplicate_reference:
      default: true
      help: |-
        What it does: Removes repeated chromosome/position/ref/alt rows from each build
          reference file before the input is matched against it.
        When it applies: dataset step 05 (genome build). Both references are treated the same way
          in auto mode; only the declared build's reference is treated in forced mode.
        Values:
          true - exact duplicate reference rows are removed before joining; the row counts before
            and after are written to the log.
          false - exact duplicates remain in the join input. Match and strand counts still count
            each study row at most once, but the larger join can use extra time and memory.
        Example: If one reference variant is listed three times, the final evidence still counts
          the matching study variant once; true avoids materialising the two redundant join rows.
        Note: Enabled by default because duplicate rows cannot add scientific evidence and only
          increase join size.
      origin: genome_build.py:28-46
      recommendation: 'true'
      type: bool
      validator:
        kind: flag

  # =================================================================
  # 08  dataset 06 / chromosome 04   reference strand orientation
  # =================================================================
  strand:
    mode:
      default: auto
      help: |-
        What it does: Selects how study alleles are oriented, while always validating every retained
          row against the selected build's configured CHROM/POS/REF/ALT/AF reference.
        When it applies: dataset step 06 either calculates consensus from non-palindromic matches or
          records an explicit reference-aligned declaration; chromosome step 04 performs the
          configured row-level reference checks before allele-frequency harmonisation.
        Values:
          auto - tests direct, swapped, reverse-complement and reverse-complement-swapped SNV
            orientations and uses full-study consensus or decisive internal study EAF for palindromes.
          reference_aligned - declares that the listed alleles already use the selected reference
            strand, so only direct and swapped REF/ALT order is accepted; every row is still checked.
        Example: a study T/C row against reference REF=A ALT=G is classified as
          reverse_complement and becomes G/A in auto mode. The same row is reference-unmatched in
          reference_aligned mode because complementing was not authorised by that declaration.
        Note: the reference is not expanded into four copies. The user supplies the ordinary raw
          chromosome table and the implementation performs one coordinate join. There is no mode
          that bypasses reference validation because the GWAS-VCF adapter requires reference-aligned
          REF/ALT semantics.
      origin: strand.py:harmonise_strand_orientation
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - auto
        - reference_aligned
    consensus_threshold:
      default: 0.99
      help: |-
        What it does: Sets the minimum dominant forward- or reverse-strand fraction required for a
          study-wide consensus call.
        When it applies: dataset step 06, among uniquely classified non-palindromic variants for
          the selected genome build. Palindromic variants never contribute to this calculation.
        Values: a fraction from 0.5 to 1.0. Below the threshold the study is labelled mixed; this
          does not override unambiguous non-palindromic per-variant matches, but prevents consensus
          alone from resolving palindromic variants.
        Example: 99,200 forward and 800 reverse matches give 0.992 and pass the default 0.99.
        Scientific basis: GWAS Catalog uses a greater-than-99% full-data consensus after its
          screening stage before inferring palindromic orientation.
      origin: strand.py:resolve_strand_consensus
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.5
        number_kind: float
    min_informative_variants:
      default: 1000
      help: |-
        What it does: Requires this many uniquely forward- or reverse-matched non-palindromic
          variants before a study-wide strand consensus is trusted.
        When it applies: dataset step 06. A smaller evidence set is labelled unresolved; ordinary
          non-palindromic variants can still be oriented individually. A palindromic variant then
          requires decisive internal study-EAF evidence under all four configured palindromic AF
          rules or is rejected.
        Values: a non-negative whole number. Zero removes the absolute evidence floor.
        Example: 800 perfectly forward matches remain unresolved at the default 1000 rather than
          allowing a small or specialised input to determine every palindromic variant.
      origin: strand.py:resolve_strand_consensus
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        minimum: 0
        number_kind: int
    palindromic_af_ambiguity_lower:
      default: 0.40
      help: |-
        What it does: Sets the inclusive lower edge of the uninformative frequency interval used
          when distinguishing the two orientations of an A/T or C/G variant.
        When it applies: chromosome step 04. A study effect-allele frequency and the aligned
          population-reference AF must both lie outside the configured lower/upper interval before
          frequency may resolve an otherwise ambiguous internal-EAF palindrome. An independent
          external-panel AF is aligned only after study orientation and never supplies this evidence.
        Values: a frequency strictly between 0 and 0.5 and below
          strand.palindromic_af_ambiguity_upper. Values exactly on this boundary remain ambiguous.
        Example: with the defaults, 0.39 may contribute evidence but 0.40 may not.
        Scientific basis: allele frequencies near 0.5 cannot distinguish AF from 1-AF reliably;
          frequency-aware GWAS harmonisation therefore excludes a central interval. See the
          TwoSampleMR harmonisation method (https://mrcieu.github.io/TwoSampleMR/articles/harmonise.html)
          and NHGRI-EBI GWAS Catalog orientation method
          (https://ebispot.github.io/gwas-sumstats-harmoniser-documentation/Introduction/Orientation-of-palindromic-variants/).
      origin: strand.py:resolve_palindromic_frequency_evidence
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: true
        integer: false
        kind: num
        maximum: 0.5
        minimum: 0.0
        number_kind: float
    palindromic_af_ambiguity_upper:
      default: 0.60
      help: |-
        What it does: Sets the inclusive upper edge of the uninformative frequency interval used
          when distinguishing the two orientations of an A/T or C/G variant.
        When it applies: chromosome step 04 together with
          strand.palindromic_af_ambiguity_lower.
        Values: a frequency above 0.5 and below 1. Values exactly on this boundary remain ambiguous.
        Example: with the defaults, 0.61 may contribute evidence but 0.60 may not.
        Note: keeping both interval edges in canonical YAML makes the scientific exclusion policy
          explicit and allows a user to select a more conservative interval for the study design.
      origin: strand.py:resolve_palindromic_frequency_evidence
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.5
        number_kind: float
    palindromic_af_max_difference:
      default: 0.10
      help: |-
        What it does: Sets the largest absolute difference allowed between a candidate effect-aligned
          internal study frequency and population-reference ALT frequency before that candidate can
          resolve a palindromic variant.
        When it applies: chromosome step 04 only after both frequencies are outside the configured
          ambiguity interval. Exactly the configured difference passes.
        Values: frequency units from 0 to 1. This is deliberately stricter than the later general
          strand.af_tolerance because here frequency is decision evidence rather than supporting QC.
        Example: candidate AF 0.18 and reference AF 0.20 differ by 0.02 and pass; candidate 0.32 and
          reference 0.20 differ by 0.12 and cannot resolve the row at the default.
      origin: strand.py:resolve_palindromic_frequency_evidence
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    palindromic_af_min_error_margin:
      default: 0.20
      help: |-
        What it does: Requires the winning palindromic frequency orientation to have an absolute AF
          error at least this much smaller than every competing orientation.
        When it applies: chromosome step 04 together with the maximum-difference rule. Exactly the
          configured error separation passes; a tie or smaller separation is ambiguous.
        Values: frequency units from 0 to 1. Requiring both a small winning error and a separated
          competing error prevents a single near-threshold statistic from deciding the row.
        Example: errors 0.03 and 0.47 differ by 0.44 and pass the default; errors 0.08 and 0.22 differ
          by only 0.14 and remain ambiguous even though the smaller error is below 0.10.
      origin: strand.py:resolve_palindromic_frequency_evidence
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: true
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    unmatched_action:
      default: reject
      help: |-
        What it does: Controls variants for which no REF/ALT ordering at the coordinate matches the
          supplied chromosome reference under forward, swap, reverse-complement or both operations.
        When it applies: chromosome step 04 after the single coordinate join.
        Values: reject writes the original row with reason reference_unmatched and continues; retain
          preserves the supplied effect-allele order with explicit reference-unmatched provenance,
          leaves population-reference AF unavailable, and requires the GWAS-to-VCF adapter to validate
          the resulting REF allele against the genome FASTA; fail stops that chromosome with an
          actionable error. Under a strong reverse study consensus, retained unmatched SNVs are
          reverse-complemented before FASTA validation. Retain does not guarantee output: exact
          adapter row-count validation fails the chromosome if any retained allele pair cannot be
          represented against the FASTA. An unmatched palindrome still requires strong study-wide
          consensus; without it, strand.ambiguous_action applies because FASTA allele matching alone
          cannot establish the study effect direction of A/T or C/G.
        Example: study A/G at a reference G/T site matches none of the four representations and is
          rejected by default.
      origin: strand.py:harmonise_strand_orientation
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [reject, retain, fail]
    ambiguous_action:
      default: reject
      help: |-
        What it does: Controls variants for which the configured mode and reference evidence do not
          leave exactly one scientifically supported orientation.
          When it applies: chromosome step 04. In auto mode, palindromic variants require strong
          study-wide consensus or decisive internal study EAF. In reference_aligned mode, they
          require one direct/swapped REF/ALT match. Non-palindromic variants are ambiguous when a
          multiallelic or conflicting reference leaves more than one exact orientation.
        Values: reject records the explicit palindromic orientation/frequency reason or
          reference_ambiguous and continues; fail stops that chromosome.
        Example: an A/T variant is retained under a strong forward consensus even when EAF is near
          0.5, then checked against reference AF as QC. Under mixed or unresolved consensus it is
          evaluated against the configured frequency-evidence rules and rejected if they do not
          select exactly one orientation.
      origin: strand.py:harmonise_strand_orientation
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [reject, fail]
    af_tolerance:
      default: 0.20
      help: |-
        What it does: Sets the largest absolute difference allowed between the final study EAF and
          the aligned population-reference ALT frequency before the row is called AF-discordant.
        When it applies: chromosome step 04 after the internal or external EAF source has been
          selected and allele swaps have already been applied. Missing study or reference values
          are not called discordant.
        Values: frequency units from 0 to 1. Population ancestry, sampling and study design can
          produce real differences, so the default is deliberately broad and pairs with a warning.
        Example: study EAF 0.31 against reference AF 0.30 differs by 0.01 and passes; 0.75 against
          0.30 differs by 0.45 and is discordant at the default 0.20.
      origin: allele_frequency.py:harmonise_allele_frequency
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    af_discordance_action:
      default: warn
      help: |-
        What it does: Controls final non-palindromic EAF values farther from the aligned population
          reference than strand.af_tolerance.
        When it applies: chromosome step 04 after allele orientation and frequency harmonisation.
        Values: warn keeps the row and records the discordance; reject writes it with reason
          af_discordant; fail stops the chromosome. Warn is the default because population AF is
          supporting QC evidence rather than proof of strand for an individual study.
        Example: a study from a population different from the configured panel may produce many
          warnings; select the correct population column rather than weakening allele matching.
      origin: allele_frequency.py:harmonise_allele_frequency
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [warn, reject, fail]
    palindromic_af_discordance_action:
      default: reject
      help: |-
        What it does: Controls a palindromic variant whose final effect-aligned study frequency
          differs from the already-oriented population-reference ALT frequency by more than
          strand.af_tolerance.
          When it applies: chromosome step 04 after consensus and/or decisive internal study-EAF
          evidence has selected the palindromic orientation. The later comparison remains QC;
          orientation evidence has already been evaluated by the stricter configured palindromic
          maximum-difference and error-margin rules.
        Values: reject records af_discordant and removes the row; warn retains it with a warning;
          fail stops the chromosome. Reject is conservative because A/T and C/G allele letters
          cannot independently confirm the selected strand.
        Example: a consensus-oriented A/T variant with study EAF 0.85 and aligned reference AF
          0.10 differs by 0.75 and is rejected at the default tolerance 0.20.
      origin: allele_frequency.py:harmonise_allele_frequency
      recommendation: reject
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [warn, reject, fail]

  # =================================================================
  # 09  dataset 07      beta or odds ratio - decided ONCE for the study
  # =================================================================
  effect:
    or_detection_max_non_positive_fraction:
      default: 0.005
      help: |-
        What it does: Sets the largest combined share of zero and negative values allowed in an
          automatically identified odds-ratio column.
        When it applies: dataset step 07 (study-wide properties), only when effect.type is
          'auto'. Also at chromosome step 03 when effect.verify_per_chromosome is on, where it
          can only produce a warning.
        Values:
          A fraction from 0 to 1, calculated over usable finite numeric values. The default 0.005
          means at most 0.5% may be zero or negative. A column is accepted as OR only when this
          limit and the configured median range both pass. Non-positive rows are still invalid ORs
          and are handled individually by effect.or_non_positive before logarithmic conversion.
        Example: one zero among 200 usable values is 0.5% and may be tolerated as contamination if
          the median is near 1; two zeros are 1% and conflict with an OR-like median.
        Note: zero and negative counts are combined, not allowed separately. Missing and non-finite
          cells are excluded from the denominator and handled by their own validation rules.
      origin: effect_type.py:detect_effect_type
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    or_detection_require_median_range:
      default: [0.80, 1.25]
      help: |-
        What it does: Defines the required median interval for automatic odds-ratio classification.
        When it applies: dataset step 07 while effect.type is 'auto', together with
          effect.or_detection_max_non_positive_fraction.
        Values: A low and high bound. The column median must fall inside it before automatic OR
          classification is allowed.
        Example: at [0.80, 1.25] a positive column with median 0.02 is ambiguous rather than
          log-transformed; an odds-ratio column with median 1.02 passes if its non-positive fraction
          also passes.
        Note: an odds-ratio column normally has a median near 1, while a beta column normally has a
          median near 0. A positive column outside this interval is ambiguous and must be declared.
      origin: effect_type.py:detect_effect_type
      recommendation: null
      type: list
      validator:
        allow_none: false
        kind: numeric_pair
        maximum: 100.0
        minimum: 0.0
    type:
      default: auto
      help: |-
        What it does: States whether the effect column holds beta (log-odds) values or odds
          ratios.
        When it applies: dataset step 07 (study-wide properties) decides it once for the whole
          study and chromosome step 03 applies that answer. An explicit sample-sheet declaration
          is still checked by the detector; another explicit policy value skips detection.
        Values:
          auto - work it out from the combined share of zero and negative values and the required
            median check in effect.or_detection_require_median_range; ambiguous or conflicting
            evidence stops and requests an explicit declaration.
          beta - take the column as it stands; nothing is transformed.
          odds_ratio - replace every value with its natural logarithm and carry the result
            forward in a column called 'beta'.
        Example: A column named 'OR' with values around 1. With effect.type: odds_ratio, 1.05 is
          carried forward as 0.048790 and 0.95 as -0.051293. With effect.type: beta the same
          file exports 1.05 as the effect size, which makes every Z score, standard error and
          p-value downstream wrong.
        Note: State this in the config whenever you know it - it is far safer than any
          detection, which is a fallback for files you do not know. Log-transforming a beta
          column by mistake cannot be undone further down the pipeline. Whenever auto supplies
          the applied answer, PostGWAS prints and records a prominent warning containing the
          inferred type, median, non-positive fraction and explicit-declaration recommendation.
      origin: effect_type.py:68
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - auto
        - beta
        - odds_ratio
    cast_strict:
      default: false
      help: |-
        What it does: Decides whether an effect-size cell that will not convert to a number
          stops the chromosome or is blanked out.
        When it applies: chromosome step 03 (effect type), first thing in the step, on every
          chromosome and whichever effect type was decided.
        Values:
          true - the conversion is strict, so one unreadable cell ends that chromosome's run
            with a conversion error.
          false - unreadable cells become empty, are counted, and are reported as the QC action
            "effect size is a number"; the chromosome carries on.
        Example: A file that writes missing effects as 'NA' fails on the first chromosome under
          true. Under false the log records "12,481 values in 'BETA' are not numbers", those
          variants keep an empty effect size, and the effect-statistics check at step 10 is what
          removes them.
        Note: The shipped false setting matches the shared summary-statistics reader and keeps
          malformed cells auditable through the normal missing-effect rejection path. Set true
          only when any malformed effect cell should fail the chromosome immediately.
      origin: effect_type.py:harmonise_effect_estimates
      recommendation: 'false'
      type: bool
      validator:
        kind: flag
    verify_per_chromosome:
      default: false
      help: |-
        What it does: Re-runs effect-type detection inside every chromosome as a cross-check on
          the study-wide answer.
        When it applies: chromosome step 03 (effect type), only when a study-wide decision was
          handed down, which is what the pipeline always does. The flag is also recorded in the
          decision record written at dataset step 07.
        Values:
          true - detection runs again on each chromosome's own rows: agreement is noted,
            disagreement is a warning, and the local verdict is stored in the QC record as
            effect_type_chromosome_check. The study-wide answer is applied either way.
          false - no re-check and no extra pass over the effect column.
        Example: The study-wide answer is 'odds_ratio' but chromosome 6's own rows are 12%
          negative, so the local detector says 'beta'. With true the log reads "Re-checking on
          this chromosome alone suggests 'beta', but the study-level decision 'odds_ratio' is
          authoritative"; the column is still log-transformed. With false nothing is said.
        Note: This can only produce warnings, never change an outcome. A chromosome whose own
          values cannot be classified at all is warned about rather than failing the run.
      origin: new
      recommendation: null
      type: bool
      validator:
        kind: flag
    or_non_positive:
      default: reject
      help: |-
        What it does: Says what to do with an odds ratio of zero or below, which has no
          logarithm.
        When it applies: chromosome step 03 (effect type), only when the effect type is
          odds_ratio, whether that came from the config or from detection. Never consulted for a
          beta column.
        Values:
          reject - remove the rows and write them to the reject file under the reason
            'effect_non_positive_or'. If no reject file is being collected, the step warns and
            blanks the value instead.
          null - blank out the effect size for those variants and keep the rows.
          keep - take the logarithm anyway; this is unsafe and retained only as an explicit policy.
          fail - stop the chromosome with an error quoting the counts.
        Example: A column holding 1.03, 0.0 and -0.5. Under 'null' the first becomes beta
          0.029559 while the other two get an empty beta but stay in the file, logged as "1
          exactly zero, 1 negative". Under 'reject' those two rows leave the dataset; under
          'fail' the chromosome stops.
        Note: Zeros and negatives are counted separately in the log and the QC record, so a
          file with negative "odds ratios" - usually a mislabelled beta column - is visible
          rather than hidden inside one total.
      origin: effect_type.py:145
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - reject
        - 'null'
        - keep
        - fail
    se_scale:
      default: auto
      help: |-
        What it does: Determines or declares which scale an odds-ratio study's standard error is
          on, and therefore whether SE must be divided by OR before allele orientation.
        When it applies: dataset step 07, only when effect type is odds_ratio and a standard-error
          column is supplied. The selected study-wide answer is applied at chromosome step 03.
        Values:
          auto - compare the two candidate identities log(OR)/SE and log(OR)/(SE/OR) with the
            study's supplied Z scores, or with its two-sided p-values when no sufficiently
            informative Z comparison exists. Ambiguous or insufficient evidence stops before
            chromosome processing instead of guessing.
          log_odds - the standard error already matches the log-odds effect size and is left
            exactly as it arrived. The dataset-level comparison still checks this explicit
            declaration when enough evidence exists.
          as_given - the standard error is on the raw odds-ratio scale, so chromosome step 03
            divides it by the original OR using the first-order delta method before changing
            allele orientation. The explicit declaration is cross-checked when possible.
        Example: A variant with OR 2.00 and SE 0.30. Under 'log_odds' the exported effect is
          ln(2) = 0.693147 and the SE stays 0.30. Under 'as_given' the SE becomes
          0.30 / 2.00 = 0.15 alongside the same effect size.
        Note: Most logistic-regression GWAS files report the SE of log(OR), even when the effect
          column is exponentiated to OR. Auto exists because a raw OR-scale SE is also possible
          and applying the wrong interpretation changes Z, confidence intervals and p-values.
          Raw p=0 is excluded because it is censored/underflowed rather than an exact probability.
          The p-value fallback assumes a two-sided Wald p-value; studies reporting score-test,
          likelihood-ratio or one-sided p-values should provide Z or set se_scale explicitly.
      origin: effect_type.py:detect_or_standard_error_scale
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - auto
        - log_odds
        - as_given
    se_scale_min_variants:
      default: 100
      help: |-
        What it does: Sets how many variants must distinguish the log-odds and raw-OR SE
          interpretations before automatic SE-scale detection may make a study-wide decision.
        When it applies: dataset step 07 for an odds-ratio study with effect.se_scale=auto. A
          variant is informative only when OR and SE are positive and finite, Z or p is usable,
          and the two candidate interpretations differ by more than the configured validation
          tolerance.
        Values: A positive whole-variant count. Larger values require broader evidence and are
          safer for rounded or heterogeneous files; smaller values permit small studies or
          selected-variant files to be classified from less evidence.
        Example: with the default 100, 99 otherwise usable variants cannot decide the scale and
          the dataset stops before splitting. An explicit log_odds or as_given declaration may
          continue, while the log records that it could not be independently validated.
      origin: effect_type.py:detect_or_standard_error_scale
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 1
        number_kind: int
    se_scale_min_agreement_fraction:
      default: 0.95
      help: |-
        What it does: Requires the selected SE-scale interpretation to agree with the supplied Z
          or p-value for this share of informative variants.
        When it applies: dataset step 07 after the minimum informative-variant count is reached.
        Values: A fraction from 0 to 1. The default 0.95 allows ordinary rounding differences but
          refuses a scale that explains fewer than 95 percent of the discriminating variants.
        Example: 960 agreements among 1,000 informative variants gives 0.96 and passes this rule;
          900 gives 0.90 and remains ambiguous or inconsistent.
      origin: effect_type.py:detect_or_standard_error_scale
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    se_scale_min_agreement_margin:
      default: 0.1
      help: |-
        What it does: Requires the selected interpretation's agreement fraction to exceed the
          alternative interpretation by at least this amount.
        When it applies: dataset step 07 together with effect.se_scale_min_agreement_fraction.
        Values: A fraction from 0 to 1. It prevents both interpretations from being accepted when
          rounded effects near OR=1 make them observationally similar.
        Example: log-odds agreement 0.97 and raw-OR agreement 0.20 has margin 0.77 and passes;
          0.97 versus 0.92 has margin 0.05 and remains ambiguous at the default 0.10.
      origin: effect_type.py:detect_or_standard_error_scale
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float

  # =================================================================
  # 09  dataset 07      p-value scale - decided ONCE for the study
  # =================================================================
  pvalue:
    mlogp_detect_threshold:
      default: 1.05
      help: |-
        What it does: Sets the value above which a number cannot be a plain p-value, and so
          counts as evidence that the column is on a log scale.
        When it applies: dataset step 07 (study-wide properties), only when pvalue.type is
          'auto'. Also at chromosome step 08 when pvalue.verify_per_chromosome is on, where it
          can only produce a warning.
        Values:
          The threshold itself, in the units of the column. Its floor is 1.0, because no plain
          p-value exceeds 1; 1.05 matches the default raw-p rounding tolerance. Raising it,
          say to 2.0, ignores weak evidence and needs stronger hits before a log column is recognised;
          lowering it towards 1.0 lets values only just above 1 count as evidence.
        Example: With 1.05 a -log10 p of 1.30 (p = 0.05) counts towards the log-scale
          evidence, while a plain p-value recorded as exactly 1.0 for an untested variant does
          not. The count of values above the threshold is then divided by the usable values and
          compared with pvalue.mlogp_detect_proportion.
      origin: p_values.py:detect_p_value_type
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1000.0
        minimum: 1.0
        number_kind: float
    mlogp_detect_proportion:
      default: 0.001
      help: |-
        What it does: Sets how large a share of the column must exceed the log-scale threshold
          before the fraction component supports -log10 p rather than plain p-values.
        When it applies: dataset step 07 (study-wide properties), only when pvalue.type is
          'auto'. Also at chromosome step 08 when pvalue.verify_per_chromosome is on, where it
          can only produce a warning.
        Values:
          The share of the usable (non-empty, finite) values that must exceed
          pvalue.mlogp_detect_threshold. Larger demands more range evidence; smaller makes this
          fraction component easier to satisfy. The configured minimum count and median checks
          remain mandatory either way, so this fraction alone never selects the scale.
        Example: In 1,000,000 raw p-values roughly 89,000 sit below 0.089, so the same file on
          the -log10 scale has about 8.9% of its values above 1.05 - far above the 0.1% required.
          It is classified as -log10 only if the configured minimum count and median checks also
          agree. A genuine raw column with 40 corrupt cells reading 2.5 has a share of 0.004%,
          below 0.1%, so it stays raw and those 40 cells go to the range check.
        Note: The share, not the largest value, is deliberately the test. The older detector
          called any column whose maximum exceeded 2 a log column, which turned one corrupt cell
          into 10**(-p) applied to the entire file.
      origin: p_values.py:detect_p_value_type
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: true
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    mlogp_detect_min_count:
      default: 2
      help: |-
        What it does: Sets the minimum number of usable values that must exceed
          pvalue.mlogp_detect_threshold before automatic detection may classify the entire
          column as -log10 p.
        When it applies: dataset step 07, only when pvalue.type is 'auto'. It is evaluated
          together with pvalue.mlogp_detect_proportion and never replaces the fraction test.
        Values: An integer of at least 2. Requiring at least two observations guarantees that
          one sentinel, corrupt cell, or mis-parsed value cannot select the scale for the study.
          Larger values are more conservative for small or selected datasets.
        Example: A raw-p column with one value recorded as 999 cannot be converted as -log10 p,
          even if the file is small enough for that one value to exceed the configured fraction.
          A genuine -log10 p column must satisfy this count, the configured fraction, and the
          median agreement check before conversion is allowed.
      origin: p_values.py:detect_p_value_type
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 2
        number_kind: int
    mlogp_expected_median:
      default: 0.3010299956639812
      help: |-
        What it does: Supplies the expected median of a -log10 p column used as the second,
          distribution-level confirmation in automatic detection. The default is
          log10(2) = 0.3010299956639812: under a Uniform(0,1) null p-value distribution, the
          raw median is 0.5 and -log10(0.5) is approximately 0.301.
        When it applies: dataset step 07, only after both the configured count and fraction
          above pvalue.mlogp_detect_threshold support -log10 p. It is not used to infer a scale
          from the median alone.
        Values: A positive value in -log10 p units. Keep the scientific default for a complete,
          genome-wide GWAS. A selected or top-hit-only file may not have a null-like median and
          should normally declare pvalue.type explicitly rather than weakening this check.
        Example: With the default and pvalue.mlogp_median_tolerance of 0.15, an observed median
          from about 0.151 to 0.451 confirms the -log10 interpretation; a -ln p median near
          0.693 does not and is refused.
      origin: p_values.py:detect_p_value_type
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: true
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    mlogp_median_tolerance:
      default: 0.15
      help: |-
        What it does: Sets the absolute distance allowed between the observed study-wide median
          and pvalue.mlogp_expected_median before automatic -log10 p detection is accepted.
        When it applies: dataset step 07, only when pvalue.type is 'auto' and the configured
          count and fraction above the raw-p range already support -log10 p.
        Values: A non-negative distance in -log10 p units, smaller than
          pvalue.mlogp_expected_median so the acceptance interval remains positive. Smaller is
          stricter; larger tolerates more polygenic enrichment or test-statistic inflation but
          makes the distribution check less discriminating.
        Example: At the default expected median of approximately 0.301 and tolerance of 0.15,
          a median of 0.32 agrees, while 0.69 or 2.0 is refused rather than silently converted.
      origin: p_values.py:detect_p_value_type
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    max_negative_fraction:
      default: 0.001
      help: |-
        What it does: Sets the largest study-wide fraction of finite numeric p-value-column
          cells that may be negative. Negative values are valid neither as raw probabilities
          nor as -log10(p), so allowed cells are warned about and rejected rather than converted.
        When it applies: dataset step 07, before chromosome splitting and regardless of whether
          pvalue.type came from automatic detection, the sample sheet, or explicit YAML.
        Values: A fraction from 0 to 1. The denominator contains only usable finite numeric
          cells, so missing or unparseable values cannot hide a signed-log or wrong-column error.
          A fraction equal to the threshold continues; a fraction above it stops the dataset.
        Example: At the default 0.001, 10 negative cells among 10,000 usable values warn and are
          rejected, while 11 negatives stop with guidance to correct the scale or column mapping.
        Scientific basis: raw p and -log10(p) are both non-negative. A rare negative cell can be
          isolated corruption, but a material fraction is evidence that the declared representation
          is incompatible with the data and must not be silently transformed.
      origin: p_values.py:assess_negative_pvalues
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    type:
      default: auto
      help: |-
        What it does: States the scale of the p-value column. PostGWAS accepts the two standard
          GWAS representations: plain p-values and non-negative -log10 p values.
        When it applies: dataset step 07 (study-wide properties) decides it once for the whole
          study and chromosome step 08 applies that answer. Every path validates the configured
          pvalue.max_negative_fraction before chromosome processing. An explicit sample-sheet
          declaration is still otherwise checked by the detector; another explicit policy value
          skips scale detection.
        Values:
          auto - work it out once across the complete study: negative values follow
            pvalue.max_negative_fraction; both
            pvalue.mlogp_detect_min_count and pvalue.mlogp_detect_proportion must support a
            -log10 scale, and its median must agree with pvalue.mlogp_expected_median within
            pvalue.mlogp_median_tolerance. Otherwise a valid [0,1] column is treated as raw.
          raw - the column holds plain p-values; only the range checks are applied.
          neglog10 - the column holds -log10 p; the p-value is rebuilt as 10 to the power of
            minus the value.
        Example: A column whose median is about 0.30 is -log10 p, and 7.3 in it means p = 5e-8.
        Note: Signed log10(p), ln(p), and -ln(p) are not accepted representations. Convert them
          to raw p or -log10 p before running PostGWAS. Excessive negative fractions and
          distributionally incompatible columns are refused instead of guessing a log base.
      origin: p_values.py:detect_p_value_type
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - auto
        - raw
        - neglog10
    output_column:
      default: PVAL
      help: |-
        What it does: Names the one canonical plain-p-value column left by chromosome
          harmonisation, regardless of whether the study supplied raw p-values or -log10 p.
        When it applies: chromosome step 07 after the study-wide p-value representation has
          been applied. A raw input is validated into this column; a -log10 input is converted
          with p = 10^(-value) into the same column.
        Values: A non-empty table column identifier other than LP, which GWAS-VCF reserves for
          -log10(p). The packaged value PVAL follows the plain p-value meaning used at the
          GWAS-to-VCF process boundary. If another input column already uses the configured name,
          PostGWAS refuses to overwrite it unless that column is itself the selected p-value source.
        Example: raw 0.05 and -log10 value 1.30103 both leave PVAL = 0.05. The bundled adapter
          consumes that raw value and writes FORMAT/LP = 1.30103 to GWAS-VCF; harmonisation does
          not generate a second canonical -log10 column.
        Scientific basis: GWAS-VCF defines FORMAT/LP as -log10(p), while its conversion input is
          the plain association p-value. Keeping the process-boundary column explicitly raw
          prevents an intermediate value from being mislabeled as LP.
      origin: p_values.py:harmonise_p_values
      recommendation: null
      type: str
      validator:
        allow_none: false
        description: a valid non-empty table column identifier other than reserved LP
        kind: text
        pattern: '(?i)^(?!LP$)[A-Za-z_][A-Za-z0-9_]*$'
    clip_low:
      default: 1.0e-300
      help: |-
        What it does: Supplies an explicit positive approximation for a literal input p = 0
          under pvalue.out_of_range = clip. It is never a lower bound for a valid positive
          p-value.
        When it applies: chromosome step 07 only to a literal zero, and chromosome step 08 as
          the approximation value only when pvalue.zero_missing_se = approximate. A positive
          raw token such as 1e-400 and an exact -log10 p such as 400 retain their source
          magnitude in private provenance and are not replaced by this value.
        Values:
          The zero approximation in p-value units. It must be above 0 and below
          pvalue.clip_high. Smaller gives a larger approximate Z, but no configured value can
          recover the unknown magnitude of a literal zero.
        Example: A file that writes its strongest hits as p = 0 has them raised to 1e-300,
          but step 08 does not automatically treat that floor as exact evidence. If SE and a
          usable Z are absent, the default pvalue.zero_missing_se = fail stops clearly;
          'approximate' explicitly derives |beta| / 37.07 and records that decision.
        Note: Float64 cannot hold a positive p-value below about 5e-324. PostGWAS preserves
          such positive source tokens and calculates in log-probability space; only a literal
          zero lacks the information needed for an exact Z or SE.
      origin: p_values.py:71,281
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: true
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    derive_partial_missing_se:
      default: true
      help: |-
        What it does: Fills a missing standard-error cell from that row's harmonised BETA and
          raw p-value while preserving every standard error already supplied by the study or
          recovered from a usable Z score.
        When it applies: chromosome step 08 when an SE column exists but is only partly
          populated. It does not overwrite a finite supplied or Z-derived SE. Rows without a
          usable BETA or p-value remain empty for the configured effect-statistics validation
          gate. Literal input p = 0 continues to follow pvalue.zero_missing_se.
        Recovery order for each row:
          1. Preserve a non-null standard error supplied by the study.
          2. If SE is null and finite BETA and a finite, non-zero Z are available, chromosome
             step 06 first requires signed BETA/Z agreement, then derives the positive value
             SE = abs(BETA / Z). Directionally incompatible rows follow
             effect_from_z.beta_z_sign_mismatch instead of being assigned a negative SE.
          3. If SE is still null because Z is absent, null, zero, or non-finite, true enables
             the step-08 p-value fallback: |Z| = -ndtri_exp(ln(P) -
             ln(pvalue.se_tail)), followed by SE = |BETA / Z|. The log-probability form remains
             valid when raw P is too small for Float64.
          4. If BETA or P is unusable, or the calculation is non-finite, leave SE null for the
             action configured by validation.se_invalid. A literal input P = 0 instead follows
             pvalue.zero_missing_se because its exact Z cannot be recovered.
        Values:
          true - derive only null SE cells as |BETA / z|, where z is obtained from the
            pvalue.se_tail normal tail, and record the recovered-row count.
          false - disable only the step-08 p-value fallback. Supplied SE and exact step-06
            BETA/Z recovery are still preserved; remaining null cells proceed to
            validation.se_invalid. The pvalue.zero_missing_se policy still governs a null-SE
            row whose study p-value was literally zero.
        Example: for SE values [0.02, null, 0.05], true preserves 0.02 and 0.05 and derives only
          the middle value. If that middle row has no Z, BETA = 0.10, P = 0.05 and
          pvalue.se_tail = 2, |Z| is about 1.96 and SE is about 0.051. It never recalculates
          the whole column.
        Scientific basis: for an association statistic with the configured normal-test tail,
          z is recovered from p and SE = |BETA / z|. This is the same calculation already used
          when the complete study SE column is absent; applying it only to null cells prevents
          avoidable variant loss without changing reported study estimates.
      origin: standard_error.py:derive_standard_error_from_effect_and_p_value
      recommendation: null
      type: bool
      validator:
        allow_none: false
        kind: flag
    zero_missing_se:
      default: fail
      help: |-
        What it does: Controls the scientifically unresolved case where the raw study file
          reports p = 0 and a standard error is still unavailable after attempting exact
          recovery from a supplied Z score.
        When it applies: chromosome step 08, only to rows whose original raw p-value was
          exactly zero and which have neither a supplied SE nor an SE recovered from a finite,
          non-zero Z score. It does not apply when SE was supplied, when a sign-consistent
          BETA/Z pair produced SE, or when the study supplied -log10 p rather than a literal zero.
        Values:
          fail - stop the chromosome with an actionable error; no matching variant is silently
            removed. This is the default because zero is a censored or underflow value, not an
            exact probability, so its exact Z and SE cannot be reconstructed.
          approximate - replace the unknown probability by pvalue.clip_low for SE derivation,
            retain the variant, count it, and mark it internally as an explicit approximation.
            The marker is reported in QC and removed from the exported table with other internal
            provenance columns.
          reject - remove the affected variant and write it to the rejected-variant output with
            reason zero_p_missing_se.
        CLI override: --zero-p-se-action fail|approximate|reject.
        Example: with beta = 0.10, p = 0 and no SE or usable Z, 'approximate' at a
          pvalue.clip_low of 1e-300 derives SE from a two-sided |Z| of about 37.07. That
          SE is only a bound-based approximation; the true p-value may be much smaller.
        Scientific basis: the GWAS Catalog summary-statistics format requires precision metadata
          when any p-value equals zero. Prefer supplying SE, usable Z, -log10 p, or the original
          precision metadata over approximation.
      origin: standard_error.py:derive_standard_error_from_effect_and_p_value
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - fail
        - approximate
        - reject
    clip_high:
      default: 1.0
      help: |-
        What it does: Sets the largest plain p-value the pipeline keeps. The scientifically valid
          default is 1.0; only values above 1 are handed to pvalue.out_of_range.
        When it applies: chromosome step 07 (p-value scale), only when the column is on the raw
          p-value scale. A column read as -log10 p never reaches this test - its
          ceiling on the p-value is pvalue.mlogp_min instead.
        Values: The ceiling is in p-value units and must be above pvalue.clip_low and no greater
          than 1. Lower values are permitted only as an explicit user policy.
        Example: p = 1 is retained unchanged and converts to -log10(p) = 0. With the default
          clip action, p = 1.02 is corrected to 1 and recorded as changed.
        Note: p = 1 is a valid null-result probability. It must not be treated as rounding error,
          warned about, or changed merely to avoid a zero Z score. If SE must be derived and the
          effect is non-zero, that separate mathematical limitation is handled at step 08.
      origin: p_values.py:281
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    mlogp_min:
      default: 0.0
      help: |-
        What it does: Sets the smallest valid non-negative -log10 p kept. Negative cells are
          governed by pvalue.max_negative_fraction and are never raised to p = 1.
        When it applies: chromosome step 07 (p-value scale), only when the column is on a log
          scale (-log10 p). A raw p-value column is governed by pvalue.clip_high
          instead.
        Values:
          The floor, in -log10 p units; it cannot go below 0. 0.0 corresponds to p = 1. Raising
          it above 0 quietly pushes weak associations to a fixed p-value - 0.1 means no p-value
          above 0.794 survives.
        Example: With the scientifically valid default 0, a -log10 p value of 0 is retained as
          p = 1. A value of -0.2 is invalid: it contributes to the study-wide negative fraction
          and, when the study remains below the configured threshold, that row is rejected.
        Note: This floor cannot be used to rescue negative values. Increasing it above 0 is an
          explicit user policy that raises otherwise valid weak-association values below the floor.
      origin: p_values.py:122
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: null
        minimum: 0.0
        number_kind: float
    tolerance_above_one:
      default: 1.05
      help: |-
        What it does: Sets how far above 1 a plain p-value may stray and still be forgiven as rounding
          error rather than treated as corrupt.
        When it applies: chromosome step 07 (p-value scale), after either supported input
          representation has produced the canonical raw p-value. Only a raw source can produce a
          finite rounding excess above one.
        Values:
          The largest value still forgiven, in p-value units; the floor is 1.0, which forgives nothing
          above 1. Raising it, say to 2.0, rescues more values; anything above it is unsalvageable.
        Example: at 1.05 with the default 'clip', p = 1.02 is pulled back to 1 and flagged,
          while p = 1.20 is removed under the reject reason 'pval_out_of_range', detail
          "outside 0 to 1.05".
        Note: forgiven values are pulled back to pvalue.clip_high (1.0). A negative source value
          fails the same shared gate as 1.20: it is removed under 'clip' and 'reject', stops the
          chromosome under 'fail', and is blanked and kept under 'null'.
      origin: p_values.py:_harmonise_canonical_pvalues
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 100.0
        minimum: 1.0
        number_kind: float
    out_of_range:
      default: clip
      help: |-
        What it does: Decides what happens to an unusable source value or a canonical raw p-value
          outside the range the pipeline keeps.
        When it applies: chromosome step 07, through one shared gate after either raw-p provenance
          attachment or -log10-to-raw conversion, and chromosome step 08 when a standard error is
          derived from an invalid value. Missing or unparseable source values are always rejected
          separately as 'pval_null'. Valid large -log10 values are never capped; exact raw text and
          log probability preserve them when Float64 cannot represent the converted p-value.
        Values:
          clip - literal raw zero is approximated by pvalue.clip_low and a finite rounding excess
            above one is set to pvalue.clip_high; both are flagged. Positive p-values below clip_low
            are unchanged. Non-finite values, negative -log10 values, and values above
            pvalue.tolerance_above_one cannot be repaired and are removed.
          null - the p-value is blanked and the variant kept, impossible values included.
          reject - the variant is removed under the reject reason 'pval_out_of_range'.
          fail - the chromosome stops with an error listing the counts.
        Example: under 'clip', raw p = 0 becomes 1e-300 while raw p = 1.02 becomes 1 and is
          flagged. A -log10 value of -0.2 is removed rather than changed to p = 1. If SE is
          unavailable, the original raw zero is then governed by pvalue.zero_missing_se; clipping
          it no longer silently authorises SE reconstruction.
        Note: p = 1 and -log10(p) = 0 are already valid and are left unchanged.
      origin: p_values.py:_harmonise_canonical_pvalues
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - clip
        - 'null'
        - reject
        - fail
    verify_per_chromosome:
      default: false
      help: |-
        What it does: Re-runs p-value scale detection inside every chromosome as a cross-check
          on the study-wide answer.
        When it applies: chromosome step 08 (p-value scale), only when a study-wide decision was
          handed down, which is what the pipeline always does. The flag is also recorded in the
          decision record written at dataset step 07.
        Values:
          true - detection runs again on each chromosome's own rows: agreement is noted,
            disagreement is a warning, and the local verdict is stored in the QC record as
            pvalue_scale_chromosome_check. The study-wide answer is applied either way.
          false - no re-check and no extra pass over the p-value column.
        Example: The study-wide answer is 'neglog10', but chromosome 22 holds only strong hits,
          so its own median is 12 and the local detector refuses to decide. With true the log
          reads "Re-checking the p-value scale on this chromosome alone was inconclusive, which
          changes nothing" and the run continues. With false nothing is said.
        Note: This can only produce warnings, never change an outcome.
      origin: new
      recommendation: null
      type: bool
      validator:
        kind: flag
    se_tail:
      default: 2
      help: |-
        What it does: Chooses whether the p-value is read as one-sided or two-sided when a
          standard error is worked back out of it.
        When it applies: chromosome step 09 (standard error from effect size and p-value), and
          only when the study supplies no standard-error column; if one is present the step
          derives nothing.
        Values:
          2 - two-sided: the Z score is the normal tail quantile of p/2. Correct for GWAS, where
            the p-value covers effects in either direction.
          1 - one-sided: the Z score is the quantile of p itself, which is smaller, so the
            standard error comes out larger.
        Example: p = 5e-8 with a beta of 0.05. With 2 the Z score is 5.4513 and the standard
          error 0.009172; with 1 the Z score is 5.3267 and the standard error 0.009387, about
          2% larger.
        Note: Two-sided is correct for GWAS; change this only for a file you know reports
          one-sided p-values.
      origin: standard_error.py:13
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: 2
        minimum: 1
        number_kind: int

  # =================================================================
  # Shared chromosome 04 / 11 policy for user-provided EAF and INFO files
  # =================================================================
  external_reference:
    exact_duplicate_action:
      default: keep_one
      help: |-
        What it does: Decides how repeated allele-specific reference rows are handled when the
          normalized chromosome, position, both alleles and selected annotation value are
          identical. The same setting governs the chromosome strand/AF reference and user-provided
          EAF and INFO files.
        When it applies: chromosome step 04 for strand and EAF references and chromosome step 11
          for external INFO, before allele matching.
        Values:
          keep_one - retain the first identical row and remove the redundant copies.
          discard_all - remove every reference row at that duplicated allele key.
          fail - stop the chromosome and report an example duplicated key.
        Example: duplicate EUR frequencies [0.25, 0.25] under keep_one supply one 0.25 value.
        Note: Equality is assessed after coordinate/allele normalization and numeric conversion
          of the selected EAF or INFO column. Other unused reference columns do not affect it.
      origin: shared/allele_join.py:deduplicate_reference_values
      recommendation: keep_one
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [keep_one, discard_all, fail]
    non_identical_duplicate_action:
      default: discard_all
      help: |-
        What it does: Decides how repeated reference allele keys are handled when their selected AF,
          EAF or INFO values differ. The same setting governs strand, external EAF and external INFO
          references.
        When it applies: chromosome step 04 for strand and EAF references and chromosome step 11
          for external INFO, before any annotation value is attached to a study variant.
        Values:
          discard_all - remove every reference row for the ambiguous allele key; the affected
            study row is unmatched and follows the existing EAF or INFO missing-value policy.
          fail - stop the chromosome and report the key and distinct values for repair.
        Example: [0.25, 0.45] and [missing, 0.25] are both non-identical duplicates. The default
          discards both rows instead of guessing that one value is scientifically preferable.
        Note: keep-one is deliberately unavailable here because row order cannot establish which
          different scientific annotation is correct. Counts are written to the chromosome log.
      origin: shared/allele_join.py:deduplicate_reference_values
      recommendation: discard_all
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [discard_all, fail]

  # =================================================================
  # 10  chromosome 04   effect allele frequency
  # =================================================================
  eaf:
    clip_tolerance:
      default: 1.05
      help: |-
        What it does: Marks how far above 1 an invalid frequency extends for diagnostic reporting.
          It does not make any value above 1 scientifically valid and does not bypass
          eaf.out_of_range.
        When it applies: chromosome step 04 whenever an internal or external frequency column is
          summarized. Every non-finite value and every finite value outside 0 to 1 is still handled
          by eaf.out_of_range.
        Values: The floor is 1.0. Raising it changes only the separately reported count of large
          positive overshoots; it never changes which values are invalid or which policy action runs.
        Example: with 1.05, both 1.02 and 37.4 are invalid EAF values. Only 37.4 is also reported as
          exceeding the diagnostic tolerance. Under the shipped eaf.out_of_range action both rows
          are rejected with their original values preserved in rejection provenance.
      origin: allele_frequency.py:summarise_allele_frequency
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 100.0
        minimum: 1.0
        number_kind: float
    out_of_range:
      default: reject
      help: |-
        What it does: Decides what happens to a non-finite frequency or a finite frequency outside
          the scientifically valid closed interval 0 to 1.
        When it applies: chromosome step 04, each time a frequency column is checked - the study's
          own column and a column merged from an external panel.
        Values:
          reject - remove the variant and record eaf_out_of_range using the immutable original row.
          null - blank the frequency and keep the variant for later missing-frequency handling.
          clip - explicitly force finite values into 0 to 1; non-finite values become null. This
            opt-in correction is never applied under another policy.
          fail - the step raises an error and the chromosome fails, but only if at least one such
            value actually exists.
        Example: -0.03, 1.02, 37.4, NaN and infinity are all invalid. Under reject they are removed;
          under null their EAF becomes empty; under explicit clip the finite values become 0, 1 and
          1 while NaN and infinity become empty.
        Note: exactly 0 and exactly 1 are valid probability endpoints and are governed separately by
          eaf.degenerate. They are unusable when both BETA and SE must be reconstructed from Z because
          that formula has a zero denominator.
      origin: allele_frequency.py:validate_allele_frequency
      recommendation: reject
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - clip
        - 'null'
        - reject
        - fail
    external_min_match_fraction:
      default: 0.8
      help: |-
        What it does: Sets the smallest share of a chromosome's variants that must receive a
          usable effect-allele frequency from the external file before the merge counts as a
          success. Matching only chromosome, position and alleles is not enough when the matched
          frequency is empty or invalid.
        When it applies: chromosome step 04, only when the frequency is taken from an external
          file named by the dataset's external_eaf_file setting, which happens when the study has
          no usable frequency column of its own. The comparison-AF panel is never used to fill
          missing study frequencies.
        Values: Larger demands a more complete panel and stops the chromosome sooner; smaller
          accepts a deliberately limited panel. The numerator counts matched frequencies that are
          present, finite and between 0 and 1; the denominator is every study variant on that
          chromosome. Exactly the configured fraction passes.
        Example: chromosome 1 has 1,000 study variants. Allele keys match for 900, but 150 matched
          frequencies are empty, so only 750 usable frequencies were supplied: 75%. The default
          0.80 stops and reports both the 90% key match and 75% usable-frequency match. If 800
          frequencies are usable, exactly 80% passes.
        Note: The default 0.80 is intended for genome-wide panels such as 1000 Genomes and detects
          wrong builds, incompatible allele coding, incorrect frequency columns and incomplete
          files. A deliberately restricted custom panel may explicitly lower this value.
      origin: allele_frequency.py:merge_external_allele_frequencies
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    match_orientations:
      default:
      - direct
      - swap
      help: |-
        What it does: Chooses which allele orderings are tried when looking a variant up in an
          external frequency file.
        When it applies: chromosome step 04, only when the frequency is taken from an external
          file rather than from the study's own column.
        Values:
          direct - the study's effect allele is matched to the panel's ALT and the other allele to
            the panel's REF; the panel frequency is used as it stands.
          swap - the study's effect allele is matched to the panel's REF instead, and the panel
            frequency is replaced by one minus itself.
          Order does not matter: 'direct' is always tried first and 'swap' only on what direct left
          unmatched. Naming just one of them turns the other pass off; the list may not be empty.
        Example: a study row chr1:12345 with EA=A, OA=G against a panel row REF=G, ALT=A carrying
          EAF 0.30 matches on the direct pass and takes 0.30. A study row with EA=G, OA=A does not
          match directly; the swap pass matches it and gives 1 - 0.30 = 0.70.
          Note: complement passes are deliberately unavailable. Every study row already has a
          validated strand_action from the reference-orientation step, and the external panel may
          align its declared ALT frequency but never re-decide beta, Z, strand_action or effect
          direction.
      origin: allele_frequency.py:merge_external_allele_frequencies
      recommendation: null
      type: list
      validator:
        allow_empty: false
        item:
          allow_none: false
          kind: enum
          members:
          - direct
          - swap
        kind: list
        unique: true
        upper: false
    non_effect_frequency_min_overlap:
      default: 1000
      help: |-
        What it does: Sets the fewest uniquely oriented, non-palindromic study variants that must
          have usable study and population-reference frequencies before PostGWAS may diagnose a
          supplied frequency column as belonging to the non-effect allele.
        When it applies: chromosome step 04 after the existing reference join and before any study
          frequency is used to orient a palindrome or transformed for an allele swap. The check
          applies only to a study-supplied column screened as EAF rather than MAF-like.
        Values: A positive whole number. Below this count the diagnosis is inconclusive and the
          declared effect-allele-frequency contract remains the user's responsibility.
        Example: 850 comparable variants cannot trigger the diagnosis at the default 1,000, even
          if their correlation is strongly negative.
        Scientific basis: GWAS-SSF defines effect_allele_frequency as the frequency of the listed
          effect allele, and GWAS-VCF stores association AF relative to ALT/effect allele. The
          minimum prevents small or specialised variant sets from overturning that input contract.
          See https://www.ebi.ac.uk/gwas/docs/summary-statistics-format and
          https://github.com/MRCIEU/gwas-vcf-specification.
      origin: strand.py:assess_study_frequency_allele_alignment
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 1
        number_kind: int
    non_effect_frequency_min_correlation:
      default: 0.80
      help: |-
        What it does: Requires one-minus the supplied study frequency to have at least this Pearson
          correlation with the expected frequency of the study's listed effect allele before the
          column can be diagnosed as non-effect-allele frequency.
        When it applies: together with the overlap, maximum-error and error-margin requirements;
          every requirement must pass, so correlation alone never changes or rejects data.
        Values: A correlation magnitude from 0 to 1. Larger is more conservative.
        Example: correlation -0.94 between supplied AF and expected effect AF means correlation
          +0.94 after inversion and passes the default correlation requirement.
      origin: strand.py:assess_study_frequency_allele_alignment
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    non_effect_frequency_max_error:
      default: 0.10
      help: |-
        What it does: Sets the largest mean absolute difference allowed between one-minus the study
          frequency and the expected effect-allele frequency for a non-effect-frequency diagnosis.
        When it applies: chromosome step 04 on the same uniquely oriented, non-palindromic evidence
          used by the correlation check.
        Values: Frequency units from 0 to 1. A smaller value requires a closer ancestry-matched
          reference agreement and reduces false diagnoses when the comparison panel is unsuitable.
        Example: inverted mean absolute error 0.04 passes the default; 0.14 remains inconclusive.
      origin: strand.py:assess_study_frequency_allele_alignment
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    non_effect_frequency_error_margin:
      default: 0.10
      help: |-
        What it does: Requires the mean absolute error after one-minus inversion to be at least this
          much smaller than the error under the declared effect-allele-frequency interpretation.
        When it applies: chromosome step 04 after the correlation and maximum inverted-error
          requirements. The pipeline fails on a conclusive diagnosis; it never auto-inverts data.
        Values: Frequency units from 0 to 1. Larger is more conservative; exactly the configured
          separation passes.
        Example: declared-alignment error 0.61 and inverted error 0.03 differ by 0.58 and pass the
          default 0.10 margin, while errors 0.12 and 0.08 remain inconclusive.
      origin: strand.py:assess_study_frequency_allele_alignment
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    maf_decision_cutoff:
      default: 0.95
      help: |-
        What it does: Sets the share of frequency values at or below 0.5 above which a column is
          suspected of holding minor allele frequencies rather than effect allele frequencies.
        When it applies: Dataset step 07 screens a study-supplied frequency column on the whole
          file before splitting. Chromosome step 04 also screens the deduplicated raw value column
          from a selected external_eaf_file before direct/swap allele alignment. A non-MAF-like
          external result retains the sample sheet's declared ALT/EAF contract. A MAF-like result
          requires confirmation against the independent default EAF source; when both settings
          resolve to the same physical file, the chromosome stops and asks for a different
          modules.harmonisation.default_eaf.source. The share is measured only among finite numeric
          values inside the closed interval 0 to 1. Missing, unparseable, NaN, infinite and finite
          out-of-range values are excluded from both the numerator and denominator and are reported
          separately.
        Values: Larger makes the pipeline slower to suspect a minor allele frequency; smaller
          suspects one sooner. A real effect allele frequency column has roughly half its values at
          or below 0.5; a real minor allele frequency column has all of them. The distribution is a
          conservative screen, not proof of allele meaning, so PostGWAS never auto-converts it.
        Scientific basis: The GWAS Catalog summary-statistics format defines effect allele
          frequency as the frequency of the listed effect allele. The raw external value must be
          screened before a swapped match applies 1-AF, otherwise that alignment operation can hide
          a source column that contains MAF rather than ALT/effect-allele frequency.
        Example: 6,400,000 usable frequencies with 6,300,000 at or below 0.5 give a share of
          0.984. That is above the default 0.95, so the column is MAF-like and chromosome step 04
          checks it against the configured default EAF table. If external_eaf_file is that same
          table, independent confirmation is impossible and processing stops.
      origin: study_properties.py:_decide_eaf_is_maf; shared/statistics.py:frequency_maf_screen; allele_frequency.py:harmonise_allele_frequency
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    maf_reference_min_overlap:
      default: 1000
      help: |-
        What it does: Sets the fewest non-palindromic variants shared with the default EAF table
          before a MAF-like internal or external frequency column can be classified from
          reference-frequency distances.
        When it applies: chromosome step 04 after the whole-study distribution flags an internal
          column as MAF-like, or after the raw external-frequency screen flags an independently
          supplied external column. Direct and allele-swapped matches both count.
        Values: An integer of at least 2 because correlation is undefined for one observation.
          Larger requires stronger chromosome-level evidence; smaller permits a decision from
          fewer variants. Below this count the result is inconclusive and processing stops;
          PostGWAS never guesses that an unconfirmed MAF-like column is effect-aligned EAF.
        Scientific basis: frequency is usable only when it is aligned to the listed effect allele;
          the comparison therefore tests input AF against both aligned reference EAF and reference
          MAF after allele matching. The default is deliberately conservative for GWAS-scale data.
      origin: allele_frequency.py:confirm_eaf_with_reference
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 2
        number_kind: int
    maf_reference_correlation_method:
      default: pearson
      help: |-
        What it does: Selects the correlation statistic used to test whether the supplied
          frequency spectrum and the independently configured default EAF panel have compatible
          minor-allele frequencies. Both inputs are folded as MAF=min(AF, 1-AF) after validated
          allele matching, so the result measures reference-panel suitability rather than effect
          allele direction.
        When it applies: chromosome step 04 after a MAF-like internal or external frequency column
          has at least eaf.maf_reference_min_overlap valid non-palindromic matches to an independent
          default EAF panel, and before EAF-versus-MAF direction is classified.
        Values: pearson measures linear agreement on the frequency scale and is the default;
          spearman measures monotonic rank agreement. A finite result must also pass
          eaf.maf_reference_min_correlation and the paired mean absolute MAF difference must pass
          eaf.maf_reference_max_mean_absolute_difference. Correlation alone never validates EAF.
        Scientific basis: population allele frequencies differ across ancestry groups, as
          characterised by the 1000 Genomes Project Consortium (Nature 2015,
          doi:10.1038/nature15393). Folding removes allele direction, so this is a compatibility
          check only; GWAS-SSF still requires frequency to refer to the listed effect allele.
      origin: allele_frequency.py:confirm_eaf_with_reference
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [pearson, spearman]
    maf_reference_min_correlation:
      default: 0.80
      help: |-
        What it does: Sets the smallest acceptable correlation between the supplied folded MAF and
          the independently configured default panel's folded MAF on the same matched variants.
        When it applies: chromosome step 04 together with
          eaf.maf_reference_max_mean_absolute_difference, before a MAF-like internal or external
          column can be classified as EAF or MAF.
        Values: A correlation from 0 to 1; larger demands closer reference-panel compatibility.
          Exactly the configured value passes. A missing or non-finite correlation, including a
          constant folded-MAF vector, is inconclusive and processing stops. The default 0.80 is a
          conservative PostGWAS QC setting rather than a universal ancestry-classification cutoff.
        Example: correlation 0.92 passes the default correlation requirement, but the reference is
          accepted as suitable only if its mean absolute MAF difference also passes its configured
          maximum.
      origin: allele_frequency.py:confirm_eaf_with_reference
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    maf_reference_max_mean_absolute_difference:
      default: 0.10
      help: |-
        What it does: Sets the largest acceptable mean absolute difference between the supplied
          folded MAF and the independently configured default panel's folded MAF on the same
          matched variants.
        When it applies: chromosome step 04 together with eaf.maf_reference_min_correlation,
          before a MAF-like internal or external column can be classified as EAF or MAF.
        Values: Frequency units from 0 to 0.5. Smaller demands closer agreement; exactly the
          configured maximum passes. This absolute-error guard prevents a high correlation caused
          by similarly ranked but systematically different frequency spectra from certifying an
          unsuitable panel.
        Example: correlation 0.95 with mean absolute MAF difference 0.14 fails the default 0.10
          maximum, while difference 0.08 passes this guard and proceeds to the remaining checks.
      origin: allele_frequency.py:confirm_eaf_with_reference
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 0.5
        minimum: 0.0
        number_kind: float
    reference_minor_fraction_cutoff:
      default: 0.95
      help: |-
        What it does: Detects a reference comparison that cannot reliably distinguish EAF from MAF
          because almost every matched reference effect allele is itself minor (reference EAF at or
          below 0.5). Such a panel makes aligned EAF and folded MAF nearly identical.
        When it applies: chromosome step 04, after an internal or external frequency column was
          flagged MAF-like and at least eaf.maf_reference_min_overlap non-palindromic reference
          matches are available.
        Values: If the share is greater than this cutoff, the result is inconclusive and the
          chromosome stops. Larger values permit more reference sets to reach the error comparison;
          smaller values are more conservative. This is deliberately separate from
          eaf.maf_decision_cutoff, which screens the study column rather than the reference panel.
        Example: if 980 of 1,000 aligned reference frequencies are at or below 0.5, the share is
          0.98. That exceeds the default 0.95, so PostGWAS reports inconclusive instead of treating
          equal EAF and MAF errors as proof of EAF.
      origin: allele_frequency.py:confirm_eaf_with_reference
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    maf_reference_error_margin:
      default: 0.02
      help: |-
        What it does: Sets the minimum separation required between mean absolute error as aligned
          EAF and mean absolute error as folded MAF before either interpretation is accepted.
        When it applies: chromosome step 04, only for a MAF-like internal or external frequency
          column after the overlap and reference-informativeness checks pass.
        Values: Units are allele-frequency points on the 0 to 1 scale. EAF is confirmed only when
          its mean error plus this margin is lower than the MAF error; MAF is confirmed by the
          reverse inequality. A tie or smaller difference is inconclusive and stops processing.
          Larger values demand stronger evidence; 0 allows any strict difference to decide.
        Example: mean errors 0.01 as EAF and 0.20 as MAF confirm EAF at the default 0.02 margin.
          Errors 0.10 and 0.11 differ by only 0.01, so PostGWAS stops rather than letting noise decide.
      origin: allele_frequency.py:confirm_eaf_with_reference
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    invalid_fraction_cutoff:
      default: 0.05
      help: |-
        What it does: Sets how large a share of out-of-range frequencies is tolerated before warning.
        When it applies: chromosome step 04, on the study's own frequency column and on one merged
          from an external panel. Out of range means non-finite, below 0 or above 1;
          eaf.clip_tolerance is diagnostic only.
        Values: Larger tolerates a larger invalid share before the dataset-level warning, while
          smaller warns sooner. Empty values remain separate and every chromosome row stays in the
          denominator.
        Example: 30,000 invalid frequencies among 500,000 variants is 6%, above the default 0.05,
          so a warning names the column and count and the corresponding internal_af_valid_range or
          external_af_is_valid_range QC field is false. At 0.10 the same share does not warn.
        Note: a warning and that QC field are all it produces - the column is used either way and is
          never diverted to the reference panel on the strength of this number; eaf.out_of_range has
          already decided what happens to the out-of-range values.
      origin: allele_frequency.py:validate_allele_frequency
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    missing_fraction_cutoff:
      default: 0.05
      help: |-
        What it does: Sets how large a share of empty frequency values is tolerated before a
          warning is printed.
        When it applies: chromosome step 04, each time a frequency column is checked - the study's
          own column, and a column merged from an external panel, where every unmatched variant is
          left empty.
        Values: Larger tolerates more gaps in silence; smaller warns sooner. It is a share of every
          row on the chromosome, taken from the count of empty values in the column.
        Example: 500,000 variants of which 40,000 have no frequency after the panel merge is 8%,
          above the default 0.05, so a warning names the column, the count and the share. At 0.10
          the same file is silent.
        Note: this warning used to be unreachable, because missingness was measured as a change in
          row count and blanking a value never changes the row count. It is now the honest count of
          empty values and does fire. It is still only a warning: nothing is removed, and no other
          setting reads this number.
      origin: allele_frequency.py:107
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    degenerate:
      default: reject
      help: |-
        What it does: Decides what happens to a variant whose effect allele frequency is exactly 0
          or exactly 1. Such an endpoint makes the Z-only BETA/SE reconstruction denominator zero.
        When it applies: chromosome step 04 after frequency-range handling, and again at step 06
          for rows that feed the BETA-and-SE-from-Z calculation.
        Values:
          reject - remove the variant and record it as eaf_degenerate.
          null - blank the frequency and keep the variant.
          keep - retain the reported endpoint when BETA and SE are already available. If both must
            be reconstructed from Z, step 06 still rejects it because division by zero is never a
            permitted scientific output.
          fail - stop the chromosome if any such variant exists.
        Example: an explicitly reported EAF of 1 is removed immediately under reject. Under keep it
          can accompany supplied effect statistics, but a Z-only row is rejected at step 06 under
          eaf_degenerate rather than being allowed to create infinite BETA and SE.
      origin: allele_frequency.py:harmonise_allele_frequency; effect_from_z.py:derive_effect_and_standard_error_from_z
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - reject
        - 'null'
        - keep
        - fail
  # =================================================================
  # 11  dataset 04 / chromosome 05   missing sample size and effective N
  # =================================================================
  sample_size:
    trait_type:
      default: auto
      help: |-
        What it does: Declares the study design and guards which sample-count inputs and effective
          sample-size calculation are scientifically valid for that design.
        When it applies: During sample-sheet validation, before the summary-statistics file is
          analysed, and again at chromosome step 05 to protect direct library callers.
        Values:
          auto - the configured counts determine the calculation: case plus control counts use the
            case/control Neff formula, while a lone control count follows sample_size.controls_only.
          binary - both a case count and a control count are required and Neff is calculated as
            4 / (1/Ncase + 1/Ncontrol).
          quantitative - any case-count field stops the run. The normal sample sheet requires the
            control-count field, which represents total sample size; with the shipped controls-only
            policy, Neff is set to that total count without applying the case/control formula.
        Example: a quantitative study with control_count = 50,000 gets Neff = 50,000. Adding a case
          count stops validation instead of calculating case/control Neff. A binary study with
          Ncase = 12,000 and Ncontrol = 50,000 gets Neff = 38,710 after rounding.
        Scientific basis: the harmonic effective-size formula is specific to case/control studies.
          Applying it to quantitative-trait counts would misrepresent the analysed sample size.
        Note: for quantitative traits, the control-count field name is retained by the current sample
          sheet interface but its value is interpreted as total N, not as the number of controls.
      origin: sample_sheet.py:HarmonisationSampleSheetRow.validate_alternatives; sample_size.py:_harmonise
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - auto
        - binary
        - quantitative
    min_value:
      default: 1
      help: |-
        What it does: Sets the smallest case count, control count or effective sample size that is
          allowed to survive.
        When it applies: Three places. The configuration check at dataset step 01 tests the fixed
          ncase / ncontrol / n / total_n numbers written in the config; chromosome step 05 tests the
          per-variant case and control count columns and then Neff; chromosome step 06 tests Neff again
          before BETA and SE are derived from a Z score.
        Values: A whole number of individuals. Raising it removes more variants: a present case or
          control count below the floor is rejected as 'sample_size_invalid', and a calculated Neff
          below it is rejected as 'neff_invalid'. Missing values are governed separately by
          sample_size.missing_action and sample_size.max_missing_fraction.
        Example: with a per-variant control-count column holding 0 for 812 variants, the shipped
          min_value 1 rejects those 812 as 'sample_size_invalid' before VCF creation.
        Note: A study or effective sample size of zero cannot represent an analysed variant, so both
          the default and the smallest configurable value are 1.
      origin: sample_size.py:harmonise_sample_sizes
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 1
        number_kind: int
    controls_only:
      default: use_ncontrol_as_total
      help: |-
        What it does: Says what a control count means when it is the only sample-size count the study
          provides.
        When it applies: chromosome step 05, and only when a control count (a column or one fixed
          number) is configured and no case count is. When both are configured the case/control formula
          wins and this setting is never consulted.
        Values:
          use_ncontrol_as_total - the lone control count is read as the total sample size and copied
            straight into Neff, which is the correct reading for a quantitative trait.
          fail - the run stops with an error naming this setting.
        Example: a quantitative-trait file with ncontrol = 450,000 and no case count gives every
          variant Neff = 450,000, and a DECIDE line records that the lone count was read as the total.
          The shipped default is what the pipeline already assumed and needs no change.
      origin: sample_size.py:115
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - use_ncontrol_as_total
        - fail
    cases_only:
      default: fail
      help: |-
        What it does: Says what a case count means when it is the only sample-size count the study
          provides.
        When it applies: chromosome step 05, and only when a case count is configured and no control
          count is. When both are configured this setting is never consulted.
        Values:
          fail - the run stops with an error naming this setting.
        Example: ncase = 10,000 with no control count stops because the effective size would be 20,000
          for a balanced study and would approach 40,000 as the number of controls grows.
        Note: A lone case count cannot determine effective sample size, so fail is the only accepted
          value. Provide both case and control counts for a case/control GWAS.
      origin: sample_size.py:120
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - fail
    missing_action:
      default: remove
      help: |-
        What it does: Controls what happens to variants whose configured per-variant case,
          control or total sample-size value is missing.
        When it applies: Dataset step 04 first measures missingness over the complete study.
          If the allowed fraction is not exceeded, chromosome step 05 applies this action before
          Neff is calculated. Fixed sample sizes from the sample sheet cannot be missing per row.
        Values:
          remove - reject every affected variant and record it as sample_size_invalid.
          median - fill each affected source column with its own dataset-wide median.
          mean - fill each affected source column with its own dataset-wide mean.
          fail - stop when even one variant has a missing sample size.
        Example: If NCONTROL is missing for 50 of 10,000 variants and the action is median, those
          50 values receive the median of the 9,950 usable NCONTROL values. For a case/control
          study, NCASE and NCONTROL are handled separately and Neff is calculated afterwards.
        Note: remove is the scientifically conservative default. MungeSumstats also drops rows
          with missing N by default and describes sample-size imputation as a last resort. Median
          is more resistant than mean to unusually large study counts. Any imputation is explicit,
          counted and logged; the original input is never overwritten.
        Source: https://www.bioconductor.org/packages/release/bioc/vignettes/MungeSumstats/inst/doc/MungeSumstats.html
      origin: sample_size.py:prepare_missing_sample_sizes
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - remove
        - median
        - mean
        - fail
    max_missing_fraction:
      default: 0.01
      help: |-
        What it does: Sets the largest fraction of variants allowed to have a missing configured
          case, control or total sample size. A row is counted once even when both case and control
          counts are missing.
        When it applies: Dataset step 04, after the complete input has been read and before genome
          build inference or chromosome splitting. The comparison is strictly greater-than, so a
          missing fraction exactly equal to this value is allowed.
        Values: A fraction from 0 to 1. The shipped value 0.01 permits the configured missing action
          only when at most 1% of variants are affected. Above the limit, the dataset stops with an
          error reporting the missing count, observed percentage and configured maximum.
        Example: At 0.01, 100 missing values among 10,000 variants are allowed; 101 stop the run.
        Note: This is an operational safety ceiling, not evidence that imputation below 1% is free
          of bias. Use remove unless preserving those variants is scientifically justified.
      origin: sample_size.py:prepare_missing_sample_sizes
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float

  # =================================================================
  # 12  dataset 07 / chromosome 06   BETA and SE reconstruction from Z
  # =================================================================
  effect_from_z:
    beta_z_sign_mismatch:
      default: reject
      help: |-
        What it does: Controls a directionally incompatible BETA and signed Z pair when PostGWAS
          must recover a missing standard error. A positive SE can satisfy Z=BETA/SE only when
          finite, non-zero BETA and Z have the same sign.
        When it applies: dataset step 07 first measures incompatible pairs across the complete
          study, and chromosome step 06 applies the row action only where SE is missing and a
          finite, non-zero Z is paired with an opposite-sign BETA or with BETA exactly zero. It
          does not inspect or replace populated study SE values, and it does not affect BETA=Z*SE
          or the Z-only approximation from EAF and Neff.
        Values:
          reject - remove each incompatible row before calculating SE and record the reason
            beta_z_sign_discordant when the complete-study fraction is at or below
            effect_from_z.max_beta_z_sign_mismatch_fraction. This is the shipped default.
          fail - stop the complete study during dataset step 07 on any incompatible row, with the
            affected count and an explanation that no positive SE can reproduce both supplied
            statistics. The same invariant stops a chromosome for direct callers that bypass the
            dataset step.
        Example: BETA=-0.2 and Z=-2 agree and produce SE=abs(-0.2/-2)=0.1. BETA=0.2 and Z=-2
          disagree; abs(0.2/-2) would hide the contradiction because BETA/0.1 is +2, not -2,
          so the row is rejected by default rather than assigned a fabricated SE.
        Scientific invariant: standard errors are non-negative and the signed Wald statistic is
          Z=BETA/SE. Warning-and-continue is deliberately unavailable because no positive value
          can satisfy directionally inconsistent supplied statistics.
        Scientific sources: GWAS Catalog summary-statistics format,
          https://www.ebi.ac.uk/gwas/docs/summary-statistics-format ; Stata's logistic-regression
          interpretation of the coefficient, standard error and signed Z statistic,
          https://www.stata.com/links/stata-basics/logistic-regression-1-introduction/
      origin: effect_from_z.py:_recover_positive_se_from_signed_z
      recommendation: reject
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [reject, fail]
    max_beta_z_sign_mismatch_fraction:
      default: 0.01
      help: |-
        What it does: Sets the largest complete-study fraction of directionally incompatible
          effect/Z pairs allowed to proceed to individual variant rejection. A positive SE can
          satisfy Z=BETA/SE only when harmonised BETA and signed Z have the same non-zero sign.
        When it applies: dataset step 07, once on the complete study and before chromosome
          partitioning or worker launch, when BETA (or odds ratio), signed Z and a missing SE are
          present. The denominator contains only rows with a finite valid effect and finite,
          non-zero Z that actually need SE recovery. Missing, unparseable and non-finite values,
          populated study SE cells and non-positive odds ratios cannot dilute the fraction.
        Values: A fraction from 0 to 1. A fraction equal to the limit continues; a strictly larger
          fraction stops the dataset. At or below the limit, every discordant row is removed and
          reported with reject reason beta_z_sign_discordant. The independent
          effect_from_z.beta_z_sign_mismatch='fail' option remains a stricter stop-on-any policy.
        Example: At the default 0.01, 100 discordant rows among 10,000 comparable missing-SE rows
          are rejected and the run continues. 101 discordant rows stop the study before chromosome
          processing and ask the operator to verify effect/Z mapping and allele orientation.
        Scientific basis: because SE is positive, Z=BETA/SE requires matching BETA and signed-Z
          directions. A rare mismatch can be isolated row corruption; more than 1% is treated as
          evidence of a systematic column, sign or allele-orientation problem rather than silently
          discarding a material subset.
      origin: effect_from_z.py:assess_beta_z_sign_discordance
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    x_chromosome_z_only_action:
      default: fail
      help: |-
        What it does: Controls the scientifically underdetermined case where chromosome X is present
          and the study supplies Z but supplies neither BETA nor SE.
        When it applies: Dataset preflight immediately after parsed-content validation, with the
          same invariant enforced again at chromosome step 06. It does not affect autosomes or the
          exact identities SE=abs(BETA/Z), after signed agreement, and BETA=Z*SE when either
          statistic was supplied.
        Values:
          fail - stop the dataset before chromosome workers start. This is the shipped default.
          allow_autosomal_assumption - explicitly apply the configured autosomal reconstruction
            using genotype variance 2*EAF*(1-EAF), with a prominent warning and VCF provenance.
        Why fail is default: pooled EAF and Neff do not identify male 0/1 versus 0/2 dosage coding,
          male/female sample composition, sex-specific allele frequencies, dosage compensation, or
          PAR status. The packaged chromosome normalization also maps PLINK 25/XY/PAR1/PAR2 to X,
          so this step deliberately does not guess a PAR exception.
        Safe alternatives: provide BETA, provide SE, or exclude X by setting both chromosome.allowed
          and chromosome.allowed_after_split to lists containing chromosomes 1 through 22 only.
          The override reproduces the previous numeric approximation; it is not an X-specific or
          guaranteed study-scale effect reconstruction.
        Scientific references: Clayton 2008, PMID 18441336,
          https://pubmed.ncbi.nlm.nih.gov/18441336/ ; PLINK 2 chromosome-X models,
          https://www.cog-genomics.org/plink/2.0/assoc ; Winkler et al. 2014 post-GWAS QC guidance,
          https://pmc.ncbi.nlm.nih.gov/articles/PMC4083217/
      origin: effect_from_z.py:enforce_x_chromosome_z_only_policy
      recommendation: fail
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [fail, allow_autosomal_assumption]
    method:
      default: metal_large_n
      help: |-
        What it does: Selects the equation used to reconstruct both BETA and SE when the input
          supplies Z but supplies neither statistic.
        When it applies: chromosome step 06 only when both BETA and SE are absent. It never changes
          supplied effects or the exact identities SE=abs(BETA/Z), after signed agreement, and
          BETA=Z*SE.
        Values:
          metal_large_n - use BETA=sigma_y*Z/sqrt(2*EAF*(1-EAF)*Neff) and
            SE=sigma_y/sqrt(2*EAF*(1-EAF)*Neff). This is the shipped default for large-N,
            sample-size-weighted Z results such as METAL output.
          zhu_2016 - use the Zhu et al. finite-sample adjustment by replacing Neff with Neff+Z^2
            in both denominators.
        Scale: sigma_y is 1 unless effect_from_z.phenotype_standard_deviation is explicitly set.
          Therefore the default output is an approximate standardized additive effect, not a
          recovered study coefficient. For a binary trait it is not a logistic log odds ratio or
          liability-scale effect.
        Scientific assumptions: EAF is the analysed-sample effect-allele frequency, Hardy-Weinberg
          additive genotype variance is 2*EAF*(1-EAF), Neff describes the same association test,
          and residual/phenotype scaling is adequately represented by sigma_y.
        References for sample-size-weighted meta-analysis and educational-attainment applications:
          Willer et al. 2010, METAL, PMID 20616382, https://pubmed.ncbi.nlm.nih.gov/20616382/
          Rietveld et al. 2013, PMID 23722424, https://pubmed.ncbi.nlm.nih.gov/23722424/
          Okbay et al. 2016, PMID 27225129, https://pubmed.ncbi.nlm.nih.gov/27225129/
          Lee et al. 2018, PMID 30038396, https://pubmed.ncbi.nlm.nih.gov/30038396/
        Reference for the Neff+Z^2 adjustment: Zhu et al. 2016, PMID 27019110,
          https://pubmed.ncbi.nlm.nih.gov/27019110/
      origin: effect_from_z.py:derive_effect_and_standard_error_from_z
      recommendation: metal_large_n
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [metal_large_n, zhu_2016]
    phenotype_standard_deviation:
      default: null
      help: |-
        What it does: Optionally multiplies both reconstructed BETA and SE by a known phenotype
          standard deviation, preserving Z=BETA/SE while expressing a quantitative-trait result in
          phenotype units.
        When it applies: chromosome step 06 only when both BETA and SE are absent. It is ignored when
          either statistic was supplied because those exact study-scale values take precedence.
        Values: null means sigma_y=1 and produces the standardized additive approximation. Otherwise
          provide a finite number greater than zero in the phenotype's units.
        Example: a value of 2 multiplies both the standardized BETA and SE by 2 without changing Z.
        Limitation: this rescaling does not recover a logistic-regression log odds ratio or a
          liability-scale effect for a binary trait.
      origin: effect_from_z.py:derive_effect_and_standard_error_from_z
      recommendation: null
      type: float
      validator:
        allow_none: true
        exclusive_minimum: true
        integer: false
        kind: num
        maximum: null
        minimum: 0.0
        number_kind: float
    minimum_effective_variance:
      default: 1.0
      help: |-
        What it does: Sets the minimum effective genotype-variance information proxy
          2*EAF*(1-EAF)*Neff required before both standardized BETA and SE may be reconstructed
          from a Z score.
        When it applies: chromosome step 06 only when the study supplied neither BETA nor SE. It
          does not filter variants whose effect statistics were supplied or recovered exactly from
          BETA/Z or Z/SE.
        Values: A non-negative number. Larger values reject more very-low-frequency or very-small-N
          rows. Zero disables this reliability floor, but the non-finite and positive-denominator
          invariants remain active and cannot be disabled.
        Example: EAF 1e-8 and Neff 100,000 give approximately 0.002 and fail the shipped minimum 1.0;
          EAF 0.01 and the same Neff give approximately 1,980 and pass.
        Scientific interpretation: this is a conservative reconstruction proxy, not an exact minor
          allele count, because Neff can differ from total N and EAF may come from a reference panel.
          Choose a stronger study-specific value when the source GWAS used a known MAC threshold.
      origin: effect_from_z.py:derive_effect_and_standard_error_from_z
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: null
        minimum: 0.0
        number_kind: float
    low_effective_variance_action:
      default: reject
      help: |-
        What it does: Chooses whether a row below effect_from_z.minimum_effective_variance is rejected
          with causal provenance or stops the chromosome.
        When it applies: chromosome step 06 after finite EAF, Z and Neff validation and before the
          configured reconstruction denominator is evaluated.
        Values:
          reject - remove each affected variant and record effect_from_z_low_effective_variance.
          fail - stop the chromosome with the affected count and configured minimum.
        Example: at the shipped minimum 1.0, a row with proxy 0.002 is written to the rejected file
          under reject; under fail the chromosome stops before any BETA or SE is calculated.
        Note: warning-and-continue is deliberately unavailable because it would knowingly emit an
          unreliable reconstructed statistic. Set the minimum explicitly to 0 to disable only the
          reliability floor while retaining the mandatory mathematical denominator guard.
      origin: effect_from_z.py:derive_effect_and_standard_error_from_z
      recommendation: reject
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [reject, fail]

  # =================================================================
  # 13  chromosome 10   the SE / BETA / Z gates
  # =================================================================
  validation:
    declaration_mismatch_action:
      default: warn
      help: |-
        What it does: Controls what happens when automatic inspection disagrees with an explicit
          effect type, p-value type, or delimiter declared in the sample sheet.
        When it applies: Dataset step 02 for delimiter and dataset step 07 for effect and p-value
          types. Detection still runs as an independent cross-check; the declared value remains
          authoritative when processing continues.
        Values:
          warn - print a bright-red terminal warning, record it in the canonical log and continue
            using the sample-sheet declaration.
          fail - print and record the same warning, then stop the dataset before chromosome work.
        Example: effect_type is beta but the detector reports odds_ratio. With warn, beta is used;
          with fail, the dataset stops so the declaration can be checked.
      origin: input_validation.py and study_properties.py
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [warn, fail]
    se_division_floor:
      default: 1.0e-12
      help: |-
        What it does: Sets the smallest positive standard error that can be used as the
          denominator when calculating Z = BETA / SE.
        When it applies: chromosome step 09 uses it as a calculation guard when producing
          Z = BETA / SE; chromosome step 10 applies validation.se_invalid once to finite standard
          errors at or below it. Step 09 leaves the calculated Z empty for an unsafe denominator
          but does not remove the row.
        Values: Any finite number greater than zero, on the same scale as the standard error.
      origin: z_score.py:derive_z_score_from_effect_and_standard_error; effect_validation.py:_validate_basic_effect_statistics
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: true
        integer: false
        kind: num
        maximum: null
        minimum: 0.0
        number_kind: float
    se_invalid:
      default: reject
      help: |-
        What it does: Decides what happens to a standard error that is missing, non-finite, or at
          or below validation.se_division_floor.
        When it applies: exactly once at chromosome step 10 whenever a standard-error column is
          present. If no standard-error column is present, the check is skipped and a warning says
          every variant passed this part of the gate untested.
        Values:
          reject - the variants are removed and written to the reject file under 'se_null',
            'se_non_finite' or 'se_non_positive', according to which of the three rules caught them.
          keep - they are counted and reported but left in the data; a Z that could not be calculated
            remains empty and is handled separately by validation.z_invalid.
          fail - the chromosome stops as soon as one variant matches.
        Example: an infinite supplied standard error is recorded under 'se_non_finite', not
          'se_non_positive'. Z-only reconstruction has an earlier mandatory denominator guard, but
          finiteness is still tested here before the 'greater than zero' rule because infinity passes
          a greater-than-zero test.
      origin: effect_validation.py:_validate_basic_effect_statistics
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - reject
        - keep
        - fail
    se_from_clipped_pval:
      default: reject
      help: |-
        What it does: Removes a variant whose standard error was computed from a p-value that had
          been clipped without an explicit scientifically named approximation policy, because
          that standard error is arithmetic, not evidence.
        When it applies: chromosome step 10, on rows carrying the SE-from-clipped-p-value marker
          set at step 08. A literal p=0 accepted through pvalue.zero_missing_se = approximate has
          its own marker and is not rejected here because the user explicitly selected it.
        Values:
          reject - remove the variant and record it as se_from_clipped_pval.
          keep - export it unchanged; nothing else will catch it.
          fail - stop the chromosome if any such variant exists.
        Example: p clipped to 0.999999999 gives norm.ppf(0.4999999995) = -1.25e-09, so beta 0.01
          yields SE about 7,978,846 - positive and finite, so the SE gates above pass it.
        Note: pvalue.out_of_range = clip and log-scale floor/cap handling can set the upstream
          clipping markers. Step 08 marks only rows whose SE was actually derived from those
          clipped values, so a valid supplied or Z-derived SE is not rejected by this rule.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - reject
        - keep
        - fail
    beta_invalid:
      default: reject
      help: |-
        What it does: Decides what happens to an effect size that is missing, infinite, or not a
          number.
        When it applies: exactly once at chromosome step 10 whenever an effect-size column is
          present. If no effect-size column is present, the check is skipped and a warning says
          every variant passed this part of the gate untested.
        Values:
          reject - the variants are removed and recorded under reason 'beta_invalid'.
          keep - they are counted and reported but left in the data.
          fail - the chromosome stops as soon as one variant matches.
        Example: with effect.or_non_positive set to 'keep', an odds ratio of 0 becomes log(0), which is
          minus infinity; under 'reject' that variant leaves at step 10 under 'beta_invalid'. A
          BETA column read as text with 41 cells holding '.' produces 41 empty values and the same
          outcome.
      origin: effect_validation.py:_validate_basic_effect_statistics
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - reject
        - keep
        - fail
    beta_zero:
      default: keep
      help: |-
        What it does: Decides what happens to an effect size of exactly zero.
        When it applies: exactly once at chromosome step 10, after the missing-or-non-finite BETA
          rule, so only genuine finite zeros reach it. Step 09 may calculate Z = 0 but applies no
          beta-zero policy.
        Values:
          keep - the variants stay; with a valid standard error an effect size of 0 is a legitimate
            null result giving a Z score of 0.
          reject - the variants are removed and recorded under reason 'beta_zero'.
          fail - the chromosome stops if any effect size is exactly zero.
        Example: a file that reports BETA to four decimal places writes a true effect of 0.00004 as
          0.0000. Under 'keep' it remains a valid null estimate; under 'reject' it is discarded.
        Note: 'keep' is the scientific default. Use 'reject' only when the study documentation says
          zero is a missing-value sentinel rather than an estimated null effect.
      origin: effect_validation.py:_validate_basic_effect_statistics
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - keep
        - reject
        - fail
    z_invalid:
      default: reject
      help: |-
        What it does: Decides what happens to a Z score that is missing, infinite, or not a number.
        When it applies: chromosome step 06, where BETA and SE depend on a study-supplied Z score,
          and exactly once for the final supplied or calculated Z at chromosome step 10. If no Z
          column is present at step 10, the check is skipped and a warning says every variant passed
          this part of the gate untested. Step 09 applies no z-invalid policy.
        Values:
          reject - the variants are removed and recorded under reason 'z_invalid'.
          keep - retain them only when effect statistics already exist. At step 06, when both BETA
            and SE depend on Z, unusable Z values are still rejected under z_invalid because no
            scientific statistic can be reconstructed.
          fail - the chromosome stops as soon as one variant matches.
        Example: a study supplying only a Z score, with 1,203 blank Z cells, loses those 1,203 at step
          06 under z_invalid before any BETA can be derived. Explicit keep does not defer those same
          rows to a misleading missing-BETA reason; it applies only where BETA/SE already exist.
      origin: effect_from_z.py:derive_effect_and_standard_error_from_z; effect_validation.py:_validate_basic_effect_statistics
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - reject
        - keep
        - fail
    beta_se_z_concordance:
      default: warn
      help: |-
        What it does: Compares a supplied Z score with BETA divided by SE, using the standard Wald
          statistic identity Z = BETA / SE.
        When it applies: chromosome step 10, after unusable BETA, SE and Z values have been handled.
          It needs all three columns. Agreement means |Z - BETA/SE| is no greater than
          beta_se_z_absolute_tolerance + beta_se_z_relative_tolerance * |BETA/SE|.
        Values:
          off - do not compare the statistics.
          warn - count and report discordant variants but retain them.
          reject - remove discordant variants and record reason 'beta_se_z_discordant'.
          fail - stop the chromosome when any discordant variant is found.
        Example: BETA = 0.2 and SE = 0.1 imply Z = 2.0. A supplied Z of 5.0 is discordant under the
          default tolerances; a supplied Z of 2.01 is retained as compatible with rounding.
        Note: warn is the scientific default because published summary statistics are often rounded.
          A warning should be investigated before changing the action to reject or fail.
      origin: effect_validation.py:_beta_se_z_concordance
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: ['off', warn, reject, fail]
    beta_se_z_absolute_tolerance:
      default: 0.01
      help: |-
        What it does: Sets the fixed rounding allowance for the BETA/SE versus Z comparison.
        When it applies: chromosome step 10 when validation.beta_se_z_concordance is enabled.
        Values: A non-negative Z-score difference. It is combined with the relative tolerance rather
          than used alone, so comparisons remain useful near Z = 0 and for large absolute Z scores.
        Example: with absolute tolerance 0.01 and relative tolerance 0.01, an expected Z of 2.0 may
          differ by at most 0.03.
      origin: effect_validation.py:_beta_se_z_concordance
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: null
        minimum: 0.0
        number_kind: float
    beta_se_z_relative_tolerance:
      default: 0.01
      help: |-
        What it does: Sets the proportional rounding allowance for the BETA/SE versus Z comparison.
        When it applies: chromosome step 10 when validation.beta_se_z_concordance is enabled.
        Values: A non-negative fraction of |BETA/SE|. The default 0.01 means one percent, in addition
          to the configured absolute tolerance.
        Example: for expected Z = 10, the default relative contribution is 0.1 and the total allowed
          difference is 0.11 after adding the default absolute tolerance.
      origin: effect_validation.py:_beta_se_z_concordance
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: null
        minimum: 0.0
        number_kind: float
    z_pval_concordance:
      default: warn
      help: |-
        What it does: Compares the p-value implied by each variant's Z score with the p-value the study
          actually reports, and acts when the two disagree.
        When it applies: chromosome step 10, after the SE, BETA and Z rules. It needs both a Z-score
          column and a p-value column. Missing columns are logged as an untested check; missing numpy
          or scipy stops the chromosome because an enabled scientific check must not silently skip.
          How much disagreement is allowed is set by validation.z_pval_tolerance_log10.
        Values:
          off - the comparison is not made at all; nothing is computed.
          warn - discordant variants are counted and reported, and nothing is removed.
          reject - discordant variants are removed and recorded under reason 'z_pval_discordant'.
          fail - the chromosome stops if a single variant is discordant.
        Example: a variant with Z = 1.96 implies a two-sided p of 0.05. If the file reports 1e-8 for
          it, the two disagree by 6.7 orders of magnitude, far beyond the default tolerance of 1.0, so
          the variant is flagged.
        Note: warn is the scientific default because this one check catches a fabricated standard
          error, a clipped p-value and a misread effect type without silently removing data. The
          comparison assumes the reported p-value is two-sided.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - 'off'
        - warn
        - reject
        - fail
    z_pval_tolerance_log10:
      default: 1.0
      help: |-
        What it does: Sets how far the p-value implied by the Z score may differ from the reported
          p-value before a variant counts as discordant.
        When it applies: chromosome step 10, and only when validation.z_pval_concordance is set to
          something other than 'off'.
        Values: Orders of magnitude on the -log10 p scale. 1.0 tolerates a factor of ten between the
          two p-values; larger values tolerate more and flag fewer variants, smaller values are
          stricter, and 0 flags any difference at all. The ceiling is 100, which in practice switches
          the check off.
        Example: Z = 5.0 implies a two-sided p of 5.7e-07, which is 6.24 on the -log10 scale. A
          reported p of 1e-07 (7.00) is 0.76 away and passes at 1.0; a reported p of 1e-09 (9.00) is
          2.76 away and is flagged.
        Note: a p-value column that is one-sided rather than two-sided disagrees by exactly
          log10(2) = 0.30 for every single variant, which the default 1.0 hides. Do not tighten below
          0.3 unless you know the column is two-sided.
      origin: new
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 100.0
        minimum: 0.0
        number_kind: float
    warn_reject_fraction:
      default: 0.2
      help: |-
        What it does: Sets the share of a chromosome's variants that the effect-statistics gate may
          remove before it prints a prominent warning.
        When it applies: chromosome step 10, once, at the end of the step. The share counted is what
          step 10 alone removed out of what entered step 10 - variants removed by earlier steps do not
          count towards it.
        Values: A share of the variants entering the step. Lowering it warns more often; 0 warns
          whenever a single variant is removed. 1.0 can never be exceeded, so it never warns.
        Example: 900,000 variants enter step 10 and 200,000 are removed, which is 22.22% and above the
          default 0.2, so a warning naming validation.warn_reject_fraction is printed and the run
          continues. Had 150,000 been removed (16.67%) nothing would be printed.
        Note: this must not be set above validation.max_reject_fraction. The policy loader refuses that
          combination, because the run would fail before the warning could ever be printed.
      origin: new
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    max_reject_fraction:
      default: 0.95
      help: |-
        What it does: Sets the share of a chromosome's variants that the effect-statistics gate may
          remove before the chromosome is failed outright.
        When it applies: chromosome step 10, once, at the end of the step and tested before the warning
          threshold. As with the warning, the share is what step 10 alone removed out of what entered
          step 10 - removals by earlier steps do not count towards it.
        Values: A share of the variants entering the step. Lowering it fails sooner; 0 fails as soon as
          one variant is removed. The shipped 0.95 permits removal of exactly 95% but fails when more
          than 95% are removed. Setting it to 1.0 disables this hard stop because the share removed can
          never exceed all variants.
        Example: with 1,000,000 variants entering step 10 and 960,000 removed, the chromosome
          stops with an error pointing you at the study-level effect-type and p-value-type DECIDE
          lines. With 950,000 removed it continues after the warning because the runtime comparison is
          strictly greater than the configured threshold.
        Note: This is a catastrophic-loss safeguard, not a general GWAS quality threshold. A study that
          intentionally needs warning-only behaviour can explicitly set the value to 1.0.
      origin: new
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    on_ambiguous_column_mapping:
      default: fail
      help: |-
        What it does: Decides what happens when two configuration keys point at the same column of the
          input file.
        When it applies: Twice. At dataset step 02 the header check reports it, and 'fail' makes that
          report an error that stops the run there. At dataset step 03, when the file is actually read,
          'fail' raises again and names both configuration keys.
        Values:
          fail - reported as an error, so the run stops at the header check, and the read refuses too.
          warn - reported as a warning, the column is read once, and the run continues.
        Example: a config with beta_or_col: Z and imp_z_col: Z both naming the column 'Z'. Before this
          setting existed the run died with a polars "duplicate output name 'Z'" error that named the
          column and not the two configuration keys; now the message names beta_or_col and imp_z_col.
      origin: summary_statistics_io.py:read_summary_statistics
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - fail
        - warn
    fuzzy_match_cutoff:
      default: 0.6
      help: |-
        What it does: Sets how similar a column name in the file must be to a name in the configuration
          before it is offered as a 'did you mean' suggestion.
        When it applies: Only once a configured column name has already been found to be absent - at
          dataset step 01 for a column named inside an external frequency or imputation-quality file,
          and at dataset step 02 for the main header check. It changes the wording of the error message
          only; no variant and no run outcome depends on it. A name that differs only in capitalisation
          or surrounding spaces is matched by a separate rule and never reaches this cutoff.
        Values: A similarity score between 0 and 1. Lower values suggest a name even when it is barely
          alike; 1 suggests only an exact match, which by definition cannot exist here, so the message
          falls back to listing the columns the file does have.
        Example: the config says 'EAF' and the file has 'EAF_A1', a similarity of 0.67. At the default
          0.6 the message reads "Closest match in file: 'EAF_A1'"; at 0.7 it reads "No similar column
          name." instead.
        Note: the comparison is case-sensitive, so 'BETA' against a file column 'beta_1' scores 0 and
          no suggestion appears at any cutoff. Lowering this setting will not help there.
      origin: new
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    on_duplicate_header:
      default: fail
      help: |-
        What it does: Decides what happens when the header line carries the same column name twice.
        When it applies: dataset step 02, the header check, before a single line of data is read.
        Values:
          fail - the repeated name is reported as an error and the run stops at the header check.
          warn - it is reported as a warning and the run continues, silently using the first of the
            two columns.
        Example: a file whose header contains 'P' twice is read by polars as 'P' and 'P_duplicated_0',
          so a config with pval_col: P quietly gets whichever 'P' came first. At 'fail' the run stops
          and names the column; at 'warn' it goes ahead with the first one.
        Note: the step-03 read notices this too - summary_statistics_io.py matches the
          '_duplicated_<n>' suffix polars actually writes, names every renamed column, and applies this
          same setting. There is no separate hidden duplicate-count threshold.
      origin: summary_statistics_io.py:load_summary_statistics_table
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - fail
        - warn

  # =================================================================
  # 14  dataset 03/08 / chromosome 11   imputation quality
  # =================================================================
  info:
    multi_value_delimiter:
      default: ','
      help: |-
        What it does: Defines the single literal character separating multiple study INFO values
          within one variant cell.
        When it applies: dataset step 03 when the selected internal INFO column is inspected and
          parsed before duplicate validation.
        Values: exactly one character. The shipped comma matches inputs such as '0.9,0.7'.
        Note: this is independent of the summary-statistics table delimiter. Set it only when the
          INFO cell itself uses another documented separator.
      origin: summary_statistics_io.py:normalise_imputation_quality_column
      recommendation: null
      type: str
      validator:
        allow_none: false
        description: one INFO-list separator character outside numeric syntax
        kind: text
        pattern: '^[^0-9.eE+\s-]$'
    multi_value_aggregation:
      default: median
      help: |-
        What it does: Selects how a delimiter-separated list of study INFO values in one variant row
          is reduced to the single scalar INFO value required by downstream harmonisation.
        When it applies: dataset step 03, after configured numeric parsing and before duplicate
          validation, so the resulting scalar can participate in duplicates.selection_order.
        Values:
          median - use the unweighted row-wise median of finite non-missing values. This is the
            shipped compatibility default and is robust to one extreme cohort value.
          mean - use the unweighted row-wise arithmetic mean of finite non-missing values.
          fail - stop and require the user to supply one already-combined scalar INFO value.
        Scientific limitation: median and mean give every listed cohort equal influence. PostGWAS
          does not guess sample-size weights because the current input contract has no ordered
          cohort-by-cohort N vector to pair with the ordered INFO values. Use fail when equal cohort
          influence is unsuitable, then calculate an appropriate scalar upstream from documented,
          comparable cohort metrics and matching per-variant cohort sample sizes.
        Provenance: the selected policy, source column, number of affected rows, ignored missing or
          invalid tokens, and generated scalar column are written to the canonical log and VCF
          metadata. The original input text remains in rejected-variant source provenance.
        Scientific sources: GWAS-SSF defines INFO as one numeric value between 0 and 1
          (https://www.ebi.ac.uk/gwas/docs/summary-statistics-format). Imputation-aware GWAS
          meta-analysis uses both study size and imputation information when weighting study
          evidence (https://pmc.ncbi.nlm.nih.gov/articles/PMC2782358/); those weights cannot be
          reconstructed from an unlabelled INFO list alone.
      origin: summary_statistics_io.py:normalise_imputation_quality_column
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - median
        - mean
        - fail
    multi_value_output_column:
      default: __postgwas_multi_value_info
      help: |-
        What it does: Names the collision-checked internal Float64 column that receives the scalar
          result selected by info.multi_value_aggregation.
        When it applies: dataset step 03 only when the selected internal INFO column contains at
          least one row using info.multi_value_delimiter and aggregation is not fail.
        Values: a reserved PostGWAS working-column name beginning with '__postgwas_'. The run stops
          rather than overwriting an input column with the same name.
        Example: with INFO='0.9,0.7' and the median default, the shipped column contains 0.8 and is
          used for duplicate ranking, INFO type resolution, chromosome validation and VCF export.
        Note: changing this name changes internal storage and provenance labels only; it does not
          change the aggregation result.
      origin: summary_statistics_io.py:normalise_imputation_quality_column
      recommendation: null
      type: str
      validator:
        allow_none: false
        description: a reserved PostGWAS working column beginning with __postgwas_
        kind: text
        pattern: '^__postgwas_[A-Za-z0-9_]+$'
    multi_value_invalid_token_action:
      default: ignore
      help: |-
        What it does: Decides how multi-value INFO aggregation handles a non-missing token that
          is not a finite number.
        When it applies: dataset step 03 only when info.multi_value_aggregation is median or mean.
        Values:
          ignore - omit invalid tokens, report their token and row counts, and aggregate any valid
            finite values remaining in the row; a row with none becomes missing and later follows
            info.on_missing.
          fail - stop the dataset before duplicate validation and report the invalid token and row
            counts, so the source can be corrected.
        Missing tokens from input.null_values and the shared missing-value vocabulary are not
          invalid and are omitted under both actions.
      origin: summary_statistics_io.py:normalise_imputation_quality_column
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - ignore
        - fail
    score_type:
      default: auto
      help: |-
        What it does: Declares the numerical meaning of the selected imputation-quality column, or
          asks PostGWAS to resolve it once from the complete selected source before chromosome fan-out.
        When it applies: dataset step 08, after the internal, external, or fixed INFO source has been
          resolved and before any chromosome worker starts. Every chromosome receives the same decision.
        Values:
          auto - standard_info when fewer than info.auto_mach_rsq_fraction of finite values are above
            info.clip_tolerance and no higher than info.mach_rsq_max; otherwise mach_rsq.
          standard_info - use the standard 0-to-info.clip_tolerance INFO window and rescale only the
            configured rounding-tolerance band down to info.clip_max.
          mach_rsq - accept MaCH Rsq values through info.mach_rsq_max without rescaling values above 1.
        Safety: under every choice, the run stops before fan-out when the fraction above
          info.mach_rsq_max exceeds info.maximum_invalid_fraction. An explicit choice overrides type
          detection, not gross-invalid-value validation.
        Example: with the shipped thresholds, one value of 1.5 among ten million finite rows does not
          change the dataset to mach_rsq; that row is handled as out of range under standard_info. A
          file with at least 0.1% of finite values in (1.05, 2] resolves to mach_rsq and those values
          are retained. A fraction strictly above 0.1% with values above 2 stops the dataset.
        Limitation: a genuine MaCH Rsq source whose observed values all lie within the standard-INFO
          tolerance is numerically indistinguishable from standard INFO. Declare mach_rsq explicitly
          when the source metadata establishes that scale and the distribution supplies no evidence.
        Scientific sources: the GWAS Catalog standard-format INFO field is bounded from 0 to 1
          (https://www.ebi.ac.uk/gwas/docs/summary-statistics-format). PLINK documents MaCH Rsq with an
          accepted upper range of 2 (https://www.cog-genomics.org/plink/2.0/filter), and REGENIE
          distinguishes MaCH Rsq from IMPUTE INFO
          (https://rgcgithub.github.io/regenie/options/).
      origin: imputation_quality.py:resolve_dataset_info_score_type
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - auto
        - standard_info
        - mach_rsq
    out_of_range:
      default: reject
      help: |-
        What it does: Decides what happens to an imputation quality score outside the allowed window.
        When it applies: chromosome step 11. The upper boundary is info.clip_tolerance for
          standard_info and info.mach_rsq_max for mach_rsq. Standard-INFO rounding overshoot between
          info.clip_max and info.clip_tolerance is rescaled before this action.
        Values:
          null - the score is blanked and info.on_missing (default 'keep') decides whether the
            variant remains. If info.on_missing later rejects it, the rejected row retains
            'info_out_of_range' as its original scientific reason, with the two-policy action chain
            recorded in reject_detail.
          reject - the variant is removed with the reject reason 'info_out_of_range'.
          fail - the chromosome stops with an error giving the count and the window.
        Example: under standard_info, 1.02 is rounding tolerance and becomes 1.0, while 1.5 is rejected.
          Under mach_rsq, 1.5 is retained and a value above info.mach_rsq_max is rejected. A value such
          as 87 is never converted into a perfect score.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - 'null'
        - reject
        - fail
    clip_min:
      default: 0.0
      help: |-
        What it does: Sets the lowest imputation quality score the pipeline treats as legitimate.
        When it applies: chromosome step 11 (imputation quality), on every run, whether the score
          came from the study's own column or from a reference file.
        Values: A higher floor sends more low scores into the out-of-range branch. Same units as the
          score, so 0.0 is the natural floor. It must be below info.clip_max.
        Example: with clip_min 0.0, a score of -0.02 - a rounding artefact that turns up in older
          r2 files - is below the floor. At the 'reject' default it leaves the data and is written
          to the rejected-variants file with the reason 'info_out_of_range'.
        Note: there is deliberately no equivalent of the frequency step's "degenerate" check here.
          A score of exactly 0 is meaningless but not fatal, so it is kept and only removed later
          by modules.qc_summary.rules.info_min (0.7 by default) in the post-merge QC assessment.
      origin: new
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    clip_max:
      default: 1.0
      help: |-
        What it does: Sets the theoretical standard-INFO ceiling and the value to which permitted
          rounding overshoot is rescaled.
        When it applies: chromosome step 11 only when the resolved score type is standard_info.
        Values: Same units as the score. It must be above info.clip_min and no higher than
          info.clip_tolerance.
        Example: with clip_max 1.0 and clip_tolerance 1.05, 0.98 passes and 1.02 becomes 1.0. This
          setting does not cap mach_rsq values.
      origin: new
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 100.0
        minimum: 0.0
        number_kind: float
    clip_tolerance:
      default: 1.05
      help: |-
        What it does: Sets the standard-INFO rounding-tolerance ceiling and the boundary separating
          standard INFO evidence from possible MaCH Rsq evidence during automatic detection.
        When it applies: dataset step 08 for automatic detection and chromosome step 11 when the
          resolved score type is standard_info. It must be at least info.clip_max and below
          info.mach_rsq_max.
        Values: A larger tolerance permits and rescales more standard-INFO overshoot; a smaller one
          sends more values to info.out_of_range or into the MaCH-evidence fraction.
        Example: with clip_max 1.0 and clip_tolerance 1.05, a score of 1.02 is set to 1.0 and
          counted as rounding tolerance under standard_info. A score of 1.4 is possible MaCH Rsq
          evidence during auto detection and is out of range only when standard_info is resolved.
      origin: new
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 100.0
        minimum: 1.0
        number_kind: float
    mach_rsq_max:
      default: 2.0
      help: |-
        What it does: Sets the largest value accepted when info.score_type resolves to mach_rsq and
          the gross-invalid boundary used for every score type.
        When it applies: dataset step 08 for the fraction-above-maximum guard and chromosome step 11
          as the mach_rsq upper bound.
        Values: Must be greater than info.clip_tolerance. This is configurable because no scientific
          threshold is embedded in module code.
        Example: with 2.0, a chromosome-X MaCH Rsq of 1.5 is retained unchanged, while 2.1 is invalid.
        Scientific source: PLINK 2 documents its MaCH Rsq filter with an upper accepted value of 2:
          https://www.cog-genomics.org/plink/2.0/filter
      origin: imputation_quality.py:resolve_dataset_info_score_type
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: true
        integer: false
        kind: num
        maximum: 100.0
        minimum: 0.0
        number_kind: float
    auto_mach_rsq_fraction:
      default: 0.001
      help: |-
        What it does: Requires dataset-level agreement before automatic detection selects mach_rsq.
        When it applies: only when info.score_type is auto. The numerator is finite values above
          info.clip_tolerance and no higher than info.mach_rsq_max; the denominator is every finite
          numeric value in the selected complete INFO source.
        Values: A fraction from 0 to 1. Selection uses greater than or equal to this value.
        Example: 0.001 means at least 0.1%. One value of 1.5 in ten million rows is 0.00001%, so it
          cannot flip every chromosome to mach_rsq.
      origin: imputation_quality.py:resolve_dataset_info_score_type
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: true
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    maximum_invalid_fraction:
      default: 0.001
      help: |-
        What it does: Stops a dataset when too many finite INFO-source values exceed
          info.mach_rsq_max, which is evidence of a mis-mapped or incompatible column.
        When it applies: dataset step 08 under auto, standard_info, and mach_rsq. The denominator is
          every finite numeric value in the complete selected source. The run stops only when the
          observed fraction is strictly greater than this setting.
        Values: A fraction from 0 to 1. Values at or below the configured fraction continue to the
          chromosome range action; the shipped info.out_of_range=reject removes those rows.
        Example: with 0.001, exactly 0.1% above 2 does not stop the dataset, but 0.1001% does.
      origin: imputation_quality.py:resolve_dataset_info_score_type
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    low_quality_threshold:
      default: 0.3
      help: |-
        What it does: Sets the score at or below which a variant is counted and reported as poorly
          imputed.
        When it applies: chromosome step 11, on every run. It is a reporting threshold only - no
          variant is changed, blanked or removed because of it.
        Values: A higher threshold puts more variants in the "poor imputation" tally and fewer in
          the "good" one; a lower threshold does the reverse. Same units as the score.
        Example: with 0.3, a variant scoring 0.25 is added to the poorly-imputed count in the step
          log and the QC summary, but keeps its score and stays in the data. It disappears only
          later, if modules.qc_summary.rules.info_min (0.7 by default) drops it in the post-merge QC assessment.
        Note: this is not the removal cutoff, and the two shipped values disagree - 0.3 here
          against modules.qc_summary.rules.info_min 0.7 - so the count reported at step 11 is far smaller than
          the number of variants actually thrown away later. Set it to 0.7 if you want the
          harmonisation report to predict what the filter will do.
      origin: new
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    on_missing:
      default: keep
      help: |-
        What it does: Decides what happens to a variant that still has no imputation quality score
          after the range handling has run.
        When it applies: chromosome step 11, after info.out_of_range has been applied - so a score
          that info.out_of_range blanked out with 'null' is counted as missing here as well.
        Values:
          keep - the variant stays with an empty score; the log records the count and says the
            removal happens later at modules.qc_summary.rules.missing_info_action, which is 'remove' by default.
          reject - a variant whose INFO was originally absent is removed with reason 'info_missing'.
            A value made missing by info.out_of_range='null' is removed with reason
            'info_out_of_range', preserving its original scientific cause.
          fail - the chromosome stops with an error giving the number of variants affected.
        Example: a study with no INFO column, matched against a reference that covers 96% of its
          variants, leaves 4% with an empty score. Under 'keep' all of them go through to the VCF
          and are dropped later by modules.qc_summary.rules.missing_info_action; under 'reject' they leave here and appear
          by name in the rejected-variants file, so you can see which ones went.
        Note: imputation quality is deliberately left out of the final completeness gate at step
          14, so 'keep' really does carry an empty score through the rest of harmonisation - it
          is not caught anywhere before the post-merge QC assessment.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - keep
        - reject
        - fail
    source:
      default: auto
      help: |-
        What it does: Chooses where each variant's imputation quality score comes from.
        When it applies: chromosome step 11, at the very start, before any score is read.
        Values:
          auto - use the study's own imputation quality column when it has one, otherwise use the
            external file, otherwise use an explicitly supplied --fixed-info value.
          study - insist on the study's own column; the chromosome stops with an error if the
            study has none.
          reference - ignore any study column and take every score from the reference file.
          external - accepted, but behaves exactly like 'reference'; the code does not tell the
            two apart.
        Example: a study whose imp_info_col is 'INFO' runs under 'auto' without opening a
          reference at all. The same study under 'reference' matches against
          <info_file>_chr7.tsv.gz - falling back to the single whole-genome file, then to the
          pipeline's own default - on CHROM, POS, ALT and REF, then retries the variants that did
          not match with REF and ALT the other way round, and keeps the first score found.
        Note: under 'reference' or 'external', if the study frame already has a column with the
          same name as the reference's score column, that column is overwritten. The step warns
          when this happens, but the study's own values are gone. The normal CLI resolves the
          sample-sheet precedence before chromosome work, and that explicit dataset-level result
          has final priority; this policy remains available to direct engine callers that have not
          supplied a resolved info_source.
      origin: imputation_quality.py
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - auto
        - study
        - reference
        - external

  # =================================================================
  # 15  chromosome 13   final completeness gate
  # =================================================================
  final_check:
    require:
      default:
      - chr
      - pos
      - eaf
      - beta
      - se
      - zscore
      - pval
      help: |-
        What it does: Lists the fields that must hold a usable value in every exported variant.
        When it applies: chromosome step 13, the last gate before the file is written. Each field is
          resolved to a real column name through the configuration. If a required column is absent
          entirely, the chromosome fails immediately because every variant lacks that field;
          final_check.on_missing applies only when the column exists.
        Values: Field names from the pipeline's vocabulary - the coordinates (chr, pos), the variant
          identifier and alleles (snp, ea, oa), and the statistics (eaf, beta, se, zscore, pval, info,
          n). Order matters: the fields are checked one at a time in the order given, and a variant
          missing three of them is rejected under the first, which is what keeps every variant
          appearing exactly once in the reject file. Every selectable field has its own registered
          rejection reason, including snp, ea, oa, info and n.
        Example: with the shipped list, a variant that has neither an EAF nor an SE is rejected under
          'final_missing_eaf' only, because eaf comes before se; swap the two entries and the same
          variant is rejected under 'final_missing_se' instead.
        Note: imputation quality is left out on purpose - it is governed by info.on_missing at
          chromosome step 11 and by the filter stage later, not by this gate.
      origin: new
      recommendation: null
      type: list
      validator:
        allow_empty: true
        item:
          allow_none: false
          kind: enum
          members:
          - chr
          - pos
          - snp
          - ea
          - oa
          - eaf
          - beta
          - se
          - zscore
          - pval
          - info
          - n
        kind: list
        unique: true
        upper: false
    treat_as_missing:
      default:
      - 'null'
      - nan
      - inf
      help: |-
        What it does: Lists what counts as a missing value at the final gate, beyond an empty cell.
        When it applies: chromosome step 13, applied to every field named in final_check.require.
        Values:
          null - an empty cell.
          nan - a not-a-number float, and the text spellings nan, -nan and +nan.
          inf - an infinite float, and the text spellings inf, -inf, +inf, infinity, -infinity and
            +infinity.
          The order of this list does not matter. The order of final_check.require DOES: fields are
          tested one at a time in that order, so a variant missing several is attributed to the first.
        Example: a variant whose SE came out infinite from a degenerate frequency is removed as
          final_missing_se, exactly as one with an empty SE cell would be.
        Note: text spellings are only matched for numeric fields; 'inf' is a plausible allele.
      origin: new
      recommendation: null
      type: list
      validator:
        allow_empty: false
        item:
          allow_none: false
          kind: enum
          members:
          - 'null'
          - nan
          - inf
        kind: list
        unique: true
        upper: false
    on_missing:
      default: reject
      help: |-
        What it does: Decides what happens to a variant that is missing one of the required fields at
          export time.
        When it applies: chromosome step 13, for missing values inside each existing column listed in
          final_check.require. An entirely absent required column always fails immediately because it
          is a dataset-level schema error rather than an isolated missing value.
        Values:
          reject - the variant is removed and recorded under the reason for that field, for example
            'final_missing_se' or 'final_missing_pval'.
          keep - the missing values are counted and reported, and the variant is exported anyway.
          fail - the chromosome stops at the end of the step with a tally of how many variants were
            missing each field.
        Example: with the shipped list of required fields, a variant that reaches step 13 with an empty
          EAF is written to the reject file under 'final_missing_eaf' and never reaches the VCF; under
          'keep' it is exported with an empty EAF.
        Note: 'keep' lets a variant into the exported file with an empty or infinite value in a field
          that every downstream tool expects, and step 13 is the last gate, so nothing after it will
          catch that.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - reject
        - keep
        - fail

  # =================================================================
  # chromosome 15-16 and the merge   VCF conversion and liftover
  # =================================================================
  vcf:
    liftover_swap:
      default: exclude
      help: |-
        What it does: Decides whether a successfully lifted record marked as allele-swapped or
          reference-added by the bcftools liftover plugin is excluded or retained. PostGWAS always
          validates and passes the allele-frequency and signed-effect tags that the plugin must
          harmonise; tag correction is not a separate user policy.
        When it applies: chromosome step 16 (annotate and lift over), after the plugin has rewritten
          ALT-dependent frequency, effect-size and Z-score fields and before target-build
          normalization.
        Values:
          exclude - count and then remove every successfully harmonised record marked SWAP=1 or
            SWAP=-1. This remains the shipped default for continuity but deliberately reduces the
            target-build result.
          keep - retain those successfully harmonised records. AF fields describe the resulting ALT,
            while FORMAT/ES and FORMAT/EZ describe the effect of that ALT.
        Example: a variant that was A/G on GRCh37 but whose GRCh38 reference base is G comes back
          as G/A. If the source ALT frequency was 0.3, the plugin rewrites the biallelic frequency
          to 0.7 and reverses ES and EZ. Under exclude the corrected record is counted and removed;
          under keep the corrected record remains in the target-build VCF.
        Note: Recommended: keep when complete target-build retention is required. Under exclude,
          PostGWAS records swapped, reference-added and policy-excluded counts separately from true
          plugin rejections, so the configured historical loss is never silent.
      origin: vcf_processing.py:annotate_and_liftover_vcf
      recommendation: keep
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - exclude
        - keep
    liftover_warn_fraction:
      default: 0.1
      help: |-
        What it does: Sets the share of records rejected by the liftover plugin above which the step
          logs a notice. Policy-excluded SWAP records are counted separately and do not enter this rate.
        When it applies: chromosome step 16 (annotate and lift over), after the liftover, and only
          when bcftools could count both the variants entering the liftover and the ones in the
          not-lifted file. It is consulted only if the rate is not already above
          vcf.liftover_critical_fraction, which produces its own louder message instead.
        Values: A larger share means the notice appears only after heavier loss; a smaller one
          makes it appear sooner. Expressed as a share of the variants entering the liftover, so
          0.1 is 10%. Set it to 0 to be told whenever a single variant is rejected.
        Example: 1,000,000 variants enter the liftover and 120,000 land in the not-lifted file.
          That is 12% - above 0.10 but below 0.30 - so the log reports that more than 10% were
          rejected by the plugin and the run continues.
        Note: this notice and the critical warning are mutually exclusive; a rate above
          vcf.liftover_critical_fraction produces only the louder message. Setting this above 0.3
          therefore means you never see a notice at all.
      origin: vcf_processing.py:annotate_and_liftover_vcf
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    liftover_critical_fraction:
      default: 0.3
      help: |-
        What it does: Sets the plugin-rejection share at which the log message changes from a mild
          notice to a loud warning.
        When it applies: chromosome step 16 (annotate and lift over), after the liftover, and only
          when bcftools could count both the variants entering the liftover and the ones in the
          not-lifted file. If either count is unreadable, the plugin-rejection check is skipped
          and the step says so.
        Values: A larger share means the loud wording appears only after heavier loss; a smaller
          one raises it sooner. Expressed as a share of the variants entering the liftover, so 0.3
          is 30%. Setting it at or below vcf.liftover_warn_fraction makes the milder notice
          unreachable.
        Example: 1,000,000 variants enter the liftover on chromosome 2 and 350,000 land in the
          not-lifted file. That is 35%, above 0.30, so the log reports that more than 30% were
          rejected by the plugin. At 150,000 (15%) it reports the milder notice instead.
        Note: 'critical' only changes the wording - both messages are recorded at the same warning
          level and neither stops anything. Use vcf.liftover_fail_fraction if you want a share of
          plugin rejections to actually halt the chromosome.
      origin: vcf_processing.py:annotate_and_liftover_vcf
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    liftover_fail_fraction:
      default: 0.5
      help: |-
        What it does: Sets the share of plugin-rejected records above which the chromosome is abandoned
          instead of carrying on with whatever survived.
        When it applies: chromosome step 16 (annotate and lift over), just after the two warning
          thresholds, and only when bcftools could count both the variants entering the liftover
          and the ones in the not-lifted file.
        Values: A smaller share stops the chromosome sooner; a larger one tolerates more loss.
          Expressed as a share of the variants entering the liftover. The default 0.50 permits
          up to and including 50% plugin rejection; a larger fraction stops the chromosome.
        Example: with 0.50, a chromosome where the plugin rejects 600,000 of 1,000,000 variants
          (60%) stops with a liftover-failure error and produces no lifted VCF for that
          chromosome; at 400,000 (40%) it carries on and only logs the critical warning.
        Note: A required target-build VCF with zero surviving variants always fails independently
          of this threshold. Records discarded by vcf.liftover_swap = 'exclude' are reported through
          swap_excluded rather than being mislabeled as coordinate-mapping failures.
      origin: vcf_processing.py:annotate_and_liftover_vcf
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    variant_drop_warn_fraction:
      default: 0.2
      help: |-
        What it does: Sets how large a fall in variant count between two consecutive bcftools
          stages is worth a warning.
        When it applies: chromosome step 16 (annotate and lift over), after each stage of the
          bcftools pipeline - normalisation, ID annotation, reference-frequency annotation,
          consequence annotation and the liftover itself. A stage whose variant count could not be
          read is skipped, with a note saying the check did not run.
        Values: A larger share means only heavier losses are flagged; a smaller one flags more.
          Expressed as a share of the previous stage's count, so 0.2 is 20%. Set it to 0 to be
          warned about any fall at all.
        Example: 1,000,000 variants before normalisation and 700,000 after is a 30% fall, above
          0.2, so the chromosome log gets "WARNING: >20% variant drop at NORM" and the NORM entry
          in the QC record is marked as a warning. A fall to 850,000 (15%) is recorded but not
          flagged.
        Note: each stage is compared only with the one immediately before it, never with the
          starting count, so five consecutive 15% falls - which leave you with 44% of the variants
          you started with - never trigger a single warning. The cumulative loss is printed in the
          log as "Δorig", but nothing checks it.
      origin: vcf_processing.py:104
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: false
        kind: num
        maximum: 1.0
        minimum: 0.0
        number_kind: float
    min_valid_size_bytes:
      default: 100
      help: |-
        What it does: Sets the file size below which a per-chromosome VCF is treated as empty and
          left out of the merge.
        When it applies: post-merge step 01 (concatenate the per-chromosome VCFs), as each
          candidate file is checked. The size test runs before the missing-index test, so a
          too-small file is never even indexed.
        Values: A larger threshold excludes more suspiciously small files from the merge; 0 lets
          every existing file through on size and leaves only the missing-file and
          cannot-be-indexed checks. Measured in bytes on the compressed .vcf.gz.
        Example: a 48-byte chromosome 21 VCF left behind by a crashed run is marked as an invalid
          required input. With the default vcf.on_merge_failure: fail, that output group is not
          merged and the dataset stops before QC.
        Note: 100 bytes is small enough that a truncated file from an earlier attempt is usually
          larger than it and reaches the merge anyway, which is why the outputs are cleaned before
          a retry rather than being relied on to be caught here.
      origin: vcf_processing.py:374
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 0
        number_kind: int
    sort_memory_mb_per_thread:
      default: 512
      help: |-
        What it does: Sets how much memory the sort at the end of the liftover may use, per thread.
        When it applies: chromosome step 16 (annotate and lift over), on the final bcftools sort of
          the lifted VCF. It is multiplied by execution.threads_per_chromosome (5 by default) and
          handed to bcftools sort as -m; whatever does not fit spills into a temp_chr<N> directory
          beside the outputs, which is removed whether the step succeeds or fails.
        Values: A larger allowance keeps more of the chromosome in memory and writes fewer spill
          files, so the sort is faster but needs more RAM; a smaller one spills more to disk. In
          megabytes per thread, floor 1.
        Example: with the default 5 threads per chromosome, 512 produces "bcftools sort -m 2560M"
          for each chromosome. If 4 chromosomes are being processed at once, that is roughly 10 GB
          of RAM in total, not 512 MB.
        Note: the figure is per thread AND per chromosome, so the real ceiling is this value times
          the threads per chromosome times the number of chromosomes running in parallel. Work out
          that product before raising it on a shared machine.
      origin: vcf_processing.py:279
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 1
        number_kind: int
    concat_max_workers:
      default: 3
      help: |-
        What it does: Sets how many of the per-chromosome VCF concatenations run at the same time.
        When it applies: post-merge step 01 (concatenate the per-chromosome VCFs), once per dataset.
          At most four concatenations exist: the GRCh37 build, the GRCh38 build, the raw gwas2vcf
          output, and the variants that failed liftover.
        Values: A larger number runs more concatenations at once and gives each fewer bcftools
          threads, because the per-job thread count is the run's CPU allowance divided by this value
          (itself capped at that CPU count); smaller runs them in sequence with all threads. Floor 1.
        Example: with 12 threads and 3, three bcftools concat processes run together with 4 threads
          each. At 1 they run one at a time with 12 threads; at 6 still only four run at once (there
          are only four jobs) but each is invoked with --threads 2, because 12 // 6 = 2.
        Note: this used to be fixed at 3 however many CPUs the run was given. It is now capped by that
          request, so a 2-core run gets 2 workers with 1 thread each.
      origin: vcf_processing.py:334
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 1
        number_kind: int
    concat_max_attempts:
      default: 2
      help: |-
        What it does: Sets the maximum number of attempts for each bcftools concat operation and
          its merged-output validation.
        When it applies: post-merge step 01, after at least one valid chromosome VCF is available
          for an output group. Each retry removes the failed merged VCF and index before starting.
        Values: Total attempts including the first. 1 disables retry; 2 makes one retry. Missing or
          invalid per-chromosome inputs are not retried here because repeating concat cannot
          regenerate them.
        Example: if GRCh38 concat writes no index on attempt 1, its partial output is removed and
          attempt 2 reruns concat. If attempt 2 validates, the group is complete; otherwise
          vcf.on_merge_failure decides whether the run fails or continues as PARTIAL.
        Note: this retries only the repairable concat and merged-file validation operation. A
          missing chromosome VCF must be regenerated by rerunning that chromosome.
      origin: vcf_processing.py:concat_vcfs_by_build
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: 10
        minimum: 1
        number_kind: int
    on_merge_failure:
      default: fail
      help: |-
        What it does: Decides whether an incomplete or invalid required genome-wide VCF output stops
          the run or is recorded as a partial result.
        When it applies: post-merge step 01. The required input-build, target-build and raw gwas2vcf
          groups are checked against every chromosome that completed harmonisation before merging.
          Missing or invalid chromosome inputs, concat failures, missing or undersized merged files,
          missing indexes, and merged VCFs whose indexed record count cannot be read are failures.
        Values:
          continue - the failure is logged as a warning, the per-chromosome files belonging to
            that concatenation are kept so it can be retried, and the run goes on to the
            post-merge QC steps with whichever merged VCFs did succeed. Any incomplete required
            output makes the dataset and manifest status PARTIAL, never OK.
          fail - the same message is logged at error level and the run stops with a merge error
            naming which outputs failed.
        Example: the GRCh38 concatenation remains incomplete after its configured attempts while
          GRCh37 succeeds. Under 'continue' you get a warning, the per-chromosome GRCh38 CSQ files
          stay on disk, the run finishes as PARTIAL, and the manifest records GRCh38 under
          required_merge_failures.
          Under 'fail' the run stops there, with the same files kept.
        Note: fail is the scientific default. Either way, the per-chromosome intermediates (_NORM,
          _ID and _EAF) are deleted before this decision is taken, so a retry restarts from the
          CSQ files, not from the raw conversion.
      origin: vcf_processing.py:concat_vcfs_by_build
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - continue
        - fail
    keep_gwas2vcf_intermediate:
      default: false
      help: |-
        What it does: Controls whether the genome-wide raw GWAS-to-VCF adapter output and its
          index are retained after the two annotated build-specific VCFs and all required QC
          outputs have been validated.
        When it applies: post-merge step 05, after the raw adapter merge has passed the same
          chromosome, index and record-count checks as every required merge group. It never
          changes per-chromosome processing, variant values, QC calculations or the delivered
          GRCh37 and GRCh38 VCFs.
        Values:
          false - delete the configured merged raw adapter VCF and any matching .tbi or .csi index
            from a successful run. This is the packaged default.
          true - retain that VCF and index and return its path as an additional output. The public
            CLI option --keep_gwas2vcf_intermediate sets this value to true for the current run.
        Example: a successful GRCh37 input study normally removes
          <dataset>_gwas2vcf_GRCh37_merged.vcf.gz after final validation while retaining
          <dataset>_GRCh37_merged.vcf.gz and <dataset>_GRCh38_merged.vcf.gz. With this policy true,
          all three merged files remain.
        Note: cleanup runs only after the post-merge status is OK; an intermediate may therefore
          remain when finalization stops earlier or is already partial. Cleanup uses the exact
          configured path, never a wildcard.
      origin: service.py:_run_post_merge_stages
      recommendation: null
      type: bool
      validator:
        kind: flag

  # =================================================================
  # 17  throughout      threads, retries, memory
  # =================================================================
  execution:
    scheduling_mode:
      default: adaptive
      help: |-
        What it does: Selects adaptive admission of large and small chromosome workloads or fixed reservations.
        When it applies: after partitioning and reference staging, including retry rounds.
        Values: adaptive estimates each chromosome separately and refills available slots; fixed uses
          execution.memory_gb_per_chromosome and preserves execution.threads_per_chromosome.
        Note: estimates are planning allowances, not operating-system memory limits or measured peaks.
      origin: scheduling.py:plan_chromosome_schedule
      recommendation: null
      type: enum
      validator: {kind: enum, members: [adaptive, fixed]}
    min_threads_per_chromosome:
      default: 2
      help: |-
        What it does: Sets the target minimum CPU allocation per adaptive worker, clipped to the total CPU budget.
        When it applies: adaptive scheduling; the existing threads_per_chromosome remains the maximum.
        Values: a positive integer no greater than threads_per_chromosome. With 11 CPU threads,
          at most five workers receive two threads each, subject to memory admission.
      origin: scheduling.py:plan_chromosome_schedule
      recommendation: null
      type: int
      validator: {kind: num, minimum: 1, integer: true}
    worker_memory_floor_gb:
      default: 1.0
      help: |-
        What it does: Adds a base memory allowance for each adaptive worker, in GiB.
        When it applies: before multiplying the full estimate by memory_safety_factor.
        Values: positive number; this covers interpreter and library overhead, not study/reference tables.
      origin: scheduling.py:plan_chromosome_schedule
      recommendation: null
      type: float
      validator: {kind: num, minimum: 0, exclusive_minimum: true}
    memory_headroom_fraction:
      default: 0.10
      help: |-
        What it does: Keeps part of the resolved memory budget outside worker reservations.
        When it applies: adaptive planning uses the larger of this fraction and current parent RSS.
        Values: a fraction from zero through 0.9; this is additional to global automatic resource resolution.
      origin: scheduling.py:plan_chromosome_schedule
      recommendation: null
      type: float
      validator: {kind: num, minimum: 0, maximum: 0.9}
    memory_safety_factor:
      default: 1.5
      help: |-
        What it does: Multiplies the complete adaptive worker memory estimate to allow estimation error.
        When it applies: base allowance plus working data, references and configured sort buffers.
        Values: at least one. A planning estimate cannot guarantee avoidance of out-of-memory failures;
          calibrate this factor with representative datasets and reference panels.
      origin: scheduling.py:plan_chromosome_schedule
      recommendation: null
      type: float
      validator: {kind: num, minimum: 1}
    memory_bytes_per_variant:
      default: 4096
      help: |-
        What it does: Estimates working memory from the already validated chromosome row count.
        When it applies: adaptive scheduling takes the larger of rows times this value and
          study/source Parquet uncompressed metadata bytes times study_memory_multiplier.
        Values: positive bytes per variant; wide studies may require a larger allowance.
      origin: scheduling.py:plan_chromosome_schedule
      recommendation: null
      type: int
      validator: {kind: num, minimum: 1, integer: true}
    study_memory_multiplier:
      default: 8.0
      help: |-
        What it does: Expands encoded study and immutable-source Parquet sizes for decoded data and intermediate frames.
        When it applies: adaptive planning reads Parquet metadata only; no study values are rescanned.
        Values: at least one; metadata sizes are not measurements of peak resident memory.
      origin: scheduling.py:plan_chromosome_schedule
      recommendation: null
      type: float
      validator: {kind: num, minimum: 1}
    reference_memory_multiplier:
      default: 8.0
      help: |-
        What it does: Expands reference file sizes to estimate in-memory reference and join costs.
        When it applies: configured memory_reference_keys, once per distinct path per chromosome;
          Parquet uses uncompressed metadata size, other formats use on-disk size.
        Values: at least one; compression ratio and join multiplicity vary, so calibrate on the actual panels.
      origin: scheduling.py:plan_chromosome_schedule
      recommendation: null
      type: float
      validator: {kind: num, minimum: 1}
    memory_reference_keys:
      default: [default_eaf_file, user_eaf_file, user_info_file, annot_path, chain_file]
      help: |-
        What it does: Identifies resource-map files included in each adaptive memory estimate.
        When it applies: after external reference staging; duplicate paths are counted once per worker.
        Values: resource-map keys. Indexed FASTA and annotation VCF files are not normally loaded as
          full tables; their overhead is covered by base/sort allowances. Add their keys if needed.
      origin: scheduling.py:plan_chromosome_schedule
      recommendation: null
      type: list
      validator:
        kind: list
        allow_empty: false
        unique: true
        item:
          kind: enum
          members: [default_eaf_file, user_eaf_file, user_info_file, annot_path, chain_file, genome_fasta_file, target_fasta, dbsnp_file, default_comparison_af_file]
    threads_per_chromosome:
      default: 5
      help: |-
        What it does: Sets the maximum threads inside one chromosome process for both the Polars
          computation pool and bcftools commands. PostGWAS exports this value as POLARS_MAX_THREADS
          before each spawn pool starts; changing it in the child initializer would be too late.
        When it applies: throughout every chromosome worker, including Polars transformations and
          chromosome step 16, "Annotate and lift over". It is also multiplied by
          vcf.sort_memory_mb_per_thread to size bcftools sort.
        Values: A positive whole number. Adaptive mode treats this as a ceiling and shares CPU threads
          between workers. Fixed mode preserves this allocation
          and reduces the number of simultaneous chromosomes to budget divided by this value. Only a
          total CPU budget smaller than this value reduces it.
        Example: fixed mode with --threads 16 and this set to 5 runs at most 3 chromosomes x 5 threads = 15 threads,
          rather than 16 one-thread bcftools jobs alongside 16 machine-sized Polars pools.
      origin: service.py:_derive_parallelism
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 1
        number_kind: int
    total_cpu_budget:
      default: null
      help: |-
        What it does: Caps the combined Polars and bcftools CPU allocation of the chromosome fan-out.
        When it applies: Once per dataset, after dataset step 08 splits the file by chromosome and
          before round 1 starts. The resolved global execution.threads value supplies this automatically
          for public CLI runs; null remains available only to direct library callers.
        Values: A positive number of CPU threads. Adaptive mode shares this budget using
          min_threads_per_chromosome and threads_per_chromosome as bounds. In fixed mode worker count is at most
          floor(total_cpu_budget / threads_per_chromosome). If the budget is smaller than one requested
          worker allocation, PostGWAS runs one worker and lowers that worker to the budget.
        Example: a budget of 16 and 5 threads per chromosome gives 3 workers x 5 threads = 15. A budget
          of 4 gives 1 worker x 4 threads. The same per-worker limit controls Polars and bcftools.
      origin: cli.py:_module_policy_block
      recommendation: null
      type: int
      validator:
        allow_none: true
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: null
        minimum: 1
        number_kind: int
    memory_budget_gb:
      default: null
      help: |-
        What it does: Carries the resolved global --memory-gb limit into chromosome worker allocation.
        When it applies: adaptive estimates or fixed execution.memory_gb_per_chromosome before every chromosome
          process pool starts. It can reduce worker count but never increases the CPU-derived count.
        Values: A positive number of gigabytes, or null for direct library callers that intentionally
          provide no memory budget. Public CLI runs always supply the schema-validated global value.
        Example: --memory-gb 48 with 20 GB reserved per chromosome permits at most 2 workers.
      origin: cli.py:_module_policy_block
      recommendation: null
      type: float
      validator:
        allow_none: true
        exclusive_minimum: true
        integer: false
        kind: num
        maximum: null
        minimum: 0.0
        number_kind: float
    memory_gb_per_chromosome:
      default: 20.0
      help: |-
        What it does: Reserves this much of the configured memory budget for each simultaneous
          chromosome process when deciding worker count.
        When it applies: fixed scheduling mode only, after the CPU budget has selected a preliminary worker count. The reservation
          covers the in-memory chromosome table, reference joins, intermediate frames, VCF conversion,
          and configured bcftools sort buffers; it is a conservative planning bound, not a claim that
          every chromosome consumes exactly this amount.
        Values: A positive number of gigabytes. Lower values allow more simultaneous chromosomes but
          increase out-of-memory risk; larger values reduce concurrency.
        Example: 57 GB available at the default 20 GB permits at most 2 chromosome workers.
      origin: service.py:_derive_parallelism
      recommendation: null
      type: float
      validator:
        allow_none: false
        exclusive_minimum: true
        integer: false
        kind: num
        maximum: null
        minimum: 0.0
        number_kind: float
    max_retry_rounds:
      default: 2
      help: |-
        What it does: How many extra passes over the still-failed chromosomes may follow the first
          pass.
        When it applies: in the chromosome retry loop, checked at the end of every round that left
          at least one chromosome failed. Never consulted when round 1 succeeds outright.
        Values:
          Extra rounds. 0 means a failed chromosome is never retried; each unit adds one more round,
          so a chromosome is attempted at most this number plus one times. Ceiling 100.
        Example: at the default 2, chromosomes 6 and 9 fail in round 1; round 2 recovers 9 but not 6,
          so round 3 runs chromosome 6 alone, it fails again, and the loop stops and names it.
        Note: a run can stop before this limit. With the shipped execution.retry_requires_progress =
          true, a round that recovers NOTHING ends the loop - had round 2 above recovered neither 6
          nor 9, round 3 would never have run.
      origin: new
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: 100
        minimum: 0
        number_kind: int
    clean_before_retry:
      default: true
      help: |-
        What it does: Deletes a chromosome's partial output files before that chromosome is tried again.
        When it applies: At the start of every retry round (round 2 onward), for each chromosome about to
          be run again. Never in round 1.
        Values:
          true - that chromosome's partial VCFs and indexes, adapter input/mapping/summary files,
            rejected-variants file and bcftools sort temp directory are removed first, and the count
            removed is announced. The validated chromosome input table and immutable source snapshot
            are retained because the retry reads them again.
          false - they are left on disk and a WARNING says the old partial files may reach the merge.
        Example: chromosome 7 dies in round 1 having written a truncated GWAS_chr7_GRCh38_CSQ.vcf.gz of
          4 KB. With true that file is gone before round 2 starts. With false, and round 2 failing
          earlier at step 12, the 4 KB file survives and the merge accepts it, because a VCF is only
          treated as empty below vcf.min_valid_size_bytes, which is 100 bytes.
        Note: validated chromosome input tables, immutable source snapshots and logs are never deleted
          by retry cleanup. Logs are opened in append mode so every attempt is preserved.
      origin: new
      recommendation: null
      type: bool
      validator:
        kind: flag
    retry_requires_progress:
      default: true
      help: |-
        What it does: Stops the retry loop as soon as a whole retry round recovers no chromosome.
        When it applies: in the chromosome retry loop, at the end of every round from round 2 onward
          (round 1 is the first pass, so it is exempt), and after the execution.max_retry_rounds
          check. It can change the outcome only when max_retry_rounds is 2 or more.
        Values:
          true - the loop stops the moment a retry round ends having recovered nothing.
          false - rounds keep going until execution.max_retry_rounds is used up, repeating a failure
            that has already been shown not to clear.
        Example: with max_retry_rounds at 2, chromosomes 3 and 9 fail in round 1 and both fail again
          in round 2. With true the run stops at the end of round 2 and reports the two failures;
          with false round 3 reruns the same two against the same missing reference file.
      origin: new
      recommendation: null
      type: bool
      validator:
        kind: flag
    fail_dataset_on_chr_error:
      default: true
      help: |-
        What it does: Decides whether a dataset with an unfinished chromosome is failed outright or is
          merged from whatever did complete.
        When it applies: Once per dataset, after the retry rounds have finished, and only when at least
          one chromosome is still failed.
        Values:
          true - the dataset stops with an error; the merge, the variant filter and the QC summary never
            run for it.
          false - a WARNING is printed and the post-merge steps continue with the chromosomes that did
            complete; the run manifest records the status as PARTIAL, or FAILED if none completed.
        Example: 21 of 22 chromosomes complete and chromosome 6 does not. With true nothing is merged,
          and the command-line runner re-runs the whole dataset once before reporting it as failed. With
          false you get a merged genome-wide VCF containing no chromosome 6 at all, and a manifest that
          says PARTIAL.
        Note: false produces a file that is missing a whole chromosome. The manifest reports its
          surviving partition rows as unprocessed_failed_chromosome_rows, and the run summary reports
          them as unprocessed_failed_chromosome_variants, rather than mislabelling them as scientific
          rejects. Use partial output only when you intend to work with an incomplete genome and will
          check both the status and unprocessed count before analysis.
      origin: new
      recommendation: null
      type: bool
      validator:
        kind: flag
  # =================================================================
  # 18  throughout      logging and screen output
  # =================================================================
  logging:
    append_across_retries:
      default: true
      help: |-
        What it does: Keeps every attempt at a chromosome in one log file instead of starting the file
          over on a retry.
        When it applies: At the start of a chromosome worker whose attempt number is 2 or higher. Never
          on the first attempt, and never for the dataset log.
        Values:
          true - logs/{sample}_chr{N}.log is opened in append mode, so attempt 2 continues underneath
            attempt 1 and the failed attempt stays readable.
          false - the file is deleted at the start of the retry, leaving only the last attempt.
        Example: chromosome 7 fails at step 12 in round 1 and succeeds in round 2. With true,
          GWAS_chr7.log holds both attempts, each opening with "Chromosome 7 of GWAS, attempt N". With
          false, the traceback explaining the round 1 failure is gone.
        Note: the command-line runner also retries a whole failed dataset once, and that restarts the
          attempt counter at 1, so those attempts append to the existing log whatever this is set to.
      origin: new
      recommendation: null
      type: bool
      validator:
        kind: flag
    screen_order:
      default: completion
      help: |-
        What it does: Chooses whether a chromosome's block is printed the moment that chromosome
          finishes, or held back and printed in chromosome order when the round ends.
        When it applies: In the parent process, in every round of the chromosome fan-out, retry rounds
          included.
        Values:
          completion - each block is printed as its worker returns, so the quickest chromosome appears
            first and you can watch a long run make progress.
          sorted - blocks are collected and printed together once the round ends, ordered 1, 2, ... 22,
            X, Y, XY, MT.
        Example: with 22 chromosomes and completion, chromosome 21 usually prints before chromosome 1
          because it is much smaller. With sorted, nothing appears until the last worker of the round
          returns, and then all 22 blocks print in order.
        Note: sorted holds the detailed chromosome blocks until the round ends. The held-back blocks
          are still printed if the round is torn down early, because they are flushed from a finally.
          When global logging.show_progress is true, the parent-side completed-chromosome counter
          continues to update while those blocks are held. Neither setting can interleave two
          chromosome blocks - only the parent's single-threaded loop prints them.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - completion
        - sorted
    level:
      default: INFO
      help: |-
        What it does: Sets the lowest severity of record that is written to the log files on disk.
        When it applies: Whenever a logger is built - the dataset logger and every chromosome worker. It
          does not change what appears on screen; logging.screen_level does that.
        Values:
          DEBUG - everything, plus the one debug record the pipeline writes: a group-by-group dump of
            every resolved setting into the dataset log.
          INFO - step start and finish lines, "Settings in use" blocks, DECIDE lines, QC counts,
            warnings and failures. This is what the shipped default keeps.
          WARNING - only warnings and failures; every step, settings and QC line is dropped.
          ERROR - only failures: the FAILED lines, the "What went wrong / What to do" pair and the
            traceback beneath them.
        Example: at INFO, logs/GWAS_chr7.log carries "QC check - eaf out of range" with the variant
          count before and after, and the rows-read / rejected / exported reconciliation table. At
          WARNING neither is written, so the only surviving record of what was removed is the
          rejected-variants file.
        Note: when a worker is killed outright - an out-of-memory kill, say - it returns nothing and the
          parent prints the tail of this log file instead. Raising this above INFO leaves that tail
          nearly empty and makes such a death very hard to diagnose.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - DEBUG
        - INFO
        - WARNING
        - ERROR
    screen_level:
      default: WARNING
      help: |-
        What it does: Sets the lowest severity of record a chromosome worker keeps in the block the
          parent prints on screen.
        When it applies: Inside each chromosome worker. Workers never print; each buffers its own text
          and the parent prints one block when that chromosome finishes. Dataset-level announcements -
          the round headers, the "N at a time, M threads each" line, the closing counts - are written
          straight to standard output and are not filtered by this.
        Values:
          DEBUG - everything the worker recorded.
          INFO - step start and finish, settings blocks, DECIDE lines, QC counts, warnings, failures.
          WARNING - only warnings and failures, so the block shrinks to the important problems. This is
            the shipped default; complete INFO records remain in the log files.
          ERROR - only failures.
        Example: at WARNING, chromosome 7's block no longer shows "01/17 Load the chromosome file" or
          the per-step QC counts, but the framed header and the rows-read / rejected / exported footer
          with its reject-by-reason table still appear - the parent builds those from the summary the
          worker returns, not from the buffered text.
        Note: nothing forces this to sit at or above logging.level. Setting this to DEBUG while
          logging.level is ERROR shows lines on screen that the log file never receives, and the log
          file is the only permanent record of the run.
      origin: new
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - DEBUG
        - INFO
        - WARNING
        - ERROR

  # =================================================================
  # 19  throughout      the rejected-variant file
  # =================================================================
  rejects:
    enabled:
      default: true
      help: |-
        What it does: Turns on the rejected-variants file, which records every removed variant with all
          of its original parsed study values and the reason it was removed. A stable source-row ID
          retrieves those values from an immutable pre-harmonisation snapshot rather than from the
          transformed working row.
        When it applies: Twice per dataset and then again at the end. dataset step 03 (reading the
          summary statistics) opens the input-level collector, chromosome step 01 opens one per
          chromosome, and after the retry rounds the parent combines them.
        Values:
          true - rejected/{sample}_input_rejected.tsv.gz and rejected/{sample}_chr{N}_rejected.tsv.gz
            are written (header-only when nothing was rejected, so an absent file means the step never
            ran), combined into {sample}_rejected_variants.tsv.gz, and summarised as a reason-by-
            chromosome table in qc_summary/{sample}_reject_reasons.tsv.
          false - a WARNING is logged, removals are still counted in the log, nothing is written, and
            the dataset reconciliation is reported as unavailable.
        Example: 12,043 variants dropped at chromosome step 03 appear as rows carrying reject_step
          "03", reject_reason "eaf_out_of_range" and every column the study supplied. With this off the
          log still says 12,043 were removed, but you cannot see which variants they were.
        Note: the chromosome assertion (rows read = rejected + exported) and the dataset assertion
          (parsed rows = recorded rejects + exports + explicitly unprocessed failed-chromosome rows)
          require collectors. The dataset assertion also verifies input-stage retention, chromosome
          partition coverage, final chromosome-status coverage, and agreement between completed
          chromosome summaries and their rejection shards. Turning this off removes the checks that
          catch a variant vanishing from both the kept and rejected sides. Leave it on. When enabled,
          every rejection file is required provenance: a write failure, unreadable file, or missing
          file from an otherwise successful input or chromosome stage fails dataset finalisation rather
          than producing an incomplete successful result. Compressed chromosome source snapshots are
          internal intermediates and are removed only after successful finalisation.
      origin: new
      recommendation: null
      type: bool
      validator:
        kind: flag
    compress:
      default: true
      help: |-
        What it does: Whether the per-chromosome and input-level rejected-variants files are gzipped.
        When it applies: When each collector is created (dataset step 03 and chromosome step 01), and
          again at the end of the dataset when the parent looks those files up by name in order to
          combine them. Only consulted when rejects.enabled is true.
        Values:
          true - ".gz" is appended to the name unless it is already there, and the file is gzipped.
          false - a plain tab-separated file is written.
        Example: with true, chromosome 7's removals land in rejected/GWAS_chr7_rejected.tsv.gz; with
          false, in rejected/GWAS_chr7_rejected.tsv.
        Note: the combined dataset file, {sample}_rejected_variants.tsv.gz, is gzipped whatever this is
          set to - this controls only the per-chromosome and input-level parts. Each reject file holds
          one full input row per removed variant, so on a large study the uncompressed form runs to
          several gigabytes; keep it on unless you need to open the files with tools that cannot read
          gzip.
      origin: new
      recommendation: null
      type: bool
      validator:
        kind: flag
    concat_batch_rows:
      default: 100000
      help: |-
        What it does: Limits how many rejected-variant rows are materialised at once while the parent
          combines the input-stage and per-chromosome reject shards into the final dataset-level file.
          The exact final row count is accumulated during these writes instead of re-reading the full
          combined gzip file in Python.
        When it applies: Dataset finalisation, after chromosome processing and before validated source
          reject shards are removed. It does not change chromosome processing or which variants are
          rejected.
        Values: A positive integer number of rows per Polars read/write batch. A larger value may
          improve throughput but uses more peak memory; a smaller value lowers peak memory at the cost
          of more batch operations.
        Example: 100000 means that consolidating 24 million rejected variants materialises about one
          hundred thousand rows at a time rather than all 24 million rows plus their concatenated copy.
        Note: Source-file and row order are preserved. Shards with different original study columns
          are projected onto one ordered union schema, with absent fields written as null, matching the
          previous diagonal-concatenation semantics. This is a compute setting only and has no effect
          on scientific values or rejection decisions.
      origin: rejects.py:concat_reject_files
      recommendation: null
      type: int
      validator:
        allow_none: false
        integer: true
        kind: num
        minimum: 1
