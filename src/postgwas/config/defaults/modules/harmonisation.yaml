    - title: Post-merge frequency QC and optional input-to-VCF validation
      fields: [population_frequency_qc, concordance_validation]
    - title: Advanced reference column mappings and file layout
      fields: [default_eaf_mapping, external_eaf_mapping, external_info_mapping, build_check_mapping, resource_layout]
    - title: Advanced output files and VCF definitions
      fields: [output_layout, gwas2vcf_input, vcf_processing]
    - title: Advanced runtime and sample-sheet generator
      fields: [runtime, external_reference_staging, sample_sheet_generator]
  common_fields:
    - enabled
    - default_eaf.source
    - default_eaf.column
    - comparison_af.source
    - comparison_af.column
    - reference.dbsnp_source
    - population_frequency_qc.enabled
    - concordance_validation.enabled
  common_run_fields:
    - config_version
    - run.output_directory
    - run.resume
    - run.overwrite
    - resources.root
    - execution.threads
    - execution.memory_gb
    - execution.random_seed
    - logging.show_screen
    - logging.file_level
    - modules.qc_summary.rules.maf_min
    - modules.qc_summary.rules.info_min
    - modules.qc_summary.rules.info_max
    - modules.qc_summary.rules.maximum_af_difference
    - modules.qc_summary.rules.include_indels
    - modules.qc_summary.rules.remove_palindromic
    - modules.qc_summary.rules.palindromic_lower
    - modules.qc_summary.rules.palindromic_upper
    - modules.qc_summary.rules.remove_mhc
  comments:
    enabled: ['Used when selecting modules in a pipeline; the direct harmonisation command runs the selected module.']
    default_eaf: ['Strand orientation and EAF/MAF validation table for chromosome step 04.', 'This panel does not fill missing study EAF; an external source is declared separately in the sample sheet.']
    comparison_af: ['Reference VCF for population annotation and post-merge QC.', 'This panel does not determine the study strand or supply its EAF.']
    reference: ['dbSNP annotation used during chromosome VCF processing.']
    fixed_info: ['Explicit fallback for datasets with no internal or external INFO; provenance marks it as user-assigned.']
    population_frequency_qc: ['Post-merge step 02: compare population frequencies and report supporting evidence.']
    concordance_validation: ['Optional stage 6: compare original input with the same-build final VCF.', 'Enabled through this setting or --validate; discrepancies are subject to the configured failure limits.']
    default_eaf_mapping: ['Structural columns of the strand/MAF-validation table; its frequency column belongs to ALT.']
    external_eaf_mapping: ['Structural columns of the external EAF source declared in the sample sheet.']
    external_info_mapping: ['Structural columns of an external INFO source; INFO does not change on allele swaps.']
    build_check_mapping: ['Columns in the representative genome-build marker tables used at dataset step 05.']
    resource_layout: ['Resource path templates resolved under resources.root.']
    output_layout: ['Relative names for results, logs, rejected rows and provenance.']
    gwas2vcf_input: ['Adapter input contract; change only with a validated matching adapter interface.']
    vcf_processing: ['VCF fields, annotation, liftover tag roles and provenance definitions.', 'User-selectable liftover behavior is configured once in policies.vcf above.']
    runtime: ['Runtime paths and output formatting; ordinary run controls appear in the run configuration.']
    external_reference_staging: ['Dataset step 08: bounded preparation of shared external EAF/INFO tables.']
    sample_sheet_generator: ['Optional sample-sheet drafting tool only; header aliases are not analysis decisions.']
  run_comments:
    run: ['Run setup: output location and validated resume/restart controls.']
    run.resume: ['Reuse validated completed steps and continue from the first incomplete step.']
    run.overwrite: ['Start from the first step and replace files created by the previous run.']
    resources: ['Set the reference resource root before running, or provide --resource-directory.']
    execution: ['Total resources for the run; set threads and memory_gb to auto to resolve on another computer.']
    logging: ['Terminal display and durable logging; hiding the screen does not disable the saved transcript.']
    modules.qc_summary: ['Post-merge step 04: these rules assess the merged VCF without removing additional variants.', 'Earlier harmonisation steps can already reject variants; use sumstat_filter for downstream removal.']
  policy_summaries:
    input: 'Read and partition the study. Delimiter and missing-token choices affect how original values are interpreted.'
    columns: 'Validate mandatory input fields; missing requirements stop processing before analysis.'
    chromosome: 'Normalize labels and reject chromosomes outside the configured scope.'
    position: 'Validate coordinates and reject invalid positions before reference matching.'
    allele: 'Validate allele representations; unsupported allele codes are rejected.'
    duplicates: 'Select one consistent duplicate or apply the conflict action; record every removed row. Recheck after allele orientation.'
    sample_size: 'Validate available N, cases and controls; derive sample sizes using the declared study design.'
    build: 'Infer or declare the build. Insufficient automatic evidence stops the dataset.'
    strand: 'Orient each row against the reference and align effects to ALT. The ambiguity band applies to palindromic SNPs, not all variants. Unmatched, unresolved or discordant rows follow their configured actions.'
    effect: 'Determine the study effect/SE scale once; convert OR to log odds before allele swapping.'
    pvalue: 'Determine the P-value representation once. Preserve original evidence; invalid values and missing-SE recovery follow explicit policies.'
    external_reference: 'Resolve duplicate panel rows before attaching AF or INFO; conflicting annotations must not multiply study rows.'
