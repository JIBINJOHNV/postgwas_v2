        - NCA
        - NCAS
        - NCASE
        - NCASES
      total_sample_size_column:
        - N
        - TOTAL_N
        - N_TOTAL
        - SAMPLE_SIZE
        - SAMPLESIZE
        - OBS_CT
      effective_sample_size_column:
