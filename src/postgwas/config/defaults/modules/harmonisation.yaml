policies:

  # =================================================================
  # 01  dataset 03      read and parse the study file
  # =================================================================
  input:
    strip_double_hash_lines:
      default: true
      help: |-
        What it does: Removes the '##' metadata lines from the top of the study file before parsing.
        When it applies: dataset step 03, as the very first thing done to the file, before the
          delimiter is guessed and before anything is read.
        Values:
          true - if any line begins with '##' the file is copied without those lines and the copy
            is read; if there are none the original file is used untouched.
          false - the '##' lines are left in place and the file is handed to the parser as it is.
        Example: a file whose first line is '##fileformat=VCFv4.2' and whose second is
          'CHR POS EA OA P' is copied to <file>.tsv starting at 'CHR POS EA OA P'. A .gz or .bgz
          input is written out UNCOMPRESSED next to the original, so the input folder must be
          writable and must have room for the plain-text copy.
        Note: leave this on. The parser is not told that '##' means a comment, so with false the
          line '##fileformat=VCFv4.2' becomes the column header, every real column name is lost
          and the run fails on missing columns.
      origin: summary_statistics_io.py:load_summary_statistics_table
      recommendation: null
      type: bool
      validator:
        kind: flag
    delimiter:
      default: auto
      help: |-
        What it does: Sets the character that separates columns in the summary-statistics file.
        When it applies: dataset step 02 (the header check) and dataset step 03 (the read); any value
          other than 'auto' skips the guessing in both.
        Values:
          auto - evaluate input.delimiter_candidates on input.delimiter_sample_rows and keep the
            widest separator producing a consistent number of columns within the configured range.
          tab, comma, semicolon, space - split on that single character.
          whitespace - identical to 'space' today: runs of spaces are NOT collapsed.
        Example: a 9-column comma file under 'auto': comma yields 9 and wins; tab yields 1. Naming
          'tab' explicitly instead reads the whole line as one column and the run fails.
        Note: detection fails with an actionable error when no candidate is consistent; it never
          silently substitutes a delimiter that did not pass the configured checks.
      origin: summary_statistics_io.py:load_summary_statistics_table
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members:
        - auto
        - tab
        - comma
        - semicolon
        - space
        - whitespace
    delimiter_candidates:
      default: [tab, comma, semicolon, space, pipe]
      help: |-
        Ordered delimiter names evaluated when input.delimiter is auto. Every candidate is
        assessed on the same configured sample, and the widest consistent valid table wins.
      origin: postgwas.core.io.delimiters:resolve_delimiter
      recommendation: null
      type: list
      validator:
        allow_empty: false
        item:
          allow_none: false
          kind: enum
          members: [tab, comma, semicolon, space, whitespace, pipe]
        kind: list
        unique: true
        upper: false
    delimiter_sample_rows:
      default: 500
      help: |-
        Number of non-empty, non-metadata rows used for delimiter detection. The header and
        dataset readers use the same sample so they cannot select different separators.
      origin: postgwas.core.io.delimiters:resolve_delimiter
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: 10000
        minimum: 1
        number_kind: int
    delimiter_min_columns:
      default: 2
      help: |-
        What it does: Sets the fewest columns a candidate separator must produce to be accepted.
        When it applies: dataset steps 02 and 03, and only while input.delimiter is 'auto'. It is
          ignored the moment you name a separator explicitly.
        Values:
          A column count. Raising it makes the guess stricter and rejects narrow files; lowering it
          accepts them. The floor is 1, at which point a separator that does not split the line at
          all still counts as a success.
        Example: a four-column comma file (SNP, BETA, SE, P) passes at 2; raising this setting to 5
          rejects delimiter inference before the table is read.
        Note: use the smallest scientifically valid input schema for the module being run.
      origin: summary_statistics_io.py:load_summary_statistics_table
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: 1000
        minimum: 1
        number_kind: int
    delimiter_max_columns:
      default: 100
      help: |-
        What it does: Sets the most columns a candidate separator may produce before it is treated
          as a bad guess.
        When it applies: dataset steps 02 and 03, and only while input.delimiter is 'auto'. It is
          ignored the moment you name a separator explicitly.
        Values: a column count. Larger allows wider files to be recognised; smaller rejects them.
          The floor is 1 and the ceiling is 100000. It must be larger than
          input.delimiter_min_columns, which the policy loader checks.
        Example: a 130-column file is rejected at 100 and accepted after raising this value to 500.
        Note: header validation and dataset loading share the same detector and therefore cannot
          disagree about the selected separator.
      origin: summary_statistics_io.py:load_summary_statistics_table
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: 100000
        minimum: 1
        number_kind: int
    null_values:
      default:
      - NA
      - NAN
      - ''
      - '.'
      help: |-
        What it does: Lists the exact text values that are read as 'missing' rather than as data.
        When it applies: dataset step 03, on every read attempt (first read, low-memory retry,
          whitespace-repaired read), and at chromosome step 12 to spot an identifier that must be rebuilt.
        Values: the reader compares each member literally and case-sensitively against the raw text of a
          field; a match becomes a missing value. Identifier matching additionally trims and ignores case,
          and combines this list with the shared optional-text placeholders.
        Example: with the default [NA, NAN, '', .], either 'NA' or '.' in a P column reads as missing;
          the remaining values are converted independently, so one unusable cell cannot leave the
          complete scientific column as text.
        Note: A dash is not a reader-level default because it can encode a deletion allele in older inputs.
          In the identifier column alone, '-' and the other shared text placeholders are still treated as
          missing and rebuilt from chromosome, position and alleles. Chromosome partitions are typed Parquet
          and are not reparsed using a second missing-value vocabulary.
      origin: summary_statistics_io.py:load_summary_statistics_table
      recommendation: null
      type: list
      validator:
        allow_empty: true
        item:
          allow_none: false
          kind: text
        kind: list
        unique: false
        upper: false
    schema_inference_rows:
      default: 0
      help: |-
        What it does: Sets how many rows are examined before each column's data type is fixed.
        When it applies: dataset step 03, on every read of the study file.
        Values:
          0 - the default: read every column as text, then cast each configured scientific value;
            an unusable scalar cell becomes missing without changing the valid cells in its column.
          a positive number - type each column from that many rows; larger sees more of the file,
            smaller risks typing a column from its opening rows alone.
        Example: a P column with one stray '.' at row 4,000,000 reads that configured missing token
          as null while every valid P value remains numeric.
        Note: With a positive inference limit, an unexpected non-numeric token beyond the sampled rows
          can still make Polars stop during the initial read. Keep 0 for heterogeneous public GWAS files.
      origin: summary_statistics_io.py:load_summary_statistics_table
      recommendation: null
      type: int
      validator:
        allow_none: false
        exclusive_minimum: false
        integer: true
        kind: num
        maximum: 10000000
        minimum: 0
        number_kind: int
    chromosome_partition_compression:
      default: zstd
      help: |-
        What it does: Selects compression for typed internal chromosome work files and immutable
          source snapshots.
        When it applies: dataset step 08, before chromosome workers start.
        Values: zstd, lz4, snappy, gzip, brotli, or uncompressed.
        Scientific note: compression changes internal storage only. It does not change row order,
          values, data types, chromosome assignment, or rejection provenance. Parquet preserves the
          validated schema without text serialization or schema inference in chromosome workers.
      origin: chromosome_partition.py:write_chromosome_partitions
      recommendation: null
      type: enum
      validator:
        allow_none: false
        kind: enum
        members: [zstd, lz4, snappy, gzip, brotli, uncompressed]
    check_truncation:
      default: true
      help: |-
        What it does: Checks that the study file looks complete before the pipeline commits to a
          long run.
        When it applies: once per dataset, after the header check (dataset step 02) and before the
          file is read (dataset step 03).
        Values:
          true - the complete input stream is read in bounded binary chunks using
            vcf_processing.io_buffer_bytes. This validates gzip/BGZF, bzip2, xz/lzma and ZIP
            streams while avoiding one Python operation per variant; the final readable line is
            also checked for an abrupt trailing full stop.
          false - the same chunked pass still counts physical data records for input-versus-parser
            reconciliation, but decompression and final-line observations are not reported as
            preliminary truncation warnings; the decision is recorded in the log and the normal
            table reader remains responsible for accepting or rejecting the file.
        Example: a damaged compressed download produces a warning naming the decompression error;
          a final line ending 'rs99 1 1000 A G 0.' is flagged as possibly incomplete.
        Note: this check warns; the normal table reader still decides whether the dataset can run.
          A missing or empty file always raises a clear error. The trailing-period heuristic is
          intentionally conservative and may flag a legitimate value ending in '0.'.
      origin: summary_statistics_io.py:check_file_truncation
      recommendation: null
      type: bool
      validator:
        kind: flag
  # =================================================================
  # 02  dataset 03      which columns a variant must have
  # =================================================================
  columns:
    mandatory:
      default:
      - chr
      - pos
      - ea
      - oa
      - pval
      - - beta
        - zscore
      help: |-
        What it does: Lists what a variant must carry before it is kept.
        When it applies: dataset step 03, immediately after the input table is read.
        Values: field names, each resolved to the column your config names for it ('zscore' is
          imp_z_col, 'n' is ncontrol_col, 'beta' is beta_or_col); order does not matter. A plain entry
          is required outright, and a NESTED list needs at least one of its mapped members. Dataset
          configuration and header validation must establish the required mappings before this
          row-level rule runs; the read step does not invent an absent source.
        Example: with the default [chr, pos, ea, oa, pval, [beta, zscore]], a variant with a Z score
          of 5.5 and an empty BETA is KEPT - step 06 derives beta from Z. With neither, it is removed.
        Note: this is the ROW-level filter; whether the config NAMES an effect column at all is
          required_inputs.effect. eaf, se, info, snp and n are absent on purpose - a later step
          supplies each; the field_lifecycle table at the top of this file names them. The
          configured output_layout.field_completeness table records post-parse missingness,
          BETA-or-Z group missingness, selected source/recovery provenance, and final-gate
          missingness without implying that every mapped field was complete at input.
      origin: new
      recommendation: null
      type: list
      validator:
        allow_empty: false
        item:
          allow_none: false
          kind: enum
          members:
          - chr
          - pos
          - snp
          - ea
          - oa
          - eaf
          - beta
          - se
          - zscore
          - pval
          - info
          - n
        kind: list
        nested_alternatives: true
        unique: true
        upper: false
  # =================================================================
  # dataset 03 / reference readers   chromosome naming and filtering
  # =================================================================
  chromosome:
    drop_mt:
      default: true
      help: |-
        What it does: Whether mitochondrial variants are thrown away.
        When it applies: chromosome step 02 and the same coordinate step inside dataset step 03,
          after chromosome.rename_map has run, on whatever then carries the label MT.
        Values:
          true - MT is taken out of the kept list chromosome.allowed_after_split, so MT variants
            are removed and recorded as an invalid chromosome.
          false - this switch does not remove MT, but MT still survives only when it is explicitly
            present in chromosome.allowed_after_split.
        Example: PLINK chromosome 26 and the label M are normalized to MT. With the packaged
          autosomes-plus-X chromosome lists and this default, those rows are removed and counted
          as mitochondrial exclusions. PLINK chromosome 25 is normalized to X and is retained.
        Note: Both dataset-level and chromosome-level coordinate checks read this value from the
          resolved policy registry. There is no separate caller default. The packaged pipeline
          intentionally keeps only autosomes and X.
      origin: coordinates.py:121
      recommendation: null
      type: bool
      validator:
