  - group: columns
    order: 2
    stage: dataset 03      which columns a variant must have
    keys:
      - mandatory
  - group: chromosome
    order: 3
    stage: dataset 03; reference readers throughout — chromosome naming and filtering
    keys:
      - drop_mt
      - allowed_after_split
      - strip_chr_prefix
      - strip_leading_zero
      - rename_map
      - allowed
  - group: position
    order: 4
    stage: dataset 03; reference readers throughout — position parsing and bounds
    keys:
      - min_value
      - extraction
  - group: allele
    order: 5
    stage: dataset 03      allele validation
    keys:
      - pattern
  - group: duplicates
    order: 7
    stage: dataset 03 / chromosome 04 — input and reference-aligned duplicate checks
    keys:
      - key
      - consistency_fields
      - post_orientation_relative_tolerance
      - quality_fields
      - selection_order
      - conflicting_action
  - group: build
    order: 9
