        - VARIANT_ID
      effect_allele_column:
        - A1
        - AL1
        - ALLELE1
        - ALT
        - ALT_ALLELE
        - ALTALLELE
        - ALTERNATIVE
        - ALTERNATIVE_ALLELE
        - ALTERNATIVEALLELE
        - EA
        - EFF_ALLELE
        - EFFALLELE
        - EFFECT_ALLELE
        - EFFECTALLELE
