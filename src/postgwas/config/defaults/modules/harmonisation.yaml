# ============================================================================
# Canonical harmonisation configuration and scientific policy registry.
#
# ``module`` is loaded by postgwas.config as the packaged module defaults.
# The remaining top-level sections define the validated scientific registry
# consumed by postgwas.modules.harmonisation.policies.
#
# This file is data, not code.  Read it, diff it across releases, copy it.
# policies.py only loads and validates it.
#
# Each entry:
#   default        the value used when nothing overrides it
#   type           int | float | str | bool | list | map
#   validator      what values are accepted
#   help           printed verbatim in the log's 'Settings in use' block
#   origin         the current implementation that consumes the setting
#   recommendation set when the shipped default is NOT what we would advise
# ============================================================================

module:
  enabled: false

  comparison_af:
    source: ALFA
    column: EUR
    available_sources: [ALFA, 1000G]
    resource_examples:
      ALFA: GRCh37_ALFA_freq_chr[1..22,X,Y].vcf.gz
      1000G: GRCh37_1000G_freq_chr[1..22,X,Y].vcf.gz

  # Allele-orientation and MAF/EAF validation table. This is intentionally
  # separate from comparison_af because chromosome harmonisation consumes
  # tabular reference frequencies rather than annotation VCFs. Select exactly
  # one source per run; ALFA EUR is the packaged default.
  default_eaf:
    source: ALFA
    column: EUR
    available_sources: [ALFA, wgs_ukb, panukb, 1000G, fingen]
    resource_examples:
      ALFA: GRCh37_ALFA_freq_chr[1..22].tsv.gz
      wgs_ukb: GRCh37_wgs_ukb_freq_chr[1..22].tsv.gz
      panukb: GRCh37_panukb_freq_chr[1..22].tsv.gz
      1000G: GRCh37_1000G_freq_chr[1..22].tsv.gz
      fingen: GRCh37_fingen_freq_chr[1..22].tsv.gz

  # Frequencies in the selected default_eaf population column are ALT-allele
  # frequencies.
  default_eaf_mapping:
    chromosome: CHROM
    position: POS
    effect_allele: ALT
    other_allele: REF
    delimiter: tab

  reference:
    dbsnp_source: dbSNP157

  external_eaf_mapping:
    chromosome: CHROM
    position: POS
    effect_allele: ALT
    other_allele: REF
    delimiter: auto

  external_info_mapping:
    chromosome: CHROM
    position: POS
    effect_allele: ALT
    other_allele: REF
    delimiter: auto

  # ``value`` is populated only by the explicit --fixed-info CLI option. The
  # generated column name is reserved for the chromosome working frame and
  # prevents an unconfigured study column from being overwritten.
  fixed_info:
    value: null
    column: __postgwas_fixed_info

  # Header aliases used by the optional sample-sheet generator. These aliases
  # select column names only; the harmonisation preflight still validates the
  # selected columns and infers study properties from the complete dataset.
  sample_sheet_generator:
    supported_suffixes:
      - .vcf.gz
      - .vcf.bgz
      - .vcf.bz2
      - .vcf.xz
      - .vcf.zip
      - .tsv.gz
      - .txt.gz
      - .csv.gz
      - .sumstats.gz
      - .meta.gz
      - .tsv.bgz
      - .txt.bgz
      - .tsv.bz2
      - .txt.bz2
      - .tsv.xz
      - .txt.xz
      - .tsv.zip
      - .txt.zip
      - .tsv
      - .txt
      - .csv
      - .sumstats
      - .meta
      - .vcf
      - .gz
      - .bgz
      - .bz2
      - .xz
      - .zip
    trait_type: auto
    effect_type: auto
    p_value_type: auto
    failure_policy: write_valid
    rejection_report_suffix: .rejected_files.tsv
    on_missing_sample_size: write_draft
    effect_frequency_prefixes: [FRQ_U, FREQ_U]
    # ALT-labelled frequencies are valid study EAF only when the selected
    # effect-allele column is itself ALT-labelled.
    alternative_frequency:
      allele_columns:
        - ALT
        - ALT_ALLELE
        - ALTALLELE
        - ALTERNATIVE
        - ALTERNATIVE_ALLELE
        - ALTERNATIVEALLELE
      frequency_columns:
        - AF_ALT
        - ALT_AF
        - ALT_FREQ
        - ALT_ALLELE_FREQ
        - ALT_ALLELE_FREQUENCY
        - ALTERNATIVE_AF
        - POOLED_ALT_AF
    column_aliases:
      chromosome_column:
