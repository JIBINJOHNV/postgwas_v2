enabled: false
inputs:
  vcf: null
  dataset_id: null
output_directory: null
genome_build: GRCh37
genome_build_header_tokens:
  GRCh37: [GRCh37]
  GRCh38: [GRCh38]
maf_min: 0.01
missing_af_action: remove
info_min: 0.7
info_max: null
missing_info_action: remove
minimum_neglog10_p: null
missing_pvalue_action: remove
reference_population_tag: EUR
frequency_difference_max: 0.2
include_indels: false
remove_palindromic: true
palindromic_lower: 0.4
palindromic_upper: 0.6
remove_mhc: true
mhc:
  genome_build: GRCh37
  chromosome: "6"
  start: 25000000
  end: 34000000
empty_expression_action: match_all
sort_output: false
report_missing_counts: true
vcf_fields:
  chromosome: CHROM
  position: POS
  reference_allele: REF
  alternate_allele: ALT
  variant_type: TYPE
  study_af_format: FORMAT/AF
  imputation_quality_format: FORMAT/SI
  log_pvalue_format: FORMAT/LP
  study_af_info: INFO/AF
  external_af_info: INFO/{reference_population_tag}
output_layout:
  filtered_vcf: "{dataset_id}_{genome_build}_filtered.vcf.gz"
  log_file: "logs/{dataset_id}_{genome_build}_filter_gwas_vcf_bcftools.log"
  reason_summary: "qc_summary/{dataset_id}_{genome_build}_filter_reason_summary.tsv"
  mhc_exclusion_bed: "{dataset_id}_{genome_build}_mhc_exclude.bed"
