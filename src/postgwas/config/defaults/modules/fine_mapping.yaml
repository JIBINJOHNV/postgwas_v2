enabled: false
engine: susie
genome_build: GRCh37
locus_type: range
locus_window_kb: 500
locus_lp_threshold: 7.3
skip_mhc: true
mhc_chromosome: 6
mhc_start: 25000000
mhc_end: 35000000
memory_per_worker_gb: 14
credible_set_coverage: 0.95
input:
  locus_file: null
  susie_summary_statistics_file: null
  finemap_summary_statistics_file: null
  ld_reference_prefix: null
sample_size:
  policy: warn
  summary_statistic: median
  relative_range_warning_threshold: 0.05
ld_resource_guard:
  maximum_variants_per_locus: 30000
  finemap_peak_matrix_multiplier: 4.0
  susie_peak_matrix_multiplier: 5.0
validation:
  credible_set_coverage_tolerance: 0.001
  ld_correlation_tolerance: 1.0e-6
  ld_symmetry_tolerance: 1.0e-5
  ld_diagonal_tolerance: 0.0001
  ld_eigenvalue_tolerance: 0.0001
runtime:
  tool_version_timeout_seconds: 15
  software_version_timeout_seconds: 20
  fallback_memory_gb: 16.0
html_report:
  page_size: 50
  probability_significant_digits: 4
  credible_set_file_columns:
    rank: index
    variant_id: cred1
    posterior_probability: prob1
  credible_set_columns:
    - analysis_round
    - final_genomic_locus
    - source_primary_genomic_loci
    - credible_set
    - n_variants
    - target_coverage
    - achieved_component_coverage
    - achieved_coverage
    - global_pip_sum
    - component_log10bf
    - min_abs_ld
    - model_k
    - model_posterior_probability
    - warning_reason
    - final_selection_reason
  locus_status_columns:
    - genomic_locus
    - status
    - stage
    - converged
    - outcome_reason
    - recovery_method
    - warning_reason
    - failure_reason
    - input_variant_count
    - n_variants
    - selected_nef
    - nef_relative_range
    - ld_z_mismatch_lambda
    - ld_min_eigenvalue
    - estimated_peak_ld_memory_gb
  overlap_columns:
    - overlap_group_id
    - primary_genomic_locus
    - chromosome
    - primary_start
    - primary_end
    - joint_genomic_locus
    - resolution_status
    - resolution_reason
    - primary_warning_reason
    - joint_warning_reason
    - joint_failure_reason
  preflight_columns: [category, check, status, value, path, detail]
  susie_recovery_columns:
    - genomic_locus
    - sequence
    - stage
    - action
    - status
    - reason
    - ld_status
    - repairable
    - L
    - max_iter
    - timeout_seconds
    - ld_z_mismatch_lambda
    - ld_min_eigenvalue
    - details
  finemap_model_columns:
    - Locus
    - File_Name
    - K_Causal
    - Posterior_Prob
    - Selected
    - Validation_Status
    - Failure_Reason
    - Failure_Detail
output_layout:
  results_directory: results
  combined_results_directory: results/combined_results
  primary_credible_sets_directory: results/primary_credible_sets
  diagnostic_plots_directory: results/diagnostic_plots
  fitted_models_directory: intermediate_files/fitted_models
  quality_control_directory: quality_control
  locus_logs_directory: quality_control/locus_logs
  ld_diagnostics_directory: quality_control/ld_diagnostics
  run_metadata_directory: run_metadata
  downstream_inputs_directory: downstream_inputs
  downstream_flames_directory: downstream_inputs/flames
  downstream_flames_annotations_directory: downstream_inputs/flames/annotations
  intermediate_directory: intermediate_files
  workers_directory: intermediate_files/susie_workers
  locus_chunks_directory: intermediate_files/locus_chunks
  prepared_loci_directory: intermediate_files/prepared_loci
  summary_statistics_directory: intermediate_files/summary_statistics
  chromosome_cache_directory: intermediate_files/summary_statistics/chromosome_cache
  locus_summary_statistics_directory: intermediate_files/summary_statistics/locus_inputs
  primary_flames_directory: intermediate_files/primary_flames_handoff
  primary_flames_annotations_directory: intermediate_files/primary_flames_handoff/annotations
  finemap_inputs_directory: intermediate_files/finemap_inputs
  finemap_locus_work_directory: intermediate_files/finemap_locus_work
  finemap_selected_models_directory: intermediate_files/selected_finemap_models
  joint_rerun_directory: intermediate_files/overlap_joint_rerun
  pipeline_log_file: run_metadata/pipeline_summary.log
  pipeline_progress_file: run_metadata/pipeline_progress.tsv
  run_configuration_file: run_metadata/run_configuration.json
  resolved_susie_configuration_file: run_metadata/resolved_susie_configuration.json
  susie_software_versions_file: run_metadata/{dataset_id}_software_versions.tsv
  susie_r_configuration_file: run_metadata/{dataset_id}_run_configuration_r.tsv
  susie_r_software_versions_file: run_metadata/{dataset_id}_software_versions_r.tsv
  susie_combined_log_file: run_metadata/{dataset_id}_run_susie.log
  susie_combined_results_file: results/combined_results/{dataset_id}_SUSIE_combined_results.csv.gz
  susie_combined_credible_sets_file: results/combined_results/{dataset_id}_SUSIE_combined_credible_sets.csv
  susie_qc_file: quality_control/{dataset_id}_susie_locus_qc.tsv
  susie_failed_loci_file: quality_control/{dataset_id}_susie_failed_loci.tsv
  susie_locus_progress_file: quality_control/{dataset_id}_susie_locus_progress.tsv
  preflight_validation_file: quality_control/input_and_resource_validation.tsv
  html_report_file: results/{dataset_id}_fine_mapping_report.html
  finemap_input_qc_file: quality_control/finemap_input_harmonization_qc.tsv
  finemap_task_skips_file: quality_control/finemap_task_generation_skips.tsv
  finemap_locus_status_file: quality_control/finemap_locus_status.tsv
  finemap_model_summary_file: quality_control/finemap_model_selection_summary.csv
  finemap_software_versions_file: run_metadata/finemap_software_versions.tsv
  point_locus_windows_file: intermediate_files/prepared_loci/point_locus_windows.tsv
  range_locus_windows_file: intermediate_files/prepared_loci/range_locus_windows.tsv
  cleanup_successful_workers: true
summary_statistics_preparation:
  policy: exact_file_per_locus
  source_read_policy: single_streaming_pass
  validation_scope: analysed_chromosomes
  chunk_rows: 500000
  schema_inference_length: 10000
  separator: "\t"
  compression: infer
  chromosome_filename_template: "chromosome_{chromosome}.tsv"
  locus_filename_template: "locus_{index:06d}.tsv"
  chromosome_manifest_filename: chromosome_summary_statistics_manifest.tsv
  locus_manifest_filename: locus_summary_statistics_manifest.tsv
  preparation_summary_filename: summary_statistics_preparation_summary.tsv
overlap_resolution:
  policy: rerun_connected_groups
  maximum_joint_region_kb: null
  joint_failure_policy: exclude_and_report
  plan_filename: overlapping_loci_resolution.tsv
  summary_filename: overlap_resolution_summary.tsv
  joint_locus_filename: joint_rerun_loci.tsv
  final_combined_filename: final_combined_credible_sets.tsv
  configuration_filename: overlap_resolution_configuration.json
  index_filename: indexfile.txt
  genomic_loci_filename: genomic_loci.tsv
  annotation_prefix: annotated_
  overlap_group_prefix: overlap_group_
  provenance_delimiter: ";"
  primary_file_prefix: primary__
  joint_file_prefix: joint__
engines:
  susie:
    max_causal_components: 10
    minimum_purity: 0.5
    credible_set_tolerance: 0.001
    recovery_audit_filename: susie_recovery_audit.tsv
    fitting:
      main_max_iter: 100
    recovery:
      max_iter: 600
      repaired_max_iter: 300
      reduced_l_max: 5
      ld_retry_multiplier: 2.0
      ld_retry_add_seconds: 60
      timeout_multiplier: 4.0
      ld_repair_timeout_multiplier: 3.0
      repaired_timeout_multiplier: 3.0
    ld_validation:
      eigenvalue_tolerance: 0.0001
      eigenvalue_floor: 1.0e-8
      mismatch_warning_threshold: 0.01
      mismatch_failure_threshold: 0.1
      repair_maximum_change: 0.05
    execution:
      ld_timeout_seconds: 180
      susie_timeout_seconds: 180
      plink_timeout_seconds: 500
      process_poll_seconds: 0.25
      termination_grace_seconds: 0.5
      stderr_tail_lines: 50
      verbose: false
    memory:
      used_threshold_percent: 96
      check_interval_seconds: 10
      maximum_wait_seconds: 21600
      meminfo_read_lines: 50
    plotting:
      minimum_pip_to_label: 0.01
      background_point_size: 0.01
      background_alpha: 0.15
      credible_set_point_size: 1.0
      credible_set_alpha: 0.2
      maximum_ld_dimension: 5000
      width: 11.0
      height: 12.0
      dpi: 300
      ld_palette_colors: 256
      legend_gradient_points: 100
      legend_title_size: 8.0
      legend_text_size: 7.0
      legend_key_size_cm: 0.3
      legend_scale: 0.55
      credible_set_legend_size: 3.0
      labels_per_credible_set: 5
      large_locus_threshold: 5000
      medium_locus_threshold: 2000
      large_locus_scale: 0.6
      medium_locus_scale: 0.8
      label_lift: 0.03
      label_size: 3.0
      label_segment_alpha: 0.7
      label_segment_width: 0.3
      panel_heights: [2.0, 1.0, 1.0]
      panel_widths: [5.0, 0.8]
  finemap:
    algorithm: sss
    ldstore_timeout_seconds: 21600
    finemap_timeout_seconds: 43200
    termination_grace_seconds: 30
    plink_memory_mb: 2000
    bgen_bits: 8
    external_tool_threads: 1
    n_causal_snps: 5
    n_iter: 100000
    n_conv_sss: 100
    prob_conv_sss_tol: 0.001
    n_configs_top: 50000
    corr_config: 0.95
    pvalue_snps: 1.0
    cond_pvalue: 5.0e-8
    prior_std: 0.05
    prior_k: false
    force_n_samples: false
    std_effects: false
    flames_manifest_filename: finemap_FLAMES_manifest.tsv
