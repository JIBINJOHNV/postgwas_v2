    liftover_warn_fraction:            0.1     # What it does: Sets the share of failed liftovers above…
    liftover_critical_fraction:        0.3     # What it does: Sets the share of failed liftovers at…
    liftover_fail_fraction:            1.0     # What it does: Sets the share of failed liftovers above…
    variant_drop_warn_fraction:        0.2     # What it does: Sets how large a fall in variant count…
    min_valid_size_bytes:              100     # What it does: Sets the file size below which a…
    sort_memory_mb_per_thread:         512     # What it does: Sets how much memory the sort at the end…
    concat_max_workers:                3       # What it does: Sets how many of the per-chromosome VCF…
    on_merge_failure:                  continue # continue | fail

  # 16  post-merge 04   the QC-passed variant filter
  filter:
    af_diff_cutoff:                    0.2     # What it does: Sets how far the study's allele frequency…
    af_missing:                        remove  # remove | keep
    maf_cutoff:                        0.01    # What it does: Sets the minor allele frequency below…
    info_cutoff:                       0.7     # What it does: Sets the lowest imputation quality score a…
    info_max:                          1.05    # What it does: Sets the highest imputation quality score…
    info_missing:                      remove  # remove | keep
    include_indels:                    false   # What it does: Decides whether insertions and deletions…
    lp_cutoff:                         null    # What it does: Sets a significance threshold for the…
