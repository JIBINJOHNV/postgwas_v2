    remove_mhc:                        true    # What it does: Cuts the major histocompatibility complex…
    mhc_chrom:                         "6"     # What it does: Names the chromosome carrying the major…
    mhc_end:                           34000000 # What it does: Sets the last base position of the MHC…
    mhc_start:                         25000000 # What it does: Sets the first base position of the MHC…
    empty_expression:                  match_all # match_all | match_none

  # 17  post-merge 03 and 05   QC summary
  qc:
    target_build:                      GRCh37  # GRCh37 | GRCh38 | input
    report_singleton_stats:            true    # What it does: Adds five singleton columns -…

  # 18  throughout      threads, retries, memory
  execution:
    threads_per_chromosome:            5       # What it does: How many threads one chromosome worker…
    total_cpu_budget:                  null    # What it does: Caps the total number of cores the…
    max_retry_rounds:                  2       # What it does: How many extra passes over the…
    clean_before_retry:                true    # What it does: Deletes a chromosome's partial output…
    retry_requires_progress:           true    # What it does: Stops the retry loop as soon as a whole…
