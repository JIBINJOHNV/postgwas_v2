    on_maf_check_inconclusive:         accept  # accept | reject | fail
    verify_per_chromosome:             false   # What it does: Repeats the "is this column a minor allele…

  # 11  chromosome 05   sample size and effective N
  sample_size:
    trait_type:                        auto    # auto | binary | quantitative
    min_value:                         0       # What it does: Sets the smallest case count, control…
    controls_only:                     use_ncontrol_as_total # use_ncontrol_as_total | fail
    cases_only:                        use_ncase # use_ncase | fail

  # 12  chromosome 11   the SE / BETA / Z gates
  validation:
    se_invalid:                        reject  # reject | keep | fail
    se_from_clipped_pval:              reject  # reject | keep | fail
    beta_invalid:                      reject  # reject | keep | fail
    beta_zero:                         reject  # keep | reject | fail
    z_invalid:                         reject  # reject | keep | fail
    z_pval_concordance:                "off"   # off | warn | reject | fail
    z_pval_tolerance_log10:            1.0     # What it does: Sets how far the p-value implied by the Z…
    warn_reject_fraction:              0.2     # What it does: Sets the share of a chromosome's variants…
    max_reject_fraction:               1.0     # What it does: Sets the share of a chromosome's variants…
    on_ambiguous_column_mapping:       fail    # fail | warn
    fuzzy_match_cutoff:                0.6     # What it does: Sets how similar a column name in the file…
    on_duplicate_header:               fail    # fail | warn

  # 13  chromosome 12   imputation quality
  info:
    out_of_range:                      clip    # clip | null | reject | fail
    clip_min:                          0.0     # What it does: Sets the lowest imputation quality score…
    clip_max:                          1.0     # What it does: Sets the highest imputation quality score…
    clip_tolerance:                    1.05    # What it does: Sets how far above the ceiling a score may…
    low_quality_threshold:             0.3     # What it does: Sets the score at or below which a variant…
    on_missing:                        keep    # keep | reject | fail
    deduplicate_reference:             false   # What it does: Removes repeated rows from the…
    source:                            auto    # auto | study | reference | external

  # 14  chromosome 14   final completeness gate
  final_check:
    require:                           [chr, pos, eaf, beta, se, zscore, pval] # What it does: Lists the fields that must hold a usable…
    treat_as_missing:                  ["null", "nan", "inf"] # What it does: Lists what counts as a missing value at…
    on_missing:                        reject  # reject | keep | fail

  # 15  chromosome 16-17 and the merge   VCF conversion and liftover
